<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мафия: Выживание</title>
<meta name="theme-color" content="#0d0f14">
<meta name="description" content="Мафия с выживанием: каждый со своего телефона, 8 сценариев, кризисы и общий инвентарь.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@400;600;800&family=PT+Mono&family=Caveat:wght@500&family=Neucha&display=swap" rel="stylesheet">
<style>
/* VOICE: ночная настольная игра, напряжённая и игровая
   IDEA: колода карт и досье следователя, раскладываемые на столе
   PICTURE: силуэт места катастрофы на каждой карте сценария, рубашка карт роли
   COLOUR and TYPE: глубокая ночь, акцент сценария, красный для мафии; Russo One + Manrope
   LAYOUT: одна колонка под телефон, липкая шапка со шкалами, панель ведущего снизу */
:root{color-scheme:dark;--bg:#0d0f14;--bg2:#141821;--card:#191e29;--line:#2a3140;--ink:#efe9dd;--mute:#9aa1ad;--acc:#b5d94a;--red:#e0414b;--ok:#55c38a;--r:14px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--acc) 14%,transparent),transparent 60%),var(--sbg,var(--bg));color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,h3,.disp{font-family:"Russo One",Manrope,sans-serif;font-weight:400;line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,9vw,52px)}h2{font-size:26px}h3{font-size:20px}
p{margin:.4em 0}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:#0b0e13;border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 120px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;text-align:center}
.btn.pri{background:var(--acc);color:#0c0e10;border-color:transparent}
.btn.red{background:var(--red);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 140px}
.mute{color:var(--mute)}.small{font-size:14px}.tiny{font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.box.acc{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.lbl{font-size:13px;color:var(--mute);font-weight:600;margin-bottom:6px}
.hero{padding:22px 0 8px}
.hero h1 span{color:var(--acc)}
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 12px;margin:0 -16px;padding-inline:16px}
.sc{flex:0 0 78%;max-width:320px;scroll-snap-align:start;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card);text-align:left;padding:0}
.sc .pic{display:block;aspect-ratio:300/150;background:var(--b);color:var(--a)}
.sc .pic svg{width:100%;height:100%;display:block}
.sc .tx{display:block;padding:12px 14px 14px}
.sc.on{outline:3px solid var(--a);outline-offset:-3px}
.sc small{color:var(--a);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--sbg,var(--bg)) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:-16px -16px 12px;padding:10px 16px 8px}
.top .t1{display:flex;justify-content:space-between;gap:8px;align-items:center}.top .t1>span.small{flex:1;text-align:right}
.tg2{display:inline-flex;gap:6px;flex:none}.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#0b0e13;display:grid;place-items:center;color:var(--mute)}.ib svg{width:18px;height:18px}.ib.on{color:#111;background:var(--acc);border-color:var(--acc)}
.top .t1 b{font-family:"Russo One";font-weight:400;color:var(--acc)}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.mt{position:relative;background:#0b0e13;border:1px solid var(--line);border-radius:10px;padding:6px 9px 9px;font-size:13px;overflow:hidden}
.mt .mr{display:flex;align-items:center;gap:6px}
.mt svg{width:16px;height:16px;flex:none;color:var(--acc)}
.mt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.mt b{font-size:18px;font-family:"Russo One",sans-serif;font-weight:400}
.mt i{position:absolute;left:0;bottom:0;height:3px;width:var(--w);background:var(--acc);transition:width .6s}
.mt.low{border-color:var(--red)}.mt.low i{background:var(--red)}.mt.low svg{color:var(--red)}
.inv{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:#0b0e13;border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.acc{border-color:var(--acc);color:var(--acc)}
.chip.wrap{white-space:normal;border-radius:12px}
.chip.red{border-color:var(--red);color:#ff8a90}
.tabs{display:flex;gap:6px;margin:4px 0 12px}
.tabs button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:14px}
.tabs button.on{background:var(--ink);color:#111}
.narr{position:relative;padding:18px;border-radius:var(--r);background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 12%,var(--card)),var(--card));border:1px solid var(--line);margin:12px 0}
.narr .k{font-size:13px;color:var(--acc);font-weight:800;margin-bottom:6px}
.narr p{font-size:17px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:10px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);min-height:56px}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.opt:disabled{opacity:.45}
.opt .tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.opt .who{margin-top:6px;font-size:13px;color:var(--mute)}
.pl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);min-height:56px}
.pl .av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:"Russo One";background:color-mix(in srgb,var(--acc) 20%,#0b0e13);color:var(--acc)}
.pl .nm{flex:1}
.pl .nm b{display:block}
.pl.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.pl.dead{opacity:.45}
.pl:disabled{opacity:.4}
.q{font-size:14px;color:#d8d2c4;border-left:2px solid var(--acc);padding-left:8px;margin:4px 0}
mark{background:color-mix(in srgb,var(--acc) 35%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.card{perspective:1000px;width:min(78vw,300px);aspect-ratio:2/3;margin:10px auto;cursor:pointer;border:0;background:none;padding:0;display:block}
.cin{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.card.on .cin{transform:rotateY(180deg)}
.cb{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.back{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--acc) 22%,#10131a) 0 10px,#10131a 10px 20px);color:var(--acc)}
.back .em{width:84%;aspect-ratio:1;border-radius:50%;border:3px solid var(--acc);display:grid;place-items:center;background:#0d1016}
.back .em svg{width:60%;height:60%}
.back p{margin-top:16px;font-weight:800;color:var(--ink)}
.front{transform:rotateY(180deg);background:radial-gradient(90% 70% at 50% 25%,var(--rc2),var(--rc) 70%);color:#fff}
.front svg{width:42%;height:auto;margin-bottom:10px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.front h3{font-size:28px}
.front em{font-style:normal;font-size:13px;font-weight:800;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.3);margin:8px 0}
.front p{font-size:14px;line-height:1.4}
.r-maf{--rc:#5a0d16;--rc2:#c01f33}.r-doc{--rc:#0c3b3a;--rc2:#1fa59a}.r-det{--rc:#13284a;--rc2:#3b7bd1}.r-civ{--rc:#3a3226;--rc2:#a08a63}
.legend{text-align:center;margin:6px auto 0;max-width:320px}
.mis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.mis button{aspect-ratio:3/4;border-radius:18px;border:2px solid var(--line);background:var(--card);font-family:"Russo One",sans-serif;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
.mis button svg{width:48px;height:48px}
.mis .h{color:var(--ok)}.mis .s{color:var(--red)}
.mis button.on{border-color:currentColor;box-shadow:0 0 0 3px currentColor inset}
.timer{font-family:"Russo One";font-size:clamp(48px,16vw,72px);text-align:center;color:var(--acc);margin:6px 0;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.mic{display:flex;gap:8px;align-items:stretch}
.mic textarea{min-height:52px;resize:none;flex:1}
.micb{flex:none;width:56px;border-radius:12px;border:1px solid var(--line);background:#0b0e13;display:grid;place-items:center}
.micb svg{width:24px;height:24px}
.micb.on{background:var(--red);border-color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--red) 30%,transparent)}}
.spk{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.spk button{flex:none;min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px}
.spk button.on{background:var(--acc);color:#111;border-color:var(--acc)}
.hostbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,#07090c 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom))}
.hostbar .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
.hostbar .lab{flex:1;font-size:13px;color:var(--mute);line-height:1.25}
.hostbar .lab b{color:var(--ink);display:block;font-size:14px}
.hostbar .btn{flex:none}
.night{background:#05060a}
.code{font-family:"Russo One";font-size:56px;letter-spacing:.12em;color:var(--acc);text-align:center;line-height:1}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:20;background:#000;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw}
.pass{min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.pass .nmx{font-family:"Russo One";font-size:40px;color:var(--acc)}
.win{text-align:center;padding:26px 16px;border-radius:20px;margin:12px 0}
.win.town{background:linear-gradient(160deg,#173d2a,#0f1a14)}.win.maf{background:linear-gradient(160deg,#4a0f17,#160a0c)}
.st{border-collapse:collapse;width:100%;font-size:14px}.st th,.st td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.st th:first-child,.st td:first-child{text-align:left}.st th{color:var(--mute);font-weight:600;font-size:13px}.scroll{overflow-x:auto}
.wrap{position:relative}.credit{position:absolute;top:max(12px,env(safe-area-inset-top));right:16px;font-size:13px;color:var(--mute);background:color-mix(in srgb,var(--acc) 10%,#0b0e13);border:1px solid var(--line);border-radius:999px;padding:5px 12px;z-index:4}
.games{display:grid;gap:14px;margin:14px 0}.gcard{display:block;width:100%;text-align:left;padding:0;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.gcard .pic{display:block;aspect-ratio:300/130;background:var(--b);color:var(--a)}.gcard .pic svg{width:100%;height:100%;display:block}
.gcard .tx{display:block;padding:14px 16px 16px}.gcard small{color:var(--a);font-weight:800}.gcard h2{margin:4px 0 6px}.gcard .go{display:inline-flex;margin-top:12px;padding:10px 18px;border-radius:12px;background:var(--a);color:#111;font-weight:800}
.gcard.soon .tx{opacity:.7}
.binv{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.binv .chip{flex:none}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.bc{background:#0b0e13;border:1px solid var(--line);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;gap:2px}.bc b{font-size:14px;font-weight:700;line-height:1.3}.bc.hid{opacity:.55;border-style:dashed}.bc.act{margin-top:8px;border-color:var(--acc)}
.bp{border-top:1px solid var(--line);padding:10px 0}.bp:first-of-type{border-top:0}.bp.out{opacity:.75}.bph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.qr{width:200px;margin:12px auto;background:#fff;border-radius:12px;padding:6px}.qr svg{display:block;width:100%;height:auto}
.sep{height:1px;background:var(--line);margin:14px 0}
details summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
ul.rules{padding-left:20px}ul.rules li{margin:6px 0}
@media (prefers-reduced-motion:reduce){.cin,.mt i{transition:none}.micb.on{animation:none}}

/* escape */
.etmr{font-family:'PT Mono',monospace;font-size:22px;font-weight:700;color:var(--acc);letter-spacing:.04em}.etmr.low{color:#ff4b4b;animation:dflick 1s infinite}
.escare{margin:12px 0;padding:12px 14px;border-radius:12px;background:radial-gradient(circle at 0 0,#3a1010,#120808);border:1px solid #4a1a1a;color:#f0caca;font-style:italic;font-size:15px;animation:dflick 5s infinite}
.eletters{display:flex;gap:8px;justify-content:center;margin:8px 0}.eletters span{width:44px;height:52px;display:grid;place-items:center;border-radius:8px;background:#efe6d2;color:#2a2117;font-family:'PT Mono',monospace;font-size:26px;font-weight:700;box-shadow:0 3px 0 #b7a985}.eletters span:not(.on){background:#1d1a16;color:#5a5040;box-shadow:inset 0 0 0 1px #3a3328}
.box .eletters span.on,.epz .eletters span{background:#efe6d2;color:#2a2117}
.epz h3{margin:2px 0 6px}.ewheels{display:flex;gap:10px;justify-content:center;margin:12px 0 4px}.ewh{display:flex;flex-direction:column;align-items:center;gap:4px}
.ewh button{width:54px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#1d1f27;color:#e8e8ee;font-size:16px}.ewh b{font-family:'PT Mono',monospace;font-size:34px;width:54px;height:56px;display:grid;place-items:center;background:#efe6d2;color:#2a2117;border-radius:8px;box-shadow:inset 0 3px 8px rgba(0,0,0,.35)}.ewh small{font-size:11px;color:var(--mute)}
.eseq{display:flex;gap:8px;justify-content:center;margin:12px 0}.eseq span{width:48px;height:52px;display:grid;place-items:center;border-radius:8px;background:#efe6d2;color:#2a2117;font-size:26px}
.esyms{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.esyms button{width:52px;height:52px;border-radius:50%;border:2px solid #8a6c34;background:#2a2117;color:#f0d9a0;font-size:24px}.esyms button.clr{border-color:#555;color:#bbb;font-size:20px}
.ehint{background:rgba(224,162,74,.08);border-left:3px solid var(--acc);padding:8px 10px;border-radius:6px;margin-top:8px}
/* detective */
.dcover{position:relative;background:linear-gradient(160deg,#2a2016,#17110b);border:1px solid #4a3a26;border-radius:16px;padding:22px 18px;margin:14px 0;color:#e9dcc1;overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
.dcover h1{font-family:'PT Mono',monospace;font-size:34px;line-height:1.05;margin:6px 0 10px;color:#f1e6cf}.dcover h1 span{font-size:22px;color:#d94a4a}
.dcover.end p{font-size:15px;line-height:1.55;margin:0 0 10px}.dcover .k{font-family:'PT Mono',monospace;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#d94a4a;margin-bottom:8px}
.dstamp{position:absolute;right:-6px;top:16px;transform:rotate(12deg);border:3px solid #c0392b;color:#c0392b;font-family:'PT Mono',monospace;font-weight:700;text-transform:uppercase;font-size:12px;padding:4px 10px;opacity:.85;letter-spacing:.08em}
.dnight{background:radial-gradient(circle at 50% 0,#2a0c0c,#060404 70%);border:1px solid #3a1414;border-radius:16px;padding:24px 18px;margin:14px 0;text-align:center;animation:dflick 4s infinite}
.dnight .k{font-family:'PT Mono',monospace;color:#ff5a5a;letter-spacing:.2em;text-transform:uppercase;font-size:12px}.dnight p{font-size:17px;line-height:1.6;color:#e6d6d6;margin:14px 0 18px}
@keyframes dflick{0%,92%,100%{opacity:1}93%{opacity:.75}95%{opacity:1}97%{opacity:.85}}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.dtile{text-align:left;background:#efe6d2;color:#2a2117;border:0;border-radius:6px;padding:10px 12px 12px;min-height:74px;font:inherit;box-shadow:0 2px 0 #b7a985,0 6px 14px rgba(0,0,0,.35);transform:rotate(-.4deg);cursor:pointer}
.dtile:nth-child(2n){transform:rotate(.5deg)}.dtile b{display:block;font-size:14px;line-height:1.25;margin-top:4px}.dtile .mute{color:#7a6b52!important}
.dtile.night{background:#2a1515;color:#f0d6d6;box-shadow:0 2px 0 #5a2020,0 6px 14px rgba(0,0,0,.5)}.dtile.night .mute{color:#c08a8a!important}
.dreq{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}.dreq.got{opacity:.55}.dreq .btn{flex:0 0 auto}
.dlock{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}.dlock.open{opacity:.7}
.dans{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.dmodal{position:fixed;inset:0;z-index:60;background:rgba(5,4,3,.82);overflow:auto;padding:24px 12px 120px;-webkit-overflow-scrolling:touch}
.dpaper{position:relative;max-width:620px;margin:0 auto;background:#f3ead6;color:#231b12;border-radius:4px;padding:22px 18px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6);font-size:15px;line-height:1.5;background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(80,60,30,.06) 27px 28px)}
.dpaper h3{font-family:'PT Mono',monospace;font-size:18px;margin:4px 0 12px;color:#1b140c}.dtag{font-family:'PT Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#8a7350}
.dpaper.ty-diary,.dpaper.ty-scene{background-color:#eee3c8}.dpaper.ty-news{background:#e7e1d3;font-family:Georgia,serif}.dpaper.ty-phone{background:#15181d;color:#e6e8ec;background-image:none}.dpaper.ty-phone h3{color:#fff}
.dpaper.ty-lab{background-color:#f4f6f2}.dpaper.ty-talk{background-color:#f1ede4}
.dh{font-family:'PT Mono',monospace;font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;color:#5a4426}.dp{margin:0 0 9px}
.dm{font-family:'PT Mono',monospace;font-size:13.5px;white-space:pre-wrap;margin:0 0 9px}

{id:'mall',title:'Мёртвый ТЦ',sub:'Зомби-апокалипсис в торговом центре',acc:'#b5d94a',bg:'#0f140f',
intro:'Пятница, 21:40. По громкой связи объявили «технический сбой», и рольставни упали разом. Сквозь стекло главного входа видно, как охранник парковки идёт неровной походкой, и у него нет половины лица. Вы последние, кто остался внутри торгового центра. Военные обещают эвакуацию через несколько дней. Но среди вас есть укушенные. Они ещё выглядят как люди. Пока.',

epilogue:[
 'В 1998 году Пётр Гордеев запирал девятилетнюю дочь Лизу в подвале «в наказание». Однажды она упала с той же лестницы. Отец спрятал тело под полом подвала и сказал всем, что девочка ушла к реке. Одиннадцатилетний Олег всё видел. Отец заставил его молчать.',
 'Олег молчал двадцать семь лет. Он остался жить рядом, сохранил гараж на соседнем участке, из которого в подвал ведёт старый технический лаз с плана 1987 года, и хранил тетради сестры. Когда дом купила Вера и заказала вскрытие пола, тайна оказалась в нескольких днях от раскрытия.',
 'Сначала Олег пытался выжить Веру из дома. Он ставил ей проводку и замки и оставил себе сервисный ключ. По ночам он пробирался через лаз, стучал в стены и подбрасывал записки, срисовывая почерк сестры из её школьных тетрадей. Посёлок охотно поверил в призрака.',
 'Вера узнала, что пол вскроют 14-го, и в ночь на 14 ноября Олег пришёл через лаз, чтобы перенести останки сестры в нишу за стеной. Вера услышала шум, нашла щель за стеллажом и сфотографировала руку в проёме. В 00:47 она успела написать подруге: «Он здесь. В стене. Это не призрак».',
 'На лестнице они столкнулись. Синяки на запястьях — след этой короткой борьбы. В 00:58 сердце Веры остановилось. Олег поднялся наверх, по привычке задвинул щеколду и ушёл тем же путём через гараж. В 00:30 Тамара Соболева видела свет фонаря в его гараже, а в 01:15 он погас.',
 'Утром рабочие нашли за кладкой подвала свёрток из брезента. Внутри были останки ребёнка и старая кукла.',
 'Лизу Гордееву похоронили через двадцать семь лет после того, как она «ушла к реке». Говорят, с тех пор в доме на Сосновой больше никто не стучит.'],

i1:{t:'Допрос: Максим Ланской',ty:'talk',k:'talk',d:'Бывший муж',b:[{q:[['Следователь','Вы были в Белом Яру в ночь на 14-е?'],['Максим','Да. Приехал поговорить. Хотел… вернуть её. Около половины одиннадцатого был у дома.'],['Следователь','И?'],['Максим','Она не пустила. Сказала через дверь, что в доме кто-то есть и ей не до меня. Я подумал — новый мужчина. Уехал в гостиницу в Приозёрск.'],['Следователь','Вы знали, что остаётесь выгодоприобретателем по страховке?'],['Максим','…Знал. Но я её не трогал. Проверьте камеры в гостинице.']]}]},
i2:{t:'Допрос: Олег Гордеев',ty:'talk',k:'talk',d:'Электрик, сын прежних хозяев',b:[{q:[['Следователь','Где вы были ночью 13 ноября?'],['Олег','Дома. Спал.'],['Следователь','Ключи от дома Ланской у вас есть?'],['Олег','Нет. Все ключи я отдал ей.'],['Следователь','Вы работали в доме 12 ноября. Что-нибудь странное?'],['Олег','Дом плохой. Я ей говорил — не трогайте подвал. Лиза не любит, когда трогают её вещи.'],['Следователь','Лиза — ваша сестра. Она пропала в 1998-м.'],['Олег','Она никуда не пропадала. (долгая пауза) Я хотел сказать… её не нашли.']]}]},
i3:{t:'Допрос: Тамара Соболева',ty:'talk',k:'talk',d:'Соседка напротив',b:[{q:[['Тамара','Я ей говорила — уезжай, девонька. Соль на пороги сыпала. Не послушала.'],['Следователь','Что вы видели вечером 13-го?'],['Тамара','В семь приехал этот, риелтор, на серебристой машине. Уехал минут через сорок, злой. В пол-одиннадцатого — чёрная машина, мужчина у двери стоял, потом уехал.'],['Следователь','А ночью?'],['Тамара','Не сплю я ночами, молюсь. В половине первого в гараже Гордеевых свет ходил. Фонарь. Будто кто-то внутри шарит. В четверть второго погас.'],['Следователь','Олег часто бывает в гараже?'],['Тамара','Днём бывает. Ночью — никогда не видела. Он у себя комнату Лизы до сих пор держит, как была. Тетрадки её, кукол. Не по-людски это.']]}]},
i4:{t:'Допрос: Денис Карпов',ty:'talk',k:'talk',d:'Риелтор',b:[{q:[['Следователь','Вы скрыли от покупательницы историю дома?'],['Денис','Я обязан говорить о дефектах, а не о сказках. Ну да, про пропавшую девочку не сказал. И что подвал сырой — тоже.'],['Следователь','13-го вы были у неё.'],['Денис','С семи до восьми. Она требовала вернуть часть денег, грозила судом. Я уехал в Приозёрск, сидел в баре «Кедр» до половины второго. Чек сохранился, бармен подтвердит.'],['Следователь','Вы знаете Олега Гордеева?'],['Денис','Он единственный был против продажи. Даже приходил в агентство, просил «не продавать подвал». Чудак.']]}]},
i5:{t:'Показания подруги, Е. Мельник',ty:'talk',k:'talk',d:'Получала сообщения от Веры',b:[{q:[['Катя','Она месяц писала мне про стуки. Я думала — нервы, переезд.'],['Следователь','Что она писала в ту ночь?'],['Катя','В 21:30: «Опять стучит. Сегодня найду, откуда». А в 00:47… вот, смотрите.']]},{sms:'он здесь. в стене. это не призрак'},{q:[['Катя','Я спала. Увидела утром. Если бы я тогда проснулась…']]}]},

o2:{t:'Обыск гаража Гордеева',ty:'scene',k:'scene',d:'Нужен ордер: улики против владельца',need:['o1','a3'],b:[{mono:'Под верстаком — люк. Под ним выход того самого лаза. Земля у люка свежая.'},{mono:'В гараже: фонарь с почти разряженной батареей, рулон брезента, рабочие ботинки в известковой пыли.'},{mono:'На полке коробка: школьные тетради Е. Гордеевой за 1997–1998 гг. На вырванных листах — прописи. Кто-то взрослый раз за разом обводил буквы детского почерка: «УХОДИ», «ДОМ», «ПОЛ».'},{red:'Ордер на задержание Гордеева О.П. подготовлен.'}]},
o3:{t:'Осмотр чердака',ty:'scene',k:'scene',d:'Старые вещи прежних хозяев',b:[{svg:'drawing'},{mono:'На балках — детские рисунки 1998 года, выцарапанные гвоздём и нарисованные мелом. Дом, под домом маленькая фигурка. Подпись: «Я в подвале. Папа злой».'},{mono:'В углу под досками — жестяная шкатулка с кодовым замком на 4 цифры. На крышке выцарапано: «ЛИЗА. МОЙ ДЕНЬ РОЖДЕНИЯ».'}]},

/* ---------- Детектив: механика ---------- */
const DD=()=>DCASE;
const dKnown=()=>{const d=S.det;return Object.keys(d.owned).concat(d.board)};
const dCanSee=(id,vp)=>{const d=S.det;return S.local||d.board.includes(id)||d.owned[id]===vp};
const dHas=id=>dKnown().includes(id);
function dStart(){const C=DD(),n=S.players.length;
  S.det={round:0,ap:0,apMax:n>=5?5:4,owned:{},board:[],opened:{},fails:{},acc:{},cnt:{},nonce:{}};
  const st=Object.entries(C.docs).filter(([,d])=>d.start&&d.start!=='board').map(([k])=>k);
  Object.entries(C.docs).forEach(([k,d])=>{if(d.start==='board')S.det.board.push(k)});
  const ps=shuf(S.players.map(p=>p.pid));shuf(st).forEach((k,i)=>{S.det.owned[k]=ps[i%ps.length];if(S.local)S.det.board.push(k)});
  S.players.forEach(p=>{p.alive=true;p.role='inv'});
  S.day=1;S.log=[];S.chron=[];S.priv={};S.votes=[];S.missions=[];S.win=null;S.res=null;S.final=null;S.meters={a:1,b:1,c:1};S.inv={};
  chron(`Дело №${C.no} «${C.title}» открыто. Следственная группа: ${n} чел.`);
  setPhase('intro')}
function dRound(){const d=S.det;d.round++;d.ap=d.apMax;d.fails={};S.day=d.round;setPhase('inv')}
function dAdvance(){const ph=S.phase,d=S.det;
  if(ph==='intro')dRound();
  else if(ph==='inv'){if(d.round<3){const nt=DD().nights[d.round];if(nt&&!d.board.includes(nt.doc))d.board.push(nt.doc);chron(nt.t+': '+DD().docs[nt.doc].t+'.');setPhase('dnight')}else setPhase('accuse')}
  else if(ph==='dnight')dRound()}
function dNeed(){if(S.phase==='accuse')return S.local?[[S.players[0].pid,'acc']]:S.players.map(p=>[p.pid,'acc']);return null}
function dAuto(){if(!S.local&&['intro','inv','dnight'].includes(S.phase)){const g=goN(),t=pool().length;if(t&&(g>=t||(g>=goNeed()&&age()>(S.phase==='inv'?45:20))))dAdvance();return}
  if(S.phase==='accuse'){const n=dNeed();if(n.every(([pid,k])=>has(pid,k)))dFinish();else if(!S.local&&goN()>=goNeed()&&age()>60)dFinish()}}
function dReqOk(id){const C=DD(),doc=C.docs[id],d=S.det;if(!doc||!doc.k||dHas(id))return false;return (doc.need||[]).every(dHas)}
function dInput(pid,k,v){const p=P(pid);if(!p)return false;const d=S.det,C=DD();
  if(v&&typeof v==='object'&&v.n!=null){if((d.nonce[pid]||{})[k]===v.n)return false;(d.nonce[pid]=d.nonce[pid]||{})[k]=v.n}
  const cn_=x=>{const c=d.cnt[pid]=d.cnt[pid]||{};c[x]=(c[x]||0)+1};
  if(k==='req'&&S.phase==='inv'){const id=v&&v.id;if(d.ap<=0||!dReqOk(id))return false;d.owned[id]=pid;if(S.local)d.board.push(id);d.ap--;cn_('req');chron(`${p.name}: ${DKIND[C.docs[id].k].toLowerCase()} — «${C.docs[id].t}».`);return true}
  if(k==='share'){const id=v&&v.id;if(d.owned[id]!==pid||d.board.includes(id))return false;d.board.push(id);cn_('share');return true}
  if(k==='code'&&S.phase==='inv'){const L=C.locks[v&&v.k];if(!L||d.opened[v.k]||!L.avail(dKnown()))return false;const f=(d.fails[v.k]=d.fails[v.k]||0);if(f>=3)return false;
    if(String(v.val||'').trim()===L.code){d.opened[v.k]=pid;L.gives.forEach(g=>{d.owned[g]=pid;if(S.local)d.board.push(g)});cn_('lock');chron(`${p.name} открыл(а): ${L.t}.`)}else{d.fails[v.k]=f+1;chron(`Неверный код: ${L.t} (попытка ${f+1} из 3 на сегодня).`)}return true}
  if(k==='acc'&&S.phase==='accuse'&&v&&typeof v==='object'){const a={};C.qs.forEach(q=>{if(q.o.some(o=>o[0]===v[q.k]))a[q.k]=v[q.k]});if(Object.keys(a).length!==C.qs.length)return false;if(JSON.stringify((S.inp[pid]||{}).acc)===JSON.stringify(a))return false;S.inp[pid]={...(S.inp[pid]||{}),acc:a};dAuto();return true}
  return false}
function dFinish(){const C=DD(),pts={},won={},score={},awards=[];const subs=S.players.filter(p=>S.inp[p.pid]?.acc);
  const team={};C.qs.forEach(q=>{const c={};subs.forEach(p=>{const v=S.inp[p.pid].acc[q.k];c[v]=(c[v]||0)+1});let b=null,bv=0;for(const [k,v] of Object.entries(c))if(v>bv){bv=v;b=k}team[q.k]=b});
  S.players.forEach(p=>{const a=S.inp[p.pid]?.acc||(S.local?team:null);let s=0;if(a)C.qs.forEach(q=>{if(a[q.k]===q.a)s++});score[p.pid]=s;pts[p.pid]=s*2+(s===C.qs.length?2:0);won[p.pid]=!!a&&a.who===C.qs[0].a});
  const solved=team.who===C.qs[0].a&&team.why===C.qs[2].a;
  const best=(f,k,t,min=1)=>{let b=null,bv=-1,tie=false;S.players.forEach(p=>{const v=f(p);if(v>bv){bv=v;b=p;tie=false}else if(v===bv)tie=true});if(b&&!tie&&bv>=min)awards.push({k,t,pid:b.pid})};
  if(!S.local){best(p=>score[p.pid],'Главный детектив','больше всех верных ответов',3);best(p=>(S.det.cnt[p.pid]||{}).req||0,'Архивариус','больше всех запросов');best(p=>(S.det.cnt[p.pid]||{}).lock||0,'Взломщик','открыл(а) запертые улики');best(p=>S.log.filter(l=>l.s===p.pid).length,'Голос разума','больше всех рассуждал(а) вслух в протоколе',3)}
  awards.forEach(a=>pts[a.pid]=(pts[a.pid]||0)+1);
  S.win={side:solved?'town':'lost',why:solved?'Дело раскрыто.':'Дело осталось нераскрытым.'};S.final={pts,won,score,team,awards,goals:{},snipe:{}};chron(S.win.why);setPhase('end')}

function dBlock(b){if(b.h)return `<h4 class="dh">${esc(b.h)}</h4>`;if(b.p)return `<p class="dp">${esc(b.p)}</p>`;if(b.mono)return `<p class="dm">${esc(b.mono)}</p>`;if(b.hand)return `<p class="dhand">${esc(b.hand)}</p>`;if(b.child)return `<p class="dchild">${esc(b.child)}</p>`;
  if(b.tiny)return `<p class="dtiny">${esc(b.tiny)}</p>`;if(b.red)return `<p class="dred">${esc(b.red)}</p>`;if(b.sig)return `<p class="dsig">${esc(b.sig)}</p>`;if(b.svg)return DSVG[b.svg]||'';
  if(b.sms)return `<div class="dsms">${esc(b.sms)}</div>`;if(b.kv)return `<table class="dkv">${b.kv.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>`;
  if(b.q)return `<div class="dq">${b.q.map(([w,t])=>`<p><b>${esc(w)}:</b> ${esc(t)}</p>`).join('')}</div>`;return ''}
function dDocView(id,vp){const doc=DD().docs[id];if(!doc)return '';const d=S.det,mine_=d.owned[id]===vp&&!d.board.includes(id)&&!S.local;
  return `<div class="dmodal" data-act="dclose"><div class="dpaper ty-${doc.ty}" data-act="noop"><div class="dtag">${esc(DICON[doc.ty]||'')}${d.board.includes(id)?' · на общей доске':' · только у вас'}</div><h3>${esc(doc.t)}</h3>${doc.b.map(dBlock).join('')}
  <div class="row" style="margin-top:14px">${mine_?`<button class="btn pri" data-act="dshare" data-v="${id}">Выложить на общую доску</button>`:''}<button class="btn" data-act="dclose">Закрыть</button></div></div></div>`}
function dTile(id,vp){const doc=DD().docs[id],d=S.det,o=d.owned[id];const fresh=DD().nights&&doc.night;return `<button class="dtile ${fresh?'night':''}" data-act="dopen" data-v="${id}"><span class="tiny mute">${esc(DICON[doc.ty]||'')}${!d.board.includes(id)&&o&&o!==vp?' · у '+esc(nm(o)):''}</span><b>${esc(doc.t)}</b></button>`}
function dTop(){const d=S.det;return `<div class="top"><div class="t1"><b>Дело №${DD().no} · ${esc(DD().title)}</b><span class="small mute">${d&&d.round?`День ${d.round} из 3 · запросов: ${d.ap}`:''}</span>${toggles()}</div></div>`}
function dNarr(){const C=DD(),d=S.det;switch(S.phase){case 'intro':return C.opening;case 'inv':return `День расследования ${d.round}. У группы ${d.ap} запросов.`;case 'dnight':{const n=C.nights[d.round];return n?n.x:''}case 'accuse':return 'Время назвать виновного.';case 'end':return S.win.why}return ''}
function dPhase(vp){const C=DD(),d=S.det,ph=S.phase;let h='';
  if(ui.dDoc&&dCanSee(ui.dDoc,vp))h+=dDocView(ui.dDoc,vp);
  if(ph==='intro')return h+`<div class="dcover"><div class="dstamp">Совершенно секретно</div><div class="tiny mute">Уголовное дело</div><h1>№${C.no}<br><span>${esc(C.title)}</span></h1><p class="small">${esc(C.sub)}</p></div>
    <div class="narr"><div class="k">Пролог</div><p>${esc(C.opening)}</p></div>
    <div class="box"><div class="lbl">Как вести расследование</div><ul class="rules small"><li>Вы — следственная группа. У каждого на телефоне свои документы, другие их не видят. Читайте вслух, пересказывайте или выкладывайте на общую доску.</li><li>Каждый день у группы ограниченное число запросов: архив, допросы, лаборатория, осмотр места. Некоторые запросы откроются только после других улик.</li><li>Некоторые улики заперты кодом. Ответ спрятан в бумагах, возможно, у кого-то другого.</li><li>Через 3 дня каждый тайно отвечает на вопросы следствия. Затем — правда.</li></ul></div>`;
  if(ph==='dnight'){const n=C.nights[d.round];return h+`<div class="dnight"><div class="k">${esc(n.t)}</div><p>${esc(n.x)}</p><button class="btn" data-act="dopen" data-v="${n.doc}">Открыть: ${esc(C.docs[n.doc].t)}</button></div>`}
  if(ph==='inv'){const mine_=Object.keys(d.owned).filter(k=>d.owned[k]===vp&&!d.board.includes(k));
    h+=`<div class="narr"><div class="k">День ${d.round} из 3</div><p>У группы осталось запросов: <b>${d.ap}</b> из ${d.apMax}. Обсуждайте, что запрашивать: всего не успеть. Когда всё обсудили, нажмите «Завершить день».</p></div>`;
    h+=`<div class="box"><div class="lbl">Общая доска · ${d.board.length}</div><div class="dgrid">${d.board.map(k=>dTile(k,vp)).join('')}</div></div>`;
    if(!S.local)h+=`<div class="box acc"><div class="lbl">Мои документы · видите только вы · ${mine_.length}</div>${mine_.length?`<div class="dgrid">${mine_.map(k=>dTile(k,vp)).join('')}</div>`:'<p class="small mute">Всё, что было, вы уже выложили на доску.</p>'}</div>`;
    const others=Object.keys(d.owned).filter(k=>d.owned[k]!==vp&&!d.board.includes(k));
    if(!S.local&&others.length)h+=`<p class="small mute">У других игроков на руках ещё ${others.length} документ(ов), которые вы не видели: ${others.map(k=>esc(nm(d.owned[k]))).filter((v,i,a)=>a.indexOf(v)===i).join(', ')}.</p>`;
    h+=dLocks(vp);
    h+=`<div class="box"><div class="lbl">Запросы · осталось ${d.ap}</div>${Object.entries(DKIND).map(([kk,kn])=>{const items=Object.entries(C.docs).filter(([,x])=>x.k===kk);return `<div class="lbl" style="margin-top:10px">${kn}</div>`+items.map(([id,x])=>{const got=dHas(id),ok=dReqOk(id);const needTxt=(x.need||[]).filter(n=>!dHas(n)).map(n=>'«'+C.docs[n].t+'»').join(', ');
      return `<div class="dreq ${got?'got':''}"><div><b>${esc(x.t)}</b><span class="tiny mute" style="display:block">${got?'Получено: '+esc(nm(d.owned[id])):esc(x.d||'')}${!got&&needTxt?' · сначала нужно: '+needTxt:''}</span></div>${got?'':`<button class="btn sm ${ok&&d.ap>0?'pri':''}" data-act="dreq" data-v="${id}" ${ok&&d.ap>0?'':'disabled'}>Запросить</button>`}</div>`}).join('')}).join('')}</div>`;
    return h+micPanel()}
  if(ph==='accuse'){const my=(S.inp[vp]||{}).acc||ui.dAcc||{};const sent=!!(S.inp[vp]||{}).acc||(!S.local&&ui.dSent===S.pk);
    h+=`<div class="narr"><div class="k">Обвинение</div><p>${S.local?'Обсудите и ответьте всей группой.':'Каждый отвечает тайно. Очки за каждый верный ответ.'} Документы можно перечитать во вкладке «Досье».</p></div>`;

    h+=C.qs.map(q=>`<div class="box"><div class="lbl">${esc(q.t)}</div>${q.o.map(([k,t])=>`<button class="opt ${my[q.k]===k?'on':''}" data-act="dans" data-v="${q.k}:${k}" style="margin:6px 0;min-height:0;padding:10px 14px">${esc(t)}</button>`).join('')}</div>`).join('');
    const full=C.qs.every(q=>my[q.k]);return h+`<button class="btn pri" style="width:100%" data-act="dsend" ${full?'':'disabled'}>${full?'Отправить ответ':'Ответьте на все вопросы'}</button>`}
  if(ph==='end')return h+dEndView(vp);
  return h}
function waitListAcc(){const miss=S.players.filter(p=>!(S.inp[p.pid]||{}).acc).map(p=>p.name);return miss.length?`<p class="tiny mute">Ждём: ${esc(miss.join(', '))}</p>`:''}
function dLocks(vp){const C=DD(),d=S.det;const ls=Object.entries(C.locks).filter(([k,L])=>L.avail(dKnown()));if(!ls.length)return '';
  return `<div class="box"><div class="lbl">Запертые улики</div>${ls.map(([k,L])=>{const op=d.opened[k];const f=d.fails[k]||0;return `<div class="dlock ${op?'open':''}"><b>${esc(L.t)}</b><span class="tiny mute" style="display:block">${esc(L.d)} Подсказка: ${esc(L.hint)}</span>${op?`<span class="tiny" style="color:#7fe0a8">Открыто: ${esc(nm(op))}</span>`:f>=3?'<span class="tiny" style="color:#ff8a90">Три неверные попытки — замок заблокирован до завтра.</span>':`<div class="row" style="margin-top:6px"><input id="code_${k}" data-bind="c_${k}" value="${esc(ui['c_'+k]||'')}" inputmode="numeric" maxlength="4" placeholder="••••" style="flex:1 1 90px;letter-spacing:.3em;text-align:center"><button class="btn sm" data-act="dcode" data-v="${k}">Открыть</button></div>${f?`<span class="tiny mute">Неверных попыток сегодня: ${f} из 3</span>`:''}`}</div>`}).join('')}</div>`}
function dEndView(vp){const C=DD(),F=S.final||{pts:{},score:{},team:{},awards:[]};recordStats();const solved=S.win.side==='town';
  const rows=S.players.slice().sort((a,b)=>(F.pts[b.pid]||0)-(F.pts[a.pid]||0));const my=(S.inp[vp]||{}).acc;
  return `<div class="win ${solved?'town':'maf'}"><h1>${solved?'Дело раскрыто':'Дело не раскрыто'}</h1><p>${solved?'Группа верно назвала виновного и мотив.':'Группа ошиблась. Но правда всё равно выйдет наружу.'}</p></div>
  <div class="box"><div class="lbl">Ответы следствия</div>${C.qs.map(q=>{const ans=q.o.find(o=>o[0]===q.a)[1];const tm=F.team[q.k];const tmt=(q.o.find(o=>o[0]===tm)||[,'—'])[1];const mv=my?q.o.find(o=>o[0]===my[q.k]):null;
    return `<div class="dans"><b>${esc(q.t)}</b><span class="small" style="display:block;color:#7fe0a8">Правда: ${esc(ans)}</span><span class="tiny" style="display:block;color:${tm===q.a?'#7fe0a8':'#ff8a90'}">Группа: ${esc(tmt)}</span>${mv?`<span class="tiny mute" style="display:block">Вы: ${esc(mv[1])}</span>`:''}</div>`}).join('')}</div>
  <div class="dcover end"><div class="k">Что произошло на самом деле</div>${C.epilogue.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
  ${F.awards.length?`<div class="box acc"><div class="lbl">Награды</div>${F.awards.map(a=>`<p><b>${esc(a.k)}</b>: ${esc(nm(a.pid))}<br><span class="tiny mute">${esc(a.t)}</span></p>`).join('')}</div>`:''}
  ${S.local?'':`<div class="box"><div class="lbl">Очки</div>${rows.map(p=>`<p class="small"><b>${esc(p.name)}</b> · ${F.pts[p.pid]||0} оч. <span class="mute">· верных ответов ${F.score[p.pid]||0} из ${C.qs.length}</span></p>`).join('')}<p class="tiny mute">Очки: верный ответ +2, все ответы верны +2, награда +1.</p></div>`}
  <div class="row"><button class="btn pri" data-act="shareCard">Поделиться итогами</button><button class="btn" data-act="tab" data-v="stats">Статистика</button></div>`}
function dDossier(vp){const d=S.det,C=DD();const vis=Object.keys(C.docs).filter(k=>dHas(k)&&dCanSee(k,vp));return (ui.dDoc&&dCanSee(ui.dDoc,vp)?dDocView(ui.dDoc,vp):'')+`<div class="box"><div class="lbl">Все документы, которые вам доступны · ${vis.length}</div><div class="dgrid">${vis.map(k=>dTile(k,vp)).join('')}</div></div><div class="box"><div class="lbl">Журнал следствия</div>${S.chron.map(c=>`<p class="small"><b>Д${c.d}</b> ${esc(c.t)}</p>`).join('')}</div>`}
function dRules(){return `<details class="box"><summary>Правила за минуту</summary><ul class="rules small">
<li>Кооперативное расследование от 2 игроков. Вы — следственная группа, ведёте одно дело.</li>
<li>У каждого свои документы на телефоне. Делитесь голосом или выкладывайте на общую доску.</li>
<li>3 дня расследования. Каждый день у группы 4 запроса (5, если вас 5 и больше): архив, допросы, лаборатория, осмотр. Часть запросов открывается только после других улик.</li>
<li>Запертые улики открываются кодом, который спрятан в бумагах. 3 неверные попытки — замок закрыт до завтра.</li>
<li>Между днями — ночные события. В конце каждый тайно отвечает на 5 вопросов: кто, как, зачем, что случилось в прошлом и когда. Затем — правда.</li></ul></details>`}

const eFmt=t=>`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
const ePz=id=>ER.pz.find(p=>p.id===id);
function eOpen(p){const e=S.esc;if(e.solved[p.id])return false;if(p.fin)return ER.pz.every(q=>q.fin||e.solved[q.id]);return ER.pz.filter(q=>q.st<p.st).every(q=>e.solved[q.id])}
const eNorm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[\s.,!-]/g,'');
function eStart(){const n=S.players.length,ps=shuf(S.players.map(p=>p.pid));const cards={};let off=0;
  ER.pz.forEach(p=>{p.cards.forEach((c,i)=>cards[c]=ps[(off+i)%n]);off+=p.cards.length});
  S.esc={end:0,done:0,solved:{},cards,hints:{},last:null,cnt:{},nonce:{},wrong:0};
  S.players.forEach(p=>{p.alive=true;p.role='esc'});
  S.day=1;S.log=[];S.chron=[];S.priv={};S.win=null;S.res=null;S.final=null;S.inv={};S.meters={a:1,b:1,c:1};
  chron(`${ER.title}: заперты ${n} чел. До полуночи ${ER.min} минут.`);setPhase('eintro')}
function eGo(){S.esc.end=Date.now()+ER.min*60000;chron('Таймер пошёл.');setPhase('esc')}
function eAdvance(){if(S.phase==='eintro')eGo()}
function eAuto(){if(S.phase==='eintro'&&!S.local){const g=goN(),t=pool().length;if(t&&(g>=t||(g>=goNeed()&&age()>25)))eGo();return}
  if(S.phase==='esc'&&S.esc.end&&Date.now()>S.esc.end)eFinish(false)}
function eInput(pid,k,v){const p=P(pid),e=S.esc;if(!p||S.phase!=='esc'||!v||typeof v!=='object')return false;
  if(v.n!=null){if((e.nonce[pid]||{})[k]===v.n)return false;(e.nonce[pid]=e.nonce[pid]||{})[k]=v.n}
  const z=ePz(v.p);if(!z||!eOpen(z))return false;const c=e.cnt[pid]=e.cnt[pid]||{};
  if(k==='hint'){const lv=e.hints[z.id]||0;if(lv>=z.hints.length)return false;e.hints[z.id]=lv+1;e.end-=120000;c.hint=(c.hint||0)+1;chron(`${p.name} взял(а) подсказку: «${z.t}» (−2 мин).`);e.last={id:rid(5),ty:'hint',p:z.id,by:pid};return true}
  if(k==='ans'){const ok=z.ans.some(a=>eNorm(a)===eNorm(v.v));e.last={id:rid(5),ty:ok?'ok':'bad',p:z.id,by:pid};
    if(ok){e.solved[z.id]=pid;c.solve=(c.solve||0)+1;chron(`${p.name} открыл(а): «${z.t}».`);if(z.fin)eFinish(true)}
    else{e.end-=30000;e.wrong++;c.wrong=(c.wrong||0)+1;chron(`Неверно: «${z.t}» (−30 с).`)}return true}
  return false}
function eFinish(won){const e=S.esc;e.done=Date.now();const left=won?Math.max(0,Math.round((e.end-e.done)/1000)):0;e.leftAt=left;
  const stars=won?(left>=20*60?3:left>=10*60?2:1):0;const pts={},wonP={},awards=[];
  S.players.forEach(p=>{const c=e.cnt[p.pid]||{};pts[p.pid]=(c.solve||0)+stars*2;wonP[p.pid]=won});
  if(!S.local){let b=null,bv=0,tie=false;S.players.forEach(p=>{const v=(e.cnt[p.pid]||{}).solve||0;if(v>bv){bv=v;b=p;tie=false}else if(v===bv)tie=true});if(b&&!tie&&bv>=2)awards.push({k:'Ключник',t:'открыл(а) больше всех замков',pid:b.pid});
    const clean_=S.players.filter(p=>((e.cnt[p.pid]||{}).solve||0)>=1&&!((e.cnt[p.pid]||{}).wrong));if(clean_.length===1)awards.push({k:'Без единой ошибки',t:'ни одного неверного кода',pid:clean_[0].pid})}
  awards.forEach(a=>pts[a.pid]++);
  S.win={side:won?'town':'lost',why:won?`Вы выбрались. Осталось ${eFmt(left)}.`:'Время вышло. Вы остались в мастерской.'};S.final={pts,won:wonP,stars,awards,goals:{},snipe:{}};chron(S.win.why);setPhase('end')}
setInterval(()=>{if(!S||!ES()||S.phase!=='esc')return;const el=document.getElementById('etmr');if(el){const t=eLeft();el.textContent=eFmt(t);el.classList.toggle('low',t<=300)}
  const sc_=ER.scares.filter(([m])=>eLeft()<=m*60).length;if(ui.eScare!==sc_){const first=ui.eScare===undefined;ui.eScare=sc_;if(!first&&sc_){SND.sting&&SND.sting('night');render()}}
  if((S.local||isHost)&&S.esc.end&&Date.now()>S.esc.end){eFinish(false);commit()}},1000);

function eNarr(){if(S.phase==='eintro')return ER.intro;if(S.phase==='end')return S.win.side==='town'?ER.outro:ER.fail;if(S.phase==='esc'){const s=ER.scares.filter(([m])=>eLeft()<=m*60).pop();return s?s[1]:''}return ''}

function ePuzzle(z,vp){const e=S.esc,mine_=z.cards.filter(c=>eCanSee(c,vp)),other=z.cards.filter(c=>!eCanSee(c,vp)),hl=e.hints[z.id]||0;
  return `<div class="box epz"><div class="lbl">${esc(ER.stages[z.st])}</div><h3>${esc(z.t)}</h3><p class="small">${esc(z.x)}</p>

  ${other.length?`<p class="small" style="color:var(--acc)">Ещё ${other.length===1?'одна улика':other.length+' улики'} у: ${esc([...new Set(other.map(c=>nm(e.cards[c])))].join(', '))}. Спросите вслух.</p>`:''}
  ${z.fin?`<div class="eletters">${ER.scramble.map(x=>`<span>${x}</span>`).join('')}</div>`:''}
  ${eInputHtml(z)}<button class="btn pri" style="width:100%;margin-top:10px" data-act="echk" data-v="${z.id}">Проверить</button>
  ${z.hints.slice(0,hl).map((h,i)=>`<p class="small ehint"><b>Подсказка ${i+1}:</b> ${esc(h)}</p>`).join('')}
  ${hl<z.hints.length?`<button class="btn ghost sm" style="width:100%;margin-top:8px" data-act="ehint" data-v="${z.id}">${ui.eh===z.id?'Точно? Таймер −2 минуты':'Подсказка (−2 мин)'}</button>`:''}</div>`}
function ePhase(vp){const e=S.esc,ph=S.phase;let h='';
  if(ph==='eintro')return `<div class="dcover"><div class="dstamp">23:20</div><div class="tiny mute">Побег из комнаты</div><h1><span>${esc(ER.title)}</span></h1><p class="small">${esc(ER.sub)}</p></div>
  <div class="narr"><div class="k">Пролог</div><p>${esc(ER.intro)}</p></div>
  <div class="box"><div class="lbl">Как выбраться</div><ul class="rules small"><li>Таймер ${ER.min} минут общий. Он пойдёт, когда все нажмут «Дальше».</li><li>Улики разложены по телефонам: у каждого свои. Загадку почти никогда нельзя решить в одиночку — описывайте друг другу, что видите.</li><li>Ответ вводит кто угодно. Неверный ответ отнимает 30 секунд, подсказка — 2 минуты.</li><li>За каждой загадкой — буква. Последняя дверь откроется словом из них.</li></ul></div>`;

  h+=`<div class="box"><div class="lbl">Найденные буквы · ${got.length} из 5</div><div class="eletters">${ER.scramble.map(x=>`<span class="${got.includes(x)?'on':''}">${got.includes(x)?x:'?'}</span>`).join('')}</div></div>`;

function eDossier(vp){const e=S.esc;const vis=Object.keys(ER.cards).filter(c=>eCanSee(c,vp)&&eOpen(ER.pz.find(z=>z.cards.includes(c)))||(eCanSee(c,vp)&&e.solved[ER.pz.find(z=>z.cards.includes(c)).id]));

if(/[?&]t=1/.test(location.search))window.__T={set:ms=>{S.esc.end=Date.now()+ms;commit()}};

try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}

function handlePeer(pr){let c=false,pl=P(pr.pid);const name=clean(pr.name).slice(0,20)||'Игрок';
  if(!pl){if(S.phase==='lobby'&&S.players.length<16&&!S.kicked.includes(pr.pid)){S.players.push({pid:pr.pid,name,alive:true});c=true;pl=P(pr.pid)}else return false}

function privBox(vp){const p=P(vp);if(!vp||!p||!p.role)return '';const n=S.priv[vp]||[],pk=p.pocket||[];
  if(COOP())return `<details class="box acc"><summary>Мои задачи${pk.length?', карман ('+pk.length+')':''}${n.length?', заметки ('+n.length+')':''}</summary><p class="small"><b>${esc(PERK[p.perk]?.n||'')}:</b> ${esc(PERK[p.perk]?.d||'')}</p>${(p.tasks||[]).map(t=>`<p class="small">• ${esc(t.t)}</p>`).join('')}${pk.length?`<p class="small"><b>Карман:</b><br>${pk.map(i=>esc(POCKET[i].n)+' — '+esc(POCKET[i].d)).join('<br>')}</p>`:''}${n.map(t=>`<p class="small">${esc(t)}</p>`).join('')}</details>`;
  return `<details class="box acc"><summary>Моё тайное: роль, цель${pk.length?', карман ('+pk.length+')':''}${n.length?', заметки ('+n.length+')':''}</summary><p class="small"><b>Роль:</b> ${esc(RN(p.role))}</p><p class="small"><b>Личная цель:</b> ${esc(p.goal?.t||'—')}</p>${pk.length?`<p class="small"><b>Карман:</b><br>${pk.map(i=>esc(POCKET[i].n)+' — '+esc(POCKET[i].d)).join('<br>')}</p>`:''}${n.map(t=>`<p class="small">${esc(t)}</p>`).join('')}</details>`}
function pocketUse(vp){const p=P(vp);if(!p||!p.alive)return '';const pk=(p.pocket||[]).filter(i=>i!=='vt');if(!pk.length)return '';const u=mine('use',vp);
  if(u)return `<div class="box acc"><p class="small">Использовано этой ночью: <b>${esc(POCKET[u.id].n)}</b>${u.t?' на '+esc(nm(u.t)):''}</p></div>`;
  return `<div class="box"><div class="lbl">Карман · можно использовать до выбора</div>${pk.includes('rp')?`<button class="btn sm" style="width:100%;margin:4px 0" data-act="use" data-v="rp">Сухпаёк: +1 к самой низкой шкале</button>`:''}${pk.includes('bn')?`<div class="small" style="margin-top:6px">Бинты (+2 здоровья) для:</div><div class="spk">${S.players.map(x=>`<button data-act="bnd" data-v="${esc(x.pid)}">${esc(x.name)}${x.pid===vp?' (я)':''}</button>`).join('')}</div>`:''}${pk.includes('sh')?`<button class="btn sm" style="width:100%;margin:4px 0" data-act="use" data-v="sh">Оберег: меня этой ночью не убить</button>`:''}${pk.includes('sp')?`<div class="small" style="margin-top:6px">Жучок на игрока:</div><div class="spk">${alive().filter(x=>x.pid!==vp).map(x=>`<button data-act="spy" data-v="${esc(x.pid)}">${esc(x.name)}</button>`).join('')}</div>`:''}</div>`}
function huntBox(vp){if(!S.hunt)return '';const h=P(S.hunt.pid);if(!h)return '';const can=S.local||vp===h.pid;
  return `<div class="box" style="border-color:var(--red)"><div class="lbl">Последний выстрел охотника</div><p>${esc(h.name)} — охотник! Перед смертью он может забрать с собой одного игрока.</p>${can?`<div class="spk" style="flex-wrap:wrap">${alive().filter(p=>p.pid!==h.pid).map(p=>`<button data-act="shot" data-v="${esc(p.pid)}">${esc(p.name)}</button>`).join('')}</div>`:'<p class="small mute">Охотник целится… Игра продолжится после выстрела.</p>'}</div>`}
function nevBox(vp){if(S.nev==null||!P(vp)?.alive)return '';const ev=NEV[S.nev],my=mine('ne',vp);
  return `<div class="box acc"><div class="lbl">Ночное событие · голосуют все тайно</div><h3>${esc(ev.t)}</h3><p class="small">${esc(ev.x)}</p><div class="row"><button class="btn ${my==='y'?'pri':''}" data-act="ne" data-v="y">Да</button><button class="btn ${my==='n'?'pri':''}" data-act="ne" data-v="n">Нет</button></div></div>`}


function micPanel(){if(!S)return '';const A=S.players.filter(p=>p.alive);const spk=ui.speaker&&P(ui.speaker)?ui.speaker:(S.local?A[0]?.pid:me.pid);ui.speaker=spk;
  const micOk=!ui.noMic&&NSR;
  const recent=[...S.log,...ui.pend].slice(-4).reverse();
  return `<div class="box"><div class="lbl">Реплики в протокол · говорит:</div>
  <div class="spk">${A.map(p=>`<button class="${p.pid===spk?'on':''}" data-act="spk" data-v="${esc(p.pid)}">${esc(p.name)}</button>`).join('')}</div>
  <div class="mic">${micOk?`<button class="micb ${ui.listening?'on':''}" data-act="mic" aria-label="Микрофон"><svg><use href="#i-mic"/></svg></button>`:''}<textarea id="draft" data-bind="draft" placeholder="Ключевая фраза…">${esc(ui.draft)}</textarea><button class="btn sm pri" data-act="say">В протокол</button></div>
  <p class="tiny mute" id="partial">${esc(ui.partial)||(micOk?'Кнопка слева пишет речь, или надиктуйте микрофоном клавиатуры':'Надиктуйте микрофоном клавиатуры телефона или напишите')}</p>
  ${recent.map(l=>`<p class="q"><b>${esc(nm(l.s))}:</b> ${hl(l.t)}</p>`).join('')}</div>`}
function hl(t){let x=esc(t);const names=S.players.map(p=>esc(p.name)).filter(n=>n.length>1).sort((a,b)=>b.length-a.length).map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const re=new RegExp(`(клянусь|честно|точно|я не|не я|видел[аи]?|слышал[аи]?|вру|врёт|врет|подозр[а-яё]*|мафи[а-яё]*|${names.join('|')||'zzzz'})`,'gi');return x.replace(re,'<mark>$1</mark>')}

function netBanner(){return (!S||S.local||isHost||!net.status)?'':`<div class="box" style="border-color:var(--red)"><p class="small">${esc(net.status)}</p></div>`}
function gameView(){const vp=viewPid();let h=(ES()?eTop():DT()?dTop():CL()?cTop():BK()?bTop():topBar())+netBanner();
  h+=`<div class="tabs"><button class="${ui.tab==='game'?'on':''}" data-act="tab" data-v="game">Игра</button><button class="${ui.tab==='dos'?'on':''}" data-act="tab" data-v="dos">Досье</button><button class="${ui.tab==='rules'?'on':''}" data-act="tab" data-v="rules">Правила</button></div>`;
  if(ui.tab==='dos')return h+(ES()?eDossier(vp):DT()?dDossier(vp):BK()?bDossier():dossier());
  if(ui.tab==='stats')return h+statsHtml();
  if(ui.tab==='rules')return h+(ES()?eRules():DT()?dRules():CL()?cRules():BK()?bRules():goals()+(COOP()?coopRules():rulesHtml()));
  if(S.local&&S.lq&&S.lq.i<S.lq.q.length&&!S.lq.show){const pid=S.lq.q[S.lq.i];
    return h+`<div class="pass"><p class="mute">${esc({deal:'Раздача карт',mission:'Тайный выбор отряда',night:'Ночь',reveal:'Раскрытие карт'}[S.phase]||'')} · ${S.lq.i+1} из ${S.lq.q.length}</p><p>Передай телефон</p><div class="nmx">${esc(nm(pid))}</div><button class="btn pri" data-act="lqShow">Я ${esc(nm(pid))} — показать</button><p class="tiny mute">Остальные отворачиваются</p></div>`}
  const me_=P(vp);
  if(!S.local&&!me_&&S.phase!=='end')h+=`<div class="box"><p>Игра уже идёт без вас. Можно наблюдать.</p></div>`;
  if(me_&&!me_.alive&&S.phase!=='end')h+=`<div class="box" style="border-color:var(--red)"><p><b>Вы выбыли.</b> Наблюдайте молча: мёртвые не подсказывают.</p></div>`;
  if(DT())return h+dPhase(vp);
  if(ES())return h+ePhase(vp);
  if(CL()){h+=cPhase(vp);if(!S.local&&vp&&!['deal','end'].includes(S.phase))h+=cNotes(vp);return h}
  if(BK()){h+=bPhase(vp);if(!S.local&&vp&&(S.priv[vp]||[]).length&&!['deal','end'].includes(S.phase))h+=`<details class="box acc"><summary>Мои заметки</summary>${S.priv[vp].map(t=>`<p class="small">${esc(t)}</p>`).join('')}</details>`;if(!S.local&&vp&&!['deal','end','intro'].includes(S.phase))h+=`<details class="box"><summary>Мои карты</summary>${bMine(vp)}</details>`;return h}
  h+=phaseView(vp);
  if(!S.local&&vp&&!['deal','end'].includes(S.phase))h+=privBox(vp);
  return h}

function waitList(){const n=need();if(!n)return '';const miss=n.filter(([p,k])=>!has(p,k)).map(([p])=>nm(p));return miss.length?`<p class="tiny mute">Ждём: ${esc(miss.join(', '))}</p>`:''}

function phaseView(vp){const s=sc(),ph=S.phase,me_=P(vp),al=me_&&me_.alive;
  const nar=t=>`<div class="narr"><div class="k">${esc(t)}</div><p>${esc(narr())}</p></div>`;
  switch(ph){
  case 'deal':{if(!vp)return '';const rd=mine('ready',vp);
    return `<p class="mute" style="text-align:center">Твоя карта. Открой, запомни, закрой.</p>${card(vp)}
    <button class="btn pri" style="width:100%;margin-top:12px" data-act="ready" ${rd?'disabled':''}>${rd?'Готово — ждём остальных':'Запомнил(а)'}</button>${S.local?'':waitList()}`}
  case 'intro':return `<div class="narr"><div class="k">Пролог</div><p>${esc(COOP()?coopIntro(s):s.intro)}</p></div>${goals()}<div class="box"><div class="lbl">Как пойдёт игра</div><p class="small">Каждый день — кризис, который решаете вместе: голосуете за вариант, иногда отправляете отряд. В отряде мафия может тайно сорвать дело. Потом обсуждение и голосование за изгнание. Ночью все берут телефоны: у каждого своё тайное действие.</p></div>${vp?`<details class="box"><summary>Моя карта</summary>${card(vp)}</details>`:''}`;
  case 'crisis':{const cr=crDef(),my=mine('cv',vp);const by={};Object.entries(S.inp).forEach(([pid,o])=>{if(o.cv!==undefined)(by[o.cv]=by[o.cv]||[]).push(nm(pid))});
    return `<div class="narr"><div class="k">День ${S.day} · кризис · лидер: ${esc(nm(S.crisis.lead))}</div><h2>${esc(cr.t)}</h2><p>${esc(cr.x)}</p></div>
    <p class="small mute">${S.local?'Обсудите вслух и выберите вариант.':'Обсудите и проголосуйте. При равенстве решает лидер.'}</p>
    ${cr.o.map((o,i)=>{const dis=o.need&&!(S.inv[o.need]>0);return `<button class="opt ${my===i?'on':''}" data-act="${S.local?'pickOpt':'cv'}" data-v="${i}" ${dis||(!S.local&&!al)?'disabled':''}><b>${esc(o.t)}</b><span class="tg">${o.team?`<span class="chip acc">Нужен отряд из ${teamSize()}</span>`:''}${o.need?`<span class="chip ${dis?'red':''}">Тратит: ${esc(s.items[o.need])}${dis?' (нет)':''}</span>`:''}</span>${by[i]?`<span class="who">За: ${esc(by[i].join(', '))}</span>`:''}</button>`}).join('')}
    ${S.local?'':waitList()}${micPanel()}`}
  case 'team':{const L=S.crisis.lead,K=teamSize(),o=crDef().o[S.crisis.ch];const canPick=S.local||vp===L;
    let h=`<div class="narr"><div class="k">Отряд</div><p>Решено: «${esc(o.t)}». Лидер дня <b>${esc(nm(L))}</b> выбирает ${K} человек. Обсуждайте, кому доверить дело.</p></div>`;
    if(canPick){h+=alive().map(p=>`<button class="pl ${ui.teamSel.includes(p.pid)?'on':''}" data-act="tsel" data-v="${esc(p.pid)}"><span class="av">${esc(p.name[0].toUpperCase())}</span><span class="nm"><b>${esc(p.name)}</b><span class="tiny mute">${esc(p.ch)}</span></span></button>`).join('')+
      `<button class="btn pri" style="width:100%" data-act="tgo" ${ui.teamSel.length!==K?'disabled':''}>Отправить отряд (${ui.teamSel.length}/${K})</button>`}
    else h+=`<p class="mute">Ждём решения лидера…</p>`;
    return h+micPanel()}
  case 'mission':{const T=S.crisis.team;const inT=vp&&T.includes(vp);const my=mine('ms',vp);
    let h=`<div class="narr"><div class="k">Вылазка</div><p>${esc(narr())}</p></div>`;
    if(COOP()){if(inT){h+=`<p style="text-align:center">Ты в отряде. Выбор тайный.</p><div class="mis"><button class="h ${my==='h'?'on':''}" data-act="ms" data-v="h"><svg><use href="#i-hand"/></svg>Выложиться</button><button class="s ${my==='s'?'on':''}" data-act="ms" data-v="s" style="color:var(--acc)"><svg><use href="#i-shield"/></svg>Беречь себя</button></div><p class="small mute">Вылазка удаётся, если выложится хотя бы половина отряда, но всё равно бывает невезение. Если провалится, выложившиеся теряют 1 здоровья.</p>`;if(S.local&&my)h+=`<button class="btn pri" style="width:100%" data-act="lqNext">Скрыть и передать дальше</button>`}else h+=`<p class="mute">Отряд в деле. Остальные ждут.</p>`;return h+(S.local?'':waitList())}
    if(inT){h+=`<p style="text-align:center">Ты в отряде. Выбор тайный.</p><div class="mis"><button class="h ${my==='h'?'on':''}" data-act="ms" data-v="h"><svg><use href="#i-hand"/></svg>Помочь</button><button class="s ${my==='s'&&CANSAB(me_.role)?'on':''}" data-act="ms" data-v="s"><svg><use href="#i-skull"/></svg>Подвести</button></div>`;
      if(my&&!CANSAB(me_.role))h+=`<p class="small mute" style="text-align:center">Ты из выживших — твой вклад всегда «помочь».</p>`;
      if(S.local&&my)h+=`<button class="btn pri" style="width:100%" data-act="lqNext">Скрыть и передать дальше</button>`}
    else h+=`<p class="mute">Отряд в деле. Остальные ждут.</p>`;
    return h+(S.local?'':waitList())}
  case 'cres':{const r=S.crisis.res;return `<div class="narr"><div class="k">Итог кризиса</div><p>${esc(r.r)}</p>${r.full!=null?`<p><b style="color:${r.okc?'#7fe0a8':'#ff8a90'}">${r.okc?'Вылазка удалась':'Вылазка провалилась'}. Выложились полностью: ${r.full} из ${S.crisis.team.length}</b></p>`:''}${r.sab!==null?`<p><b style="color:${r.sab?'#ff8a90':'#7fe0a8'}">Саботажей в отряде: ${r.sab}</b>${r.sab?` — среди ${esc(S.crisis.team.map(nm).join(', '))} есть предатель.`:''}</p>`:''}<div class="inv">${r.eff.map(e=>`<span class="chip acc wrap">${esc(e)}</span>`).join('')}</div></div>${micPanel()}`}
  case 'discuss':return `<div class="narr"><div class="k">Обсуждение · день ${S.day}</div><p>${COOP()?'Решите, кто ночью дежурит, кто лечит раненых, кто идёт искать припасы. Отыгрывайте своих персонажей: спорьте, торгуйтесь, рассказывайте истории.':`Кто из вас ${esc(s.roles.maf.n.toLowerCase())}? Оправдывайтесь, обвиняйте, вспоминайте, кто был в отряде.`}</p></div><div class="timer" id="tmr">--:--</div>${micPanel()}`;
  case 'vote':{const my=mine('vote',vp),tally={};Object.entries(S.inp).forEach(([pid,o])=>{if(o.vote)(tally[o.vote]=tally[o.vote]||[]).push(nm(pid))});const lastV=S.votes[S.votes.length-1];
    let h=`<div class="narr"><div class="k">Голосование · день ${S.day}</div><p>${S.local?'Голосуйте поднятием рук, затем отметьте, кого изгоняете.':'Голосование открытое — видно, кто за кого. Под каждым — его ключевые слова.'}</p></div>`;
    h+=alive().filter(p=>S.local||p.pid!==vp).map(p=>{const qs=S.log.filter(l=>l.s===p.pid).slice(-2);const lv=lastV&&lastV.v[p.pid];
      return `<button class="pl ${my===p.pid||ui.confirm===p.pid?'on':''}" data-act="${S.local?'lvote':'vote'}" data-v="${esc(p.pid)}" ${!S.local&&!al?'disabled':''}><span class="av">${esc(p.name[0].toUpperCase())}</span><span class="nm"><b>${esc(p.name)}</b>${qs.map(q=>`<span class="q" style="display:block">${hl(q.t)}</span>`).join('')}${lv?`<span class="tiny mute">Вчера голосовал(а): ${lv==='skip'?'воздержался':esc(nm(lv))}</span>`:''}${tally[p.pid]?`<span class="tiny" style="display:block;color:#ff8a90">Против: ${esc(tally[p.pid].join(', '))}</span>`:''}</span></button>`}).join('');
    h+=`<button class="btn ${my==='skip'||ui.confirm==='skip'?'pri':''}" style="width:100%" data-act="${S.local?'lvote':'vote'}" data-v="skip" ${!S.local&&!al?'disabled':''}>Воздержаться${tally.skip?' · '+tally.skip.length:''}</button>`;
    if(S.local&&ui.confirm)h+=`<button class="btn red" style="width:100%;margin-top:10px" data-act="lvoteGo">${ui.confirm==='skip'?'Никого не изгонять':'Изгнать: '+esc(nm(ui.confirm))}</button>`;
    return h+(S.local?'':waitList())+micPanel()}
  case 'vres':{const r=S.res;return `<div class="narr"><div class="k">Итог голосования</div><p>${esc(r.text)}</p></div>${huntBox(vp)}${r.pid?`<div class="box" style="text-align:center"><svg width="56" height="56" style="color:${ENEMY(r.role)?'var(--red)':'var(--acc)'}"><use href="#i-${ENEMY(r.role)?'mask':'user'}"/></svg><h3>${esc(nm(r.pid))}</h3><p class="mute">${esc(RN(r.role))}</p></div>`:''}${S.day>=S.evac?'<p class="small mute">Это был последний день перед эвакуацией.</p>':''}${micPanel()}`}
  case 'night':{if(!vp)return `<div class="narr"><div class="k">Ночь</div><p>${esc(narr())}</p></div>`;
    if(!al)return `<div class="narr"><div class="k">Ночь ${S.day}</div><p>Вы выбыли. Закройте глаза.</p></div>`;
    if(COOP())return coopNightView(vp);
    const my=mine('na',vp),r=me_.role;
    const head={maf:`Выберите жертву. Договоритесь жестами с напарниками.`,doc:`Кого спасаете этой ночью?${S.lastHeal?' Нельзя того же, что вчера.':''}`,det:'Кого проверяете?',civ:'Кого подозреваете? Подозрения огласят утром.',wit:'Кого подозреваете? Вспомните, кого вы видели шепчущимися.',hun:'Кого подозреваете? Если вас убьют, вы выстрелите в ответ.',trt:'Кого подозреваете? Подозрения огласят утром. (Ты тайно за мафию.)',grd:'Кого закрываете собой этой ночью?',man:'Кого убиваете этой ночью?',jur:S.jUsed?'Расследование уже опубликовано. Кого подозреваете?':'Кого расследуете? Утром результат опубликуют для всех — один раз за игру.'}[r];
    let h=nevBox(vp)+pocketUse(vp)+`<div class="narr"><div class="k">Ночь ${S.day} · ${esc(RN(r))}</div><p>${esc(head)}</p></div>`;
    const mates=r==='maf'?alive().filter(p=>p.role==='maf'&&p.pid!==vp):[];
    if(mates.length)h+=`<p class="small">${mates.map(m=>`${esc(m.name)}: ${S.inp[m.pid]?.na?esc(nm(S.inp[m.pid].na)):'ещё думает'}`).join(' · ')}</p>`;
    h+=alive().filter(p=>{if(r==='maf')return p.role!=='maf';if(r==='doc')return true;return p.pid!==vp}).map(p=>{const dis=r==='doc'&&p.pid===S.lastHeal;return `<button class="pl ${my===p.pid?'on':''}" data-act="na" data-v="${esc(p.pid)}" ${dis?'disabled':''}><span class="av">${esc(p.name[0].toUpperCase())}</span><span class="nm"><b>${esc(p.name)}${p.pid===vp?' (вы)':''}</b></span></button>`}).join('');
    const doneAll=my&&(S.nev==null||mine('ne',vp));
    if(my&&!doneAll)h+=`<p class="small" style="text-align:center">Не забудьте ответить на ночное событие выше.</p>`;
    if(doneAll)h+=`<p class="small mute" style="text-align:center">Выбор принят. ${S.local?'':'Положите телефон экраном вниз.'}</p>`;
    if(S.local){h+=privBox(vp);if(doneAll)h+=`<button class="btn pri" style="width:100%" data-act="lqNext">Скрыть и передать дальше</button>`}
    return h+(S.local?'':waitList())}
  case 'morning':{const r=S.res;return `${huntBox(vp)}<div class="narr"><div class="k">Утро · день ${S.day}</div><p>${esc(r.text)}</p>${r.sus?`<p class="small">Больше всего ночных подозрений у <b>${esc(nm(r.sus.pid))}</b> (${r.sus.n}).</p>`:''}${r.nev&&r.nev.eff.length?`<div class="inv">${r.nev.eff.map(e=>`<span class="chip acc wrap">${esc(e)}</span>`).join('')}</div>`:''}</div>${S.day>=S.evac?'<div class="box acc"><b>Последний день.</b> Эвакуация вечером: если мафия останется среди вас, она улетит вместе со всеми.</div>':''}${micPanel()}`}
  case 'end':{const w=S.win,F=S.final||{pts:{},goals:{},awards:[]};recordStats();

function suspectBoard(){if(COOP())return '';if(!S.day)return '';const A=alive();const rows=A.map(p=>{let sc_=0;const why=[];

  const okm=S.missions.filter(m=>m.sab===0&&m.team.includes(p.pid)).length;if(okm){sc_-=0.5*okm;why.push('чистых вылазок: '+okm)}
  const re=new RegExp(p.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');const ment=S.log.filter(l=>l.s!==p.pid&&re.test(l.t)).length;if(ment){sc_+=0.5*ment;why.push('упоминали в репликах: '+ment)}

function coopRules(){return `<details class="box"><summary>Правила за минуту</summary><ul class="rules small">

<li>У каждого персонаж, специализация (Медик, Добытчик, Страж, Инженер, Переговорщик), здоровье 3 и <b>две тайные личные задачи</b>. За каждую +2 очка.</li>
<li><b>День:</b> кризис → голосуете за решение. Для вылазки лидер дня выбирает отряд, и каждый тайно решает: выложиться или беречь себя. Провал ранит выложившихся.</li>
<li><b>Обсуждение:</b> договоритесь, кто ночью дежурит, кто лечит, кто ищет. Отыгрывайте персонажей, ключевые фразы кидайте в протокол.</li>
<li><b>Ночь:</b> каждый выбирает — дежурить, отдыхать (+1 здоровья), искать припасы или помочь другому. Потом приходит угроза: если дежурных хватает, отбились, если нет — кто-то ранен.</li>
<li>Здоровье на нуле — без сознания, пока кто-то не поможет. Если все без сознания или шкала упала до нуля — проигрыш.</li>
<li><b>Карман:</b> Бинты, Сухпаёк, Оберег — тайные предметы, которые можно использовать ночью.</li>
<li>Иногда ночью всем приходит общее событие «да/нет».</li></ul></details>`}
function rulesHtml(){return `<details class="box"><summary>Правила за минуту</summary><ul class="rules small">

<li><b>Ночь:</b> все берут телефоны — у каждого есть действие, поэтому никто не выдаёт себя. Мафия убивает, доктор лечит, детектив проверяет, мирные отмечают подозреваемого.</li>
<li>Каждую ночь одна шкала проседает на 1. Мафия побеждает при равенстве числа, падении шкалы до нуля или если доживёт до эвакуации.</li>
<li><b>Особые роли</b> включаются в лобби: Телохранитель, Журналист, Свидетель, Охотник (от 5 игроков), Маньяк и Предатель (от 6). Включите несколько — в раздачу попадут случайные.</li>

  case 'mission':lab=`<b>Вылазка</b>Сделали выбор: ${waiting}`;btn=S.local?'':B('force','Не ждать','');break;
  case 'cres':lab='<b>Итог кризиса</b>Дальше — обсуждение';btn=B('toDiscuss','К обсуждению');break;
  case 'discuss':lab=`<b>Обсуждение</b><span class="row" style="gap:4px;margin-top:4px">${[60,120,180,300].map(t=>`<button class="btn sm ghost" data-act="tmr" data-v="${t}">${t/60} мин</button>`).join('')}</span>`;btn=COOP()?B('toNight','Наступает ночь'):B('toVote','К голосованию');break;
  case 'vote':lab=S.local?'<b>Голосование</b>Отметьте выбор выше':`<b>Голосование</b>Голосов: ${waiting}`;btn=S.local?'':B('force','Подвести итог','');break;
  case 'vres':lab='<b>Итог</b>Город засыпает';btn=B('toNight','Наступает ночь');break;
  case 'night':lab=`<b>Ночь</b>Действия: ${waiting}`;btn=S.local?'':B('force','Не ждать','');break;
  case 'morning':lab='<b>Утро</b>Новый день';btn=B('toDay',`Начать день ${S.day}`);break;
  case 'end':lab='<b>Партия окончена</b>Те же игроки';btn=B('again','Новая игра');break}
  const tts='';
  const ex=S.local&&ph!=='lobby'?`<button class="btn sm ghost" data-act="leave">Выход</button>`:'';
  return `<div class="hostbar"><div class="in"><div class="lab">${lab}</div>${tts}${ex}${btn}</div></div>`}

function tick(){const el=$('#tmr');if(!el||!S||!S.timer)return el&&(el.textContent='--:--');const ms=S.timer.end-(Date.now()+(isHost||S.local?0:ui.skew));const t=Math.max(0,Math.ceil(ms/1000));el.textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;el.classList.toggle('low',t<=15)}
setInterval(tick,500);
setInterval(()=>{if(!S||S.local||!S.phase||['lobby','end'].includes(S.phase))return;
  if(WAIT.includes(S.phase)&&age()>40&&ui.goShown!==S.pk){ui.goShown=S.pk;render()}
  if(!isHost)return;const pk=S.pk;
  if(S.phase==='discuss'&&S.timer&&Date.now()>S.timer.end)advance();else auto();
  if(S.pk!==pk)commit()},1000);
async function wake(){try{if(navigator.wakeLock&&isHost)ui.wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});

/* ---------- actions ---------- */
const A={
  pickScenHome:v=>{ui.scen=v;render()},
  pickScen:v=>{if(!(isHost||S.local))return;S.scen=v;ui.scen=v;commit()},
  create:()=>createGame(),
  join:()=>{ui.code=$('#code')?.value||'';joinGame(ui.code)},
  page:v=>goPage(v),
  cna:v=>send('na',v,viewPid()),
  cdn:v=>send('dn',v,viewPid()),
  cvote:v=>send('vote',v,viewPid()),
  clv:v=>{ui.confirm=ui.confirm===v?null:v;render()},
  clvGo:()=>{const t=ui.confirm;ui.confirm=null;cVote(t==='skip'?null:t);commit()},
  copt:v=>{if(!(isHost||S.local))return;S.copts=S.copts||{};if(v==='man')S.copts.man=!S.copts.man;else S.copts[v]=S.copts[v]===false;commit()},
  cnext:()=>{cAdvance();commit()},
  enext:()=>{eAdvance();commit()},
  eopen:v=>{ui.eDoc=v;render()},
  eclose:()=>{ui.eDoc=null;render()},
  ecd:v=>{const [k,i,d]=v.split(':');const a=ui.ein[k];a[+i]=(a[+i]+(+d)+10)%10;render()},
  esq:v=>{const i=v.indexOf(':'),k=v.slice(0,i),sy=v.slice(i+1);const z=ePz(k);const a=ui.ein[k];if(a.length<z.n)a.push(sy);render()},
  esqc:v=>{ui.ein[v]=[];render()},
  eclk:v=>{const [k,w,d]=v.split(':');const a=ui.ein[k];if(w==='h')a[0]=((a[0]-1+(+d)+12)%12)+1;else a[1]=(a[1]+(+d)+60)%60;render()},
  echk:v=>{const z=ePz(v),a=ui.ein[v];let val=z.ty==='code'?a.join(''):z.ty==='seq'?a.join(''):z.ty==='clock'?a[0]+':'+String(a[1]).padStart(2,'0'):(ui['ew_'+v]||'');if(!val)return toast('Сначала введите ответ');if(z.ty==='seq'&&a.length<z.n)return toast('Нужно '+z.n+' символа');if(z.ty==='seq')ui.ein[v]=[];if(z.ty==='word')ui['ew_'+v]='';send('ans',{p:v,v:val,n:rid(6)},S.local?S.players[0].pid:me.pid)},
  ehint:v=>{if(ui.eh!==v){ui.eh=v;render();return}ui.eh=null;send('hint',{p:v,n:rid(6)},S.local?S.players[0].pid:me.pid)},
  dnext:()=>{dAdvance();ui.dDoc=null;commit()},
  noop:()=>{},
  dopen:v=>{ui.dDoc=v;render()},
  dclose:()=>{ui.dDoc=null;render()},
  dshare:v=>{send('share',{id:v,n:rid(6)},viewPid()||me.pid);ui.dDoc=null;render()},
  dreq:v=>{send('req',{id:v,n:rid(6)},S.local?S.players[0].pid:me.pid)},
  dcode:v=>{const val=(ui['c_'+v]||'').trim();if(!/^\d{4}$/.test(val))return toast('Нужно 4 цифры');ui['c_'+v]='';send('code',{k:v,val,n:rid(6)},S.local?S.players[0].pid:me.pid)},
  dans:v=>{const [q,a]=v.split(':');ui.dAcc=ui.dAcc||{};ui.dAcc[q]=a;render()},
  dsend:()=>{const a={...(ui.dAcc||{})};if(!DCASE.qs.every(q=>a[q.k]))return;if(!S.local)ui.dSent=S.pk;send('acc',a,S.local?S.players[0].pid:me.pid)},
  pickCatHome:v=>{ui.cat=v;render()},
  pickCat:v=>{if(!(isHost||S.local))return;S.cat=v;ui.cat=v;commit()},
  brv:v=>send('rv',v,viewPid()),
  boa:v=>send('oa',v,viewPid()),
  bvote:v=>send('bv',v,viewPid()),
  bact:v=>{const p=P(viewPid());if(!p)return;send('act',BACT[p.action].t?{t:v}:{},viewPid())},
  blv:v=>{ui.confirm=ui.confirm===v?null:v;render()},
  blvGo:()=>{const t=ui.confirm;ui.confirm=null;if(t){bResolve(t);commit()}},
  bnext:()=>{bAdvance();commit()},
  local:()=>{if($('#nm'))needNameSoft();LS.del('maf.local');S=null;startLocal(false)},
  localResume:()=>startLocal(true),
  leave:()=>{if(S&&S.local&&S.phase!=='lobby'&&S.phase!=='end'){LS.set('maf.local',S)}leave()},
  addLocal:()=>{const el=$('#addn');const v=clean(el?.value).slice(0,20);if(!v)return;if(S.players.some(p=>p.name.toLowerCase()===v.toLowerCase()))return toast('Такое имя уже есть');S.players.push({pid:rid(),name:v,alive:true});commit();setTimeout(()=>$('#addn')?.focus(),0)},
  kick:v=>{S.players=S.players.filter(p=>p.pid!==v);if(!S.local)S.kicked.push(v);commit()},
  start:()=>{if(S.players.length<minP())return;startGame();commit()},
  force:()=>{force();commit()},
  day1:()=>{startDay();commit()},
  toDiscuss:()=>{afterCres();commit()},
  toVote:()=>{setPhase('vote');ui.confirm=null;commit()},
  toNight:()=>{if(S.hunt)return toast('Сначала охотник стреляет');afterVres();commit()},
  toDay:()=>{if(S.hunt)return toast('Сначала охотник стреляет');afterMorning();commit()},
  shot:v=>{const who=S.hunt&&S.hunt.pid;if(!who)return;if(S.local||isHost){if(input(who,'shot',v))commit()}else{send('shot',v,me.pid)}},
  again:()=>{if(ES()){const pl=S.players.map(p=>({pid:p.pid,name:p.name,alive:true}));const code=S.code,loc=S.local,k=S.kicked;S=newState(code,loc);S.mode='esc';S.players=pl;S.kicked=k||[];ui.ein={};ui.eDoc=null;ui.eLast=undefined;ui.eScare=undefined;commit();return}
    if(DT()){const pl=S.players.map(p=>({pid:p.pid,name:p.name,alive:true}));const code=S.code,loc=S.local,k=S.kicked;S=newState(code,loc);S.mode='det';S.players=pl;S.kicked=k||[];ui.dAcc={};ui.dDoc=null;commit();return}
    if(CL()){const pl=S.players.map(p=>({pid:p.pid,name:p.name,alive:true}));const code=S.code,loc=S.local,k=S.kicked,co=S.copts;S=newState(code,loc);S.mode='classic';S.copts=co;S.players=pl;S.kicked=k||[];ui.flip={};commit();return}
    if(BK()){const pl=S.players.map(p=>({pid:p.pid,name:p.name,alive:true}));const code=S.code,loc=S.local,k=S.kicked,cat=S.cat;S=newState(code,loc);S.mode='bunker';S.cat=cat;S.players=pl;S.kicked=k||[];ui.flip={};commit();return}const pl=S.players.map(p=>({pid:p.pid,name:p.name,alive:true}));const scn=S.scen,code=S.code,loc=S.local,k=S.kicked,md=S.mode,op=S.opts;S=newState(code,loc);S.mode=md;S.opts=op||{};S.players=pl;S.scen=scn;S.kicked=k||[];ui.flip={};commit()},
  tmr:v=>{S.timer={end:Date.now()+(+v)*1000,dur:+v};commit()},
  tts:()=>{ui.tts=!ui.tts;if(ui.tts){ui.spoken=null;speak()}else{try{speechSynthesis.cancel()}catch(e){}}render()},
  share:()=>shareLink(),
  flip:v=>{ui.flip[v]=!ui.flip[v];render()},
  ready:()=>send('ready',true,viewPid()),
  go:()=>send('go',true,me.pid),
  cv:v=>send('cv',+v,viewPid()),
  pickOpt:v=>{const o=crDef().o[+v];if(o.need&&!(S.inv[o.need]>0))return;pickOption(+v,{});commit()},
  tsel:v=>{const i=ui.teamSel.indexOf(v);if(i>=0)ui.teamSel.splice(i,1);else if(ui.teamSel.length<teamSize())ui.teamSel.push(v);render()},
  tgo:()=>{if(ui.teamSel.length!==teamSize())return;if(S.local){S.crisis.team=[...ui.teamSel];ui.teamSel=[];setPhase('mission');commit()}else{send('team',[...ui.teamSel],viewPid())}},
  ms:v=>send('ms',v,viewPid()),
  vote:v=>send('vote',v,viewPid()),
  lvote:v=>{ui.confirm=ui.confirm===v?null:v;render()},
  lvoteGo:()=>{const t=ui.confirm;ui.confirm=null;alive().forEach(p=>{S.inp[p.pid]={vote:(t!=='skip'&&p.pid===t)?'skip':t}});resolveVote();commit()},
  na:v=>send('na',v,viewPid()),
  ne:v=>send('ne',v,viewPid()),
  use:v=>send('use',{id:v},viewPid()),
  spy:v=>send('use',{id:'sp',t:v},viewPid()),
  bnd:v=>send('use',{id:'bn',t:v},viewPid()),
  opt:v=>{if(!(isHost||S.local))return;S.opts=S.opts||{};S.opts[v]=!S.opts[v];commit()},
  snd:()=>{SND.on=!SND.on;LS.set('maf.snd',SND.on);if(SND.on){SND.init();SND.cur=null;ambient()}else SND.stop();render()},
  shareCard:()=>shareCard(),
  resetStats:()=>{if(ui.rs){LS.del('maf.stats');ui.rs=false;toast('Статистика очищена')}else{ui.rs=true;toast('Нажмите ещё раз, чтобы очистить')}render()},
  lqShow:()=>{S.lq.show=true;ui.flip={};render()},
  lqNext:()=>{lqNext();commit()},
  tab:v=>{ui.tab=v;render()},
  spk:v=>{ui.speaker=v;render()},
  say:()=>{const t=ui.draft;ui.draft='';addSpeech(t,ui.speaker);render()},
  mic:()=>micToggle(),
};
function needNameSoft(){const v=clean($('#nm')?.value).slice(0,20);if(v){me.name=v;LS.set('maf.name',v)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b.dataset.v)}});
document.addEventListener('input',e=>{const b=e.target.dataset&&e.target.dataset.bind;if(b)ui[b]=e.target.value;if(e.target.id==='nm'){me.name=clean(e.target.value).slice(0,20)}if(e.target.id==='code')ui.code=e.target.value});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;if(id==='addn'){e.preventDefault();A.addLocal()}else if(id==='code'){e.preventDefault();A.join()}else if(id==='draft'&&!e.shiftKey){e.preventDefault();A.say()}});
window.addEventListener('hashchange',()=>{if(S)return;const h=(location.hash||'').match(/^#g-([a-z0-9]{3,8})$/);if(h)joinGame(h[1],true);else{const p=pageFromHash();if(p!==ui.page){ui.page=p;render()}}});

initNet();
}

</script>
