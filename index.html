<style>
/* VOICE: ночная настольная игра, напряжённая и игровая
   IDEA: колода карт и досье следователя, раскладываемые на столе
   PICTURE: силуэт места катастрофы на каждой карте сценария, рубашка карт роли

   LAYOUT: одна колонка под телефон, липкая шапка со шкалами, панель ведущего снизу */
:root{color-scheme:dark;--bg:#0d0f14;--bg2:#141821;--card:#191e29;--line:#2a3140;--ink:#efe9dd;--mute:#9aa1ad;--acc:#b5d94a;--red:#e0414b;--ok:#55c38a;--r:14px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--acc) 14%,transparent),transparent 60%),var(--sbg,var(--bg));color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,h3,.disp{font-family:"Russo One",Manrope,sans-serif;font-weight:400;line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,9vw,52px)}h2{font-size:26px}h3{font-size:20px}
p{margin:.4em 0}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:#0b0e13;border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 120px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;text-align:center}
.btn.pri{background:var(--acc);color:#0c0e10;border-color:transparent}
.btn.red{background:var(--red);color:#fff;border-color:transparent}

.btn:disabled{opacity:.4;cursor:default}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 140px}
.mute{color:var(--mute)}.small{font-size:14px}.tiny{font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}

.sc.on{outline:3px solid var(--a);outline-offset:-3px}
.sc small{color:var(--a);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--sbg,var(--bg)) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:-16px -16px 12px;padding:10px 16px 8px}
.top .t1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.top .t1 b{font-family:"Russo One";font-weight:400;color:var(--acc)}

.mt{position:relative;background:#0b0e13;border:1px solid var(--line);border-radius:10px;padding:6px 9px 9px;font-size:13px;overflow:hidden}

.narr{position:relative;padding:18px;border-radius:var(--r);background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 12%,var(--card)),var(--card));border:1px solid var(--line);margin:12px 0}

.pl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);min-height:56px}

.cb{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.back{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--acc) 22%,#10131a) 0 10px,#10131a 10px 20px);color:var(--acc)}
.back .em{width:84%;aspect-ratio:1;border-radius:50%;border:3px solid var(--acc);display:grid;place-items:center;background:#0d1016}
.back .em svg{width:60%;height:60%}
.back p{margin-top:16px;font-weight:800;color:var(--ink)}
.front{transform:rotateY(180deg);background:radial-gradient(90% 70% at 50% 25%,var(--rc2),var(--rc) 70%);color:#fff}
.front svg{width:42%;height:auto;margin-bottom:10px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.front h3{font-size:28px}
.front em{font-style:normal;font-size:13px;font-weight:800;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.3);margin:8px 0}
.front p{font-size:14px;line-height:1.4}
.r-maf{--rc:#5a0d16;--rc2:#c01f33}.r-doc{--rc:#0c3b3a;--rc2:#1fa59a}.r-det{--rc:#13284a;--rc2:#3b7bd1}.r-civ{--rc:#3a3226;--rc2:#a08a63}
.legend{text-align:center;margin:6px auto 0;max-width:320px}
.mis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.mis button{aspect-ratio:3/4;border-radius:18px;border:2px solid var(--line);background:var(--card);font-family:"Russo One",sans-serif;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
.mis button svg{width:48px;height:48px}
.mis .h{color:var(--ok)}.mis .s{color:var(--red)}
.mis button.on{border-color:currentColor;box-shadow:0 0 0 3px currentColor inset}
.timer{font-family:"Russo One";font-size:clamp(48px,16vw,72px);text-align:center;color:var(--acc);margin:6px 0;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.mic{display:flex;gap:8px;align-items:stretch}
.mic textarea{min-height:52px;resize:none;flex:1}
.micb{flex:none;width:56px;border-radius:12px;border:1px solid var(--line);background:#0b0e13;display:grid;place-items:center}
.micb svg{width:24px;height:24px}
.micb.on{background:var(--red);border-color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--red) 30%,transparent)}}
.spk{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.spk button{flex:none;min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px}
.spk button.on{background:var(--acc);color:#111;border-color:var(--acc)}
.hostbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,#07090c 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom))}
.hostbar .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
.hostbar .lab{flex:1;font-size:13px;color:var(--mute);line-height:1.25}
.hostbar .lab b{color:var(--ink);display:block;font-size:14px}
.hostbar .btn{flex:none}
.night{background:#05060a}
.code{font-family:"Russo One";font-size:56px;letter-spacing:.12em;color:var(--acc);text-align:center;line-height:1}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:20;background:#000;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw}
.pass{min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.pass .nmx{font-family:"Russo One";font-size:40px;color:var(--acc)}
.win{text-align:center;padding:26px 16px;border-radius:20px;margin:12px 0}
.win.town{background:linear-gradient(160deg,#173d2a,#0f1a14)}.win.maf{background:linear-gradient(160deg,#4a0f17,#160a0c)}
.qr{width:200px;margin:12px auto;background:#fff;border-radius:12px;padding:6px}.qr svg{display:block;width:100%;height:auto}
.sep{height:1px;background:var(--line);margin:14px 0}
details summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
ul.rules{padding-left:20px}ul.rules li{margin:6px 0}
@media (prefers-reduced-motion:reduce){.cin,.mt i{transition:none}.micb.on{animation:none}}
</style>
</head>

function onHostData(c,d){if(!d||typeof d!=='object'||!S)return;let e=net.conns.get(c.connectionId);if(!e){e={c,pr:{}};net.conns.set(c.connectionId,e)}
  if(d.t==='p'&&d.p&&typeof d.p==='object'){e.pr=d.p;if(d.p.code!==S.code)return;if(handlePeer(e.pr))commit();else sendState(c)}}
function sendState(c){try{if(c.open)c.send({t:'s',S})}catch(e){}}
function broadcast(){for(const {c} of net.conns.values())sendState(c)}
function onlinePids(){return new Set([...net.conns.values()].map(e=>e.pr&&e.pr.pid).filter(Boolean))}
function clientOpen(code){return new Promise((res,rej)=>{let done=false;const fail=t=>{if(!done){done=true;rej(t)}};
  const p=net.peer&&!net.peer.destroyed?net.peer:new window.Peer({debug:0,config:ICE});net.peer=p;

    const to=setTimeout(()=>fail('timeout'),12000);

    c.on('error',()=>{});};

  if(p.open)go();else p.on('open',go)})}
function reconnectSoon(){if(net.retry||!S||isHost||S.local)return;net.retry=setTimeout(async()=>{net.retry=null;if(!S||isHost)return;
  if(net.host&&net.host.open)return;try{await clientOpen(net.code);render()}catch(e){net.status='Телефон создателя не отвечает — пробую снова…';render();reconnectSoon()}},2500)}
setInterval(()=>{if(!S||S.local)return;
  if(isHost){for(const {c} of net.conns.values())try{if(c.open)c.send({t:'h'})}catch(e){}return}
  if(mode==='net'&&net.host&&net.last&&Date.now()-net.last>8000&&!net.retry){net.status='Связь с телефоном создателя прервалась — переподключаюсь…';try{net.host.close()}catch(e){}net.host=null;render();reconnectSoon()}},3000);
function initNet(){
  render();
  const h=(location.hash||'').match(/^#g-([a-z0-9]{3,8})$/);
  if(h){const hs=LS.get('maf.host',null);if(hs&&hs.code===h[1]&&hs.S&&hs.S.hostPid===me.pid&&hs.S.phase!=='end'){resumeHost(hs.S);return}
    if(me.name)joinGame(h[1],true);else{ui.code=h[1];render()}}
  else{const lc=LS.get('maf.local',null);if(lc&&lc.phase&&lc.phase!=='end'){ui.resume=true;render()}}
}

/* ---------- engine (host) ---------- */
function newState(code,local){return {v:1,gid:rid(6),rev:0,code:code||'',local:!!local,hostPid:local?null:me.pid,scen:ui.scen,phase:'lobby',pn:0,pk:0,players:[],kicked:[],day:0,evac:4,meters:{a:4,b:4,c:4},inv:{},inp:{},log:[],chron:[],priv:{},votes:[],missions:[],crisis:null,timer:null,deck:[],lead:[],li:0,lastHeal:null,shield:false,res:null,win:null,ai:null,lq:null,hostNow:Date.now()}}
const ADV=['intro','cres','discuss','vres','morning'],WAIT=['deal','crisis','team','mission','vote','night'];
const pool=()=>S.phase==='deal'?S.players:alive();
const goN=()=>pool().filter(p=>S.inp[p.pid]?.go).length;
const goNeed=()=>Math.floor(pool().length/2)+1;
const age=()=>(Date.now()+((isHost||S.local)?0:ui.skew)-(S.phAt||0))/1000;
function advance(){switch(S.phase){case 'intro':startDay();break;case 'cres':afterCres();break;case 'discuss':setPhase('vote');break;case 'vres':afterVres();break;case 'morning':afterMorning();break}}
function setPhase(ph){S.phase=ph;S.pk=++S.pn;S.inp={};S.phAt=Date.now();if(ph!=='discuss')S.timer=null;S.lq=null;
  if(S.local){let q=null;if(ph==='deal')q=S.players.map(p=>p.pid);else if(ph==='mission')q=[...S.crisis.team];else if(ph==='night')q=alive().map(p=>p.pid);if(q)S.lq={q:shufIf(ph,q),i:0,show:false}}}
const shufIf=(ph,q)=>ph==='night'?q:q;
function chron(t){S.chron.push({d:S.day,t})}
function addPriv(pid,t){(S.priv[pid]=S.priv[pid]||[]).push(t)}

function startGame(){
  const n=S.players.length,k=n<=6?1:n<=9?2:n<=12?3:4,s=sc();
  const roles=shuf([...Array(k).fill('maf'),'doc','det',...Array(n-k-2).fill('civ')]);
  const chars=shuf(s.chars);
  S.players.forEach((p,i)=>{p.role=roles[i];p.alive=true;const c=chars[i%chars.length];p.ch=c[0];p.chd=c[1]});
  S.evac=n<=6?4:n<=9?5:6;S.day=1;S.meters={a:4,b:4,c:4};
  S.inv={};shuf(['i1','i2','i3','i4']).slice(0,2).forEach(i=>S.inv[i]=1);
  S.deck=shuf(s.cr.map((_,i)=>i));S.lead=shuf(S.players.map(p=>p.pid));S.li=0;
  S.log=[];S.chron=[];S.priv={};S.votes=[];S.missions=[];S.ai=null;S.win=null;S.res=null;S.shield=false;S.lastHeal=null;
  chron('Игра началась: '+s.title+'. Игроков: '+n+', '+s.roles.maf.gen+' среди них: '+k+'.');
  setPhase('deal');
}
function leader(){const L=S.lead;for(let j=0;j<L.length;j++){const pid=L[(S.li+j)%L.length];if(P(pid)?.alive)return pid}return alive()[0]?.pid}
function startDay(){S.crisis={i:S.deck[(S.day-1)%S.deck.length],ch:null,team:[],res:null,lead:leader(),tally:{}};S.li++;setPhase('crisis')}

function validNa(pid,v){const p=P(pid),t=P(v);if(!t||!t.alive)return false;
  if(p.role==='maf')return t.role!=='maf';
  if(p.role==='doc')return v!==S.lastHeal;
  return v!==pid}
function input(pid,k,v){
  const p=P(pid);if(!p)return false;const ph=S.phase;
  if(k==='go'){if(!(ADV.includes(ph)||WAIT.includes(ph))||!(ph==='deal'||p.alive))return false;if(WAIT.includes(ph)&&age()<35)return false;v=true}
  const ok=k==='go'||(ph==='deal'&&k==='ready')||(p.alive&&((ph==='crisis'&&k==='cv')||(ph==='team'&&k==='team'&&pid===S.crisis.lead)||(ph==='mission'&&k==='ms'&&S.crisis.team.includes(pid))||(ph==='vote'&&k==='vote')||(ph==='night'&&k==='na')));
  if(!ok)return false;
  if(k==='ready')v=true;
  if(k==='cv'){v=+v;const o=crDef().o[v];if(!o||(o.need&&!(S.inv[o.need]>0)))return false}
  if(k==='ms'){v=v==='s'&&p.role==='maf'?'s':'h'}
  if(k==='team'){if(!Array.isArray(v)||v.length!==teamSize()||new Set(v).size!==v.length||v.some(x=>!P(x)?.alive))return false}
  if(k==='vote'&&v!=='skip'&&!(P(v)?.alive&&v!==pid))return false;
  if(k==='na'&&!validNa(pid,v))return false;
  const cur=S.inp[pid]?.[k];if(JSON.stringify(cur)===JSON.stringify(v))return false;
  S.inp[pid]={...(S.inp[pid]||{}),[k]:v};
  if(!(S.local&&S.lq&&S.lq.i<S.lq.q.length))auto();
  return true;
}
const has=(pid,k)=>S.inp[pid]&&S.inp[pid][k]!==undefined;
function need(){const A=alive();switch(S.phase){
  case 'deal':return S.players.map(p=>[p.pid,'ready']);
  case 'crisis':return A.map(p=>[p.pid,'cv']);
  case 'team':return [[S.crisis.lead,'team']];
  case 'mission':return S.crisis.team.map(x=>[x,'ms']);
  case 'vote':return A.map(p=>[p.pid,'vote']);
  case 'night':return A.map(p=>[p.pid,'na']);}return null}
function auto(){
  if(!S.local&&ADV.includes(S.phase)){const g=goN(),t=pool().length;if(t&&(g>=t||(g>=goNeed()&&age()>25)))advance();return}
  if(!S.local&&WAIT.includes(S.phase)&&goN()>=goNeed()&&age()>35)return force();
  const n=need();if(!n||!n.every(([pid,k])=>has(pid,k)))return;
  switch(S.phase){case 'deal':setPhase('intro');break;case 'crisis':resolveChoice();break;
  case 'team':S.crisis.team=S.inp[S.crisis.lead].team;setPhase('mission');break;
  case 'mission':resolveMission();break;case 'vote':resolveVote();break;case 'night':resolveNight();break}}
function force(){switch(S.phase){
  case 'deal':setPhase('intro');break;case 'crisis':resolveChoice();break;
  case 'team':{const L=S.crisis.lead;const t=[L,...shuf(alive().map(p=>p.pid).filter(x=>x!==L))].slice(0,teamSize());S.crisis.team=t;setPhase('mission');break}
  case 'mission':resolveMission();break;case 'vote':resolveVote();break;case 'night':resolveNight();break}}

function fxApply(fx){const s=sc(),out=[];
  MK.forEach((k,i)=>{if(fx[k]){S.meters[k]=Math.max(0,Math.min(6,S.meters[k]+fx[k]));out.push(`${s.m[i][0]} ${fx[k]>0?'+':''}${fx[k]}`)}});
  if(fx.it){S.inv[fx.it]=(S.inv[fx.it]||0)+1;out.push('Найдено: '+s.items[fx.it])}
  if(fx.shield){S.shield=true;out.push('Этой ночью убийства не будет')}
  if(fx.clue){out.push('Улика: '+makeClue())}
  if(fx.peek){const L=S.crisis.lead,o=alive().filter(p=>p.pid!==L);if(o.length){const t=pick(o);addPriv(L,`День ${S.day}: ${t.name} — ${t.role==='maf'?s.roles.maf.n:'не '+s.roles.maf.n.toLowerCase()}.`);out.push(`Лидер ${nm(L)} тайно узнал правду об одном игроке`)}}
  return out}
function makeClue(){const s=sc(),A=shuf(alive());if(A.length<2)return 'следов нет';let x=A[0],y=A[1];
  if(Math.random()<.5){const m=A.find(p=>p.role==='maf'),t=A.find(p=>p.role!=='maf');if(m&&t)[x,y]=shuf([m,t])}
  const hm=x.role==='maf'||y.role==='maf';
  return hm?`среди ${x.name} и ${y.name} есть ${s.roles.maf.n.toLowerCase()}.`:`${x.name} и ${y.name} чисты: среди них нет ${s.roles.maf.gen}.`}
function resolveChoice(){const cr=crDef(),cnt={};
  alive().forEach(p=>{const v=S.inp[p.pid]?.cv;if(v!==undefined)cnt[v]=(cnt[v]||0)+1});
  let best=0,bi=[];for(const [i,c] of Object.entries(cnt)){if(c>best){best=c;bi=[+i]}else if(c===best)bi.push(+i)}
  let ch;if(!bi.length)ch=cr.o.findIndex(o=>!o.need||S.inv[o.need]>0);else if(bi.length===1)ch=bi[0];else{const lv=S.inp[S.crisis.lead]?.cv;ch=bi.includes(lv)?lv:bi[0]}
  pickOption(ch,cnt)}
function pickOption(ch,cnt){const o=crDef().o[ch];S.crisis.ch=ch;S.crisis.tally=cnt||{};
  if(o.need)S.inv[o.need]=Math.max(0,(S.inv[o.need]||0)-1);
  if(o.team)setPhase('team');else finishCrisis(o.fx||{},null)}
function finishCrisis(fx,sab){const o=crDef().o[S.crisis.ch];const eff=fxApply(fx);
  S.crisis.res={ok:sab===null?null:sab===0,sab,r:fx.r||'',eff};
  chron(`${crDef().t}: «${o.t}». ${fx.r||''}${sab!==null?' Саботажей: '+sab+'.':''}${eff.filter(e=>/^Улика|^Найдено|^Этой ночью/.test(e)).map(e=>' '+e).join('')}`);
  setPhase('cres')}
function resolveMission(){const o=crDef().o[S.crisis.ch];const sab=S.crisis.team.filter(x=>S.inp[x]?.ms==='s').length;
  S.missions.push({d:S.day,team:[...S.crisis.team],sab});finishCrisis(sab===0?o.ok:o.no,sab)}
function resolveVote(){const s=sc(),A=alive(),v={};A.forEach(p=>v[p.pid]=S.inp[p.pid]?.vote??'skip');
  S.votes.push({d:S.day,v});const cnt={};Object.values(v).forEach(t=>cnt[t]=(cnt[t]||0)+1);
  let top=null,best=0,tie=false;for(const [k,c] of Object.entries(cnt)){if(k==='skip')continue;if(c>best){best=c;top=k;tie=false}else if(c===best)tie=true}
  const sk=cnt.skip||0;
  if(!top||tie||sk>=best){S.res={kind:'vote',pid:null,text:tie?'Голоса разделились поровну. Сегодня никого не изгнали.':'Большинство воздержалось. Сегодня никого не изгнали.'}}
  else{const p=P(top);p.alive=false;S.res={kind:'vote',pid:top,role:p.role,text:`${p.name} изгнан(а) голосованием (${best} гол.). Это был(а) ${s.roles[p.role].n.toLowerCase()}.`}}
  chron(S.res.text);setPhase('vres')}
function resolveNight(){const s=sc(),A=alive(),M=A.filter(p=>p.role==='maf');const cnt={};
  M.forEach(p=>{const v=S.inp[p.pid]?.na;if(v)cnt[v]=(cnt[v]||0)+1});
  let tg=null,best=0;const first=S.inp[M[0]?.pid]?.na;for(const [k,c] of Object.entries(cnt)){if(c>best||(c===best&&k===first)){best=c;tg=k}}
  const doc=A.find(p=>p.role==='doc'),det=A.find(p=>p.role==='det');
  const heal=doc?S.inp[doc.pid]?.na||null:null;S.lastHeal=heal;
  if(det){const t=S.inp[det.pid]?.na;if(t)addPriv(det.pid,`Ночь ${S.day}: ${nm(t)} — ${P(t).role==='maf'?s.roles.maf.n:'не '+s.roles.maf.n.toLowerCase()}.`)}
  const sus={};A.filter(p=>p.role==='civ').forEach(p=>{const v=S.inp[p.pid]?.na;if(v)sus[v]=(sus[v]||0)+1});
  let st=null,sb=0;for(const [k,c] of Object.entries(sus))if(c>sb){sb=c;st=k}
  let killed=null,saved=false,shielded=false;
  if(tg){if(S.shield)shielded=true;else if(tg===heal)saved=true;else{killed=tg;P(tg).alive=false}}
  S.shield=false;
  const di=Math.floor(Math.random()*3),dk=MK[di];S.meters[dk]=Math.max(0,S.meters[dk]-1);
  S.day++;
  const lines=[];
  if(killed)lines.push(`Ночью погиб(ла) ${nm(killed)}. Это был(а) ${s.roles[P(killed).role].n.toLowerCase()}.`);
  else if(saved)lines.push(`${s.roles.maf.pl} пришли за жертвой, но ${s.roles.doc.n.toLowerCase()} успел(а) спасти её. Все живы.`);
  else if(shielded)lines.push('Ночные дежурства сработали: на вас напали, но никто не погиб.');
  else lines.push('Ночь прошла тихо. Все живы.');
  lines.push(s.decay[di]+` ${s.m[di][0]} −1.`);
  S.res={kind:'night',killed,saved,shielded,text:lines.join(' '),sus:st?{pid:st,n:sb}:null};
  chron(lines.join(' '));setPhase('morning')}
function checkWin(){const s=sc(),A=alive(),m=A.filter(p=>p.role==='maf').length,t=A.length-m;
  for(let i=0;i<3;i++)if(S.meters[MK[i]]<=0)return {side:'maf',why:`«${s.m[i][0]}» на нуле: выжить не удалось. ${s.win.maf}`};
  if(m===0)return {side:'town',why:s.win.town};
  if(m>=t)return {side:'maf',why:`${s.roles.maf.pl} сравнялись числом с остальными. ${s.win.maf}`};
  return null}
function endGame(w){S.win=w;chron(w.why);setPhase('end')}
function afterCres(){const w=checkWin();if(w)return endGame(w);setPhase('discuss');const d=Math.min(240,60+25*alive().length);S.timer={end:Date.now()+d*1000,dur:d}}
function afterVres(){let w=checkWin();if(!w&&S.day>=S.evac&&alive().some(p=>p.role==='maf'))w={side:'maf',why:`Эвакуация прибыла, и ${sc().roles.maf.pl.toLowerCase()} спокойно поднялись на борт вместе со всеми. ${sc().win.maf}`};
  if(w)return endGame(w);setPhase('night')}
function afterMorning(){const w=checkWin();if(w)return endGame(w);startDay()}
function addLog(e){S.log.push(e);if(S.log.length>300)S.log=S.log.slice(-300)}

/* ---------- commit / sync ---------- */
function commit(){S.rev++;S.hostNow=Date.now();if(S.local)LS.set('maf.local',S);else{LS.set('maf.host',{code:S.code,S});broadcast()}speak();render()}
let ruVoice=null;function pickVoice(){try{const v=speechSynthesis.getVoices();ruVoice=v.find(x=>/^ru/i.test(x.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
const canTTS=()=>'speechSynthesis' in window;
function speak(){if(!ui.tts||!canTTS()||!S||ui.spoken===S.pk)return;ui.spoken=S.pk;const t=narr();if(!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';if(ruVoice)u.voice=ruVoice;u.rate=1;speechSynthesis.speak(u)}catch(e){}}

function handlePeer(pr){let c=false,pl=P(pr.pid);const name=clean(pr.name).slice(0,20)||'Игрок';
  if(!pl){if(S.phase==='lobby'&&S.players.length<16&&!S.kicked.includes(pr.pid)){S.players.push({pid:pr.pid,name,alive:true});c=true;pl=P(pr.pid)}else return false}
  else if(S.phase==='lobby'&&pl.name!==name){pl.name=name;c=true}
  if(Array.isArray(pr.sp)){const ids=new Set(S.log.map(l=>l.i));for(const e of pr.sp.slice(-4)){if(e&&typeof e.i==='string'&&!ids.has(e.i)&&typeof e.t==='string'&&clean(e.t)){addLog({i:e.i,d:S.day,s:P(e.s)?e.s:pr.pid,by:pr.pid,t:clean(e.t).slice(0,280)});c=true}}}
  if(pr.pk===S.pk&&pr.a&&typeof pr.a==='object'){for(const k of ['ready','cv','team','ms','vote','na','go'])if(pr.a[k]!==undefined&&input(pr.pid,k,pr.a[k]))c=true}
  return c}
function onRemote(d){if(!d||!d.gid)return;if(S&&S.gid===d.gid&&d.rev<S.rev)return;
  S=JSON.parse(JSON.stringify(d));ui.skew=(S.hostNow||Date.now())-Date.now();
  if(myPk!==S.pk){myPk=S.pk;myA={};ui.teamSel=[];pres({pk:myPk,a:{}})}
  const ids=new Set(S.log.map(l=>l.i));ui.pend=ui.pend.filter(e=>!ids.has(e.i));
  speak();render()}
function pres(o){Object.assign(myPres,o);for(const k in o)if(o[k]===null)delete myPres[k];const c=net.host;if(c&&c.open)try{c.send({t:'p',p:myPres})}catch(e){}}

function send(k,v,vp){
  if(S.local){if(input(vp,k,v)){if(k==='ready')lqNext(true);commit()}return}
  if(isHost){if(input(me.pid,k,v))commit();else render();return}
  if(myPk!==S.pk){myPk=S.pk;myA={}}myA={...myA,[k]:v};pres({pk:myPk,a:myA});render()}
const mine=(k,vp)=>{if(S.local||isHost)return S.inp[vp]?.[k];return (myPk===S.pk&&myA[k]!==undefined)?myA[k]:S.inp[vp]?.[k]};
function addSpeech(text,spk){text=clean(text).slice(0,280);if(!text||!S)return;const e={i:rid(6),s:spk||me.pid,t:text};
  if(S.local||isHost){addLog({...e,d:S.day,by:me.pid});commit()}else{mySp=[...mySp,e].slice(-3);pres({sp:mySp});ui.pend.push({...e,d:S.day});render()}}
function lqNext(){if(!S.lq)return;S.lq.i++;S.lq.show=false;if(S.lq.i>=S.lq.q.length)auto()}

/* ---------- rooms ---------- */
const newCode=()=>Array.from({length:4},()=>'abcdefghjkmnpqrstuvwxyz'[Math.floor(Math.random()*23)]).join('');
async function createGame(){if(!needName())return;if(!hasPeer()){ui.err='Не загрузился модуль связи. Проверьте интернет и обновите страницу.';return render()}
  ui.err='Создаю комнату…';render();let code,ok=false;
  for(let i=0;i<4&&!ok;i++){code=newCode();try{await hostOpen(code);ok=true}catch(e){if(e!=='unavailable-id'){ui.err='Не удалось создать комнату ('+e+'). Проверьте интернет.';return render()}}}
  if(!ok){ui.err='Не удалось создать комнату, попробуйте ещё раз';return render()}
  S=newState(code,false);S.players=[{pid:me.pid,name:me.name,alive:true}];mode='net';isHost=true;ui.screen='game';ui.err='';net.code=code;
  try{location.hash='g-'+code}catch(e){}wake();commit()}
async function resumeHost(st){if(!hasPeer()){setTimeout(()=>resumeHost(st),500);return}
  ui.err='Восстанавливаю игру…';render();
  for(let i=0;i<8;i++){try{await hostOpen(st.code);S=st;mode='net';isHost=true;ui.screen='game';ui.err='';net.code=st.code;wake();commit();return}catch(e){if(e!=='unavailable-id'){break}await new Promise(r=>setTimeout(r,2500))}}
  ui.err='Не удалось восстановить комнату. Создайте новую игру.';LS.del('maf.host');render()}
async function joinGame(code,auto){code=String(code||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(!code){ui.err='Введите код';return render()}
  if(!auto&&!needName())return;if(!me.name){ui.code=code;ui.err='Введите имя и нажмите «Войти»';return render()}
  if(!hasPeer()){ui.err='Не загрузился модуль связи. Проверьте интернет и обновите страницу.';return render()}
  ui.err='Подключаюсь к телефону создателя…';render();net.code=code;
  myPres={pid:me.pid,name:me.name,code,pk:null,a:{},sp:[]};mySp=[];
  try{await clientOpen(code)}catch(e){if(auto&&(ui.tries=(ui.tries||0)+1)<25){ui.err='Жду телефон создателя…';render();setTimeout(()=>{if(!S||mode!=='net')joinGame(code,true)},3000);return}ui.tries=0;ui.err=e==='nohost'?'Игра с таким кодом не найдена. Проверьте код; у создателя страница должна быть открыта.':e==='timeout'?'Не получилось соединиться с телефоном создателя. Лучше всем быть в одном Wi‑Fi.':'Ошибка связи: '+e;return render()}
  ui.tries=0;mode='net';isHost=false;ui.screen='game';ui.err='';try{location.hash='g-'+code}catch(e){}
  if(!S){render()}}
function needName(){const v=clean($('#nm')?.value||me.name).slice(0,20);if(!v){ui.err='Сначала введите имя';render();return false}me.name=v;LS.set('maf.name',v);return true}
function leave(){if(net.retry){clearTimeout(net.retry);net.retry=null}if(isHost)LS.del('maf.host');try{net.host&&net.host.close()}catch(e){}try{net.peer&&net.peer.destroy()}catch(e){}net.peer=null;net.host=null;net.conns=new Map();net.status='';S=null;mode=null;isHost=false;ui.screen='home';ui.tab='game';try{history.replaceState(null,'',location.pathname+location.search)}catch(e){try{location.hash=''}catch(_){}}render()}
function startLocal(resume){mode='local';isHost=false;ui.screen='game';if(resume){S=LS.get('maf.local',null)}if(!S||!S.local){S=newState('',true)}render()}

/* ---------- mic ---------- */
const NSR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function micToggle(){
  if(ui.listening){ui.wantMic=false;if(rec)try{rec.stop()}catch(e){}ui.listening=false;return render()}
  if(NSR){try{rec=new NSR();rec.lang='ru-RU';rec.continuous=true;rec.interimResults=true;
    rec.onresult=ev=>{let fin='',part='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript;else part+=r[0].transcript}ui.partial=part;const el=$('#partial');if(el)el.textContent=part;if(fin)addSpeech(fin,ui.speaker)};
    rec.onerror=ev=>{if(ev&&(ev.error==='no-speech'||ev.error==='aborted'))return;ui.wantMic=false;ui.listening=false;toast(ev&&ev.error==='not-allowed'?'Разрешите доступ к микрофону в настройках браузера':'Микрофон не сработал — используйте голосовой ввод клавиатуры');render()};
    rec.onend=()=>{if(ui.wantMic){try{rec.start();return}catch(e){}}ui.listening=false;render()};rec.start();ui.listening=true;ui.wantMic=true}catch(e){ui.noMic=true;toast('Микрофон недоступен')}render()}}

/* ---------- AI ---------- */
function narr(){if(!S)return '';const s=sc(),ph=S.phase;
  switch(ph){case 'intro':return s.intro;
  case 'crisis':return `День ${S.day}. ${crDef().t}. ${crDef().x}`;
  case 'team':return `Лидер дня, ${nm(S.crisis.lead)}, собирает отряд из ${teamSize()} человек.`;
  case 'mission':return `Отряд уходит: ${S.crisis.team.map(nm).join(', ')}. Каждый тайно решает, помочь или подвести.`;
  case 'cres':return [S.crisis.res.r,S.crisis.res.sab!==null?`Саботажей: ${S.crisis.res.sab}.`:''].join(' ');
  case 'discuss':return `Обсуждение. Кто из вас ${s.roles.maf.n.toLowerCase()}?`;
  case 'vote':return 'Голосование. Кого изгоняем?';
  case 'vres':return S.res.text;
  case 'night':return `Ночь. Все закрывают глаза и берут телефоны. ${s.roles.maf.pl} выбирают жертву.`;
  case 'morning':return `Утро. ${S.res.text}`;
  case 'end':return (S.win.side==='town'?'Победа выживших. ':'Победа мафии. ')+S.win.why}return ''}
function meters(){const s=sc();return `<div class="meters">${MK.map((k,i)=>`<div class="mt ${S.meters[k]<=1?'low':''}"><div class="mr"><svg><use href="#i-${s.m[i][1]}"/></svg><b>${S.meters[k]}</b><small class="tiny mute">/6</small></div><span>${esc(s.m[i][0])}</span><i style="--w:${S.meters[k]/6*100}%"></i></div>`).join('')}</div>`}
function invHtml(){const s=sc();const it=Object.entries(S.inv).filter(([,n])=>n>0);return `<div class="inv">${it.length?it.map(([k,n])=>`<span class="chip">${esc(s.items[k])}${n>1?' ×'+n:''}</span>`).join(''):'<span class="tiny mute">Инвентарь пуст</span>'}</div>`}
function topBar(){const s=sc();const left=S.evac-S.day;
  return `<div class="top"><div class="t1"><b>${esc(s.title)}</b><span class="small mute">${S.day?`День ${S.day} · ${left>0?'эвакуация через '+left+' дн.':'последний день'}`:''}</span></div>${S.day?meters()+invHtml():''}</div>`}
function viewPid(){if(S.local)return (S.lq&&S.lq.show&&S.lq.i<S.lq.q.length)?S.lq.q[S.lq.i]:null;
  return me.pid}

let pDown=false,pPend=false,lastHtml='';
document.addEventListener('pointerdown',()=>{pDown=true},true);
const pUp=()=>{pDown=false;if(pPend){pPend=false;setTimeout(render,40)}};
document.addEventListener('pointerup',pUp,true);document.addEventListener('pointercancel',pUp,true);
function render(){
  const app=$('#app');if(!app)return;
  if(pDown){pPend=true;return}
  const a=document.activeElement,fid=a&&a.id,ss=a&&a.selectionStart;
  const s=sc();document.body.style.setProperty('--acc',s.acc);document.body.style.setProperty('--sbg',s.bg);
  let h;
  if(!S)h=homeView();else if(S.phase==='lobby')h=lobbyView();else h=gameView();
  document.body.classList.toggle('night',!!S&&S.phase==='night');
  const html=`<div class="wrap">${h}</div>${S?hostBar():''}`;
  if(html===lastHtml)return tick();lastHtml=html;app.innerHTML=html;
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(ss!=null)el.setSelectionRange(ss,ss)}catch(e){}}}
  tick();
}

function scenStrip(sel,act){return `<div class="strip">${SCEN.map(x=>`<button class="sc ${sel===x.id?'on':''}" style="--a:${x.acc};--b:${x.bg}" data-act="${act}" data-v="${x.id}"><span class="pic">${pic(x.id)}</span><span class="tx"><small>${esc(x.sub)}</small><h3>${esc(x.title)}</h3></span></button>`).join('')}</div>`}
function scenDetail(id){const x=SCEN.find(s=>s.id===id);if(!x)return '';const r=x.roles;
  return `<div class="box acc"><h3>${esc(x.title)}</h3><p class="small mute">${esc(x.sub)}</p><p>${esc(x.intro)}</p>
  <div class="sep"></div><div class="lbl">Роли</div>
  <p class="small"><b style="color:#ff8a90">${esc(r.maf.n)}</b> — ${esc(r.maf.d)}</p>
  <p class="small"><b>${esc(r.doc.n)}</b> — ${esc(r.doc.d)}</p><p class="small"><b>${esc(r.det.n)}</b> — ${esc(r.det.d)}</p><p class="small"><b>${esc(r.civ.n)}</b> — ${esc(r.civ.d)}</p>
  <div class="lbl" style="margin-top:10px">Что держать на плаву</div><div class="inv">${x.m.map(m=>`<span class="chip"><svg width="14" height="14"><use href="#i-${m[1]}"/></svg>${esc(m[0])}</span>`).join('')}</div>
  <div class="lbl" style="margin-top:10px">Возможные находки</div><div class="inv">${Object.values(x.items).map(i=>`<span class="chip">${esc(i)}</span>`).join('')}</div>
  <div class="lbl" style="margin-top:10px">Кризисы</div><p class="small mute">${x.cr.map(c=>esc(c.t)).join(' · ')}</p></div>`}

function homeView(){
  return `<div class="hero"><h1>Мафия:<br><span>Выживание</span></h1><p class="mute">Найдите мафию и выживите вместе. Каждый играет со своего телефона, сидя в одной комнате. Ни регистрации, ни ведущего.</p></div>
  ${scenStrip(ui.scen,'pickScenHome')}
  ${scenDetail(ui.scen)}
  <div class="box" id="enter"><div class="lbl">Ваше имя</div><input id="nm" maxlength="20" placeholder="Например, Куаныш" value="${esc(me.name)}" autocomplete="off">
  ${ui.err?`<p class="small" style="color:${/…$/.test(ui.err)?'var(--mute)':'#ff8a90'}">${esc(ui.err)}</p>`:''}
  <div class="sep"></div>
  <div class="row"><button class="btn pri" data-act="create">Создать игру</button></div>
  <div class="row" style="margin-top:10px"><input id="code" maxlength="8" placeholder="Код игры" value="${esc(ui.code)}" style="flex:1 1 120px;text-transform:uppercase" autocomplete="off"><button class="btn" data-act="join">Войти</button></div>
  <p class="tiny mute">Телефоны соединяются напрямую. Надёжнее всего, когда все в одном Wi‑Fi.</p>
  <div class="sep"></div>
  <div class="row"><button class="btn ghost" data-act="local">Один телефон на всех</button>${ui.resume?'<button class="btn ghost" data-act="localResume">Продолжить партию</button>':''}</div></div>
  ${rulesHtml()}`}

const gameUrl=()=>location.origin+location.pathname+'#g-'+S.code;
function qrSvg(t){try{if(typeof qrcode!=='function')return '';const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:5,margin:2,scalable:true})}catch(e){return ''}}
async function shareLink(){const u=gameUrl();try{if(navigator.share){await navigator.share({title:'Мафия: Выживание',text:'Заходи в игру, код '+S.code.toUpperCase(),url:u});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(u);toast('Ссылка скопирована')}catch(e){toast(u)}}

function lobbyView(){const s=sc(),host=isHost||S.local;
  let h=netBanner()+`<div class="hero" style="padding-top:6px">`;
  if(!S.local)h+=`<div class="lbl" style="text-align:center">Код игры</div><div class="code">${esc(S.code.toUpperCase())}</div>
  <div class="qr">${qrSvg(gameUrl())}</div>
  <p class="small mute" style="text-align:center">Друзья наводят камеру на QR-код или открывают этот сайт и вводят код. Ведущего нет: создатель играет как все. ${isHost?'Ваш телефон держит связь игры — не закрывайте страницу и не блокируйте экран надолго.':''}</p>
  <button class="btn" style="width:100%" data-act="share">Отправить ссылку друзьям</button>`;
  else h+=`<h2>Один телефон</h2><p class="small mute">Добавьте всех игроков. Тайные шаги (карты, ночь, вылазки) телефон покажет каждому по очереди.</p>`;
  h+=`</div><div class="box"><div class="lbl">Игроки: ${S.players.length} ${S.players.length<5?'· нужно минимум 5':''}</div>
  ${S.players.map(p=>`<div class="pl"><span class="av">${esc(p.name.slice(0,1).toUpperCase())}</span><span class="nm"><b>${esc(p.name)}${p.pid===me.pid&&!S.local?' (вы)':''}</b>${!S.local&&p.pid===S.hostPid?'<span class="tiny mute">создатель · играет как все</span>':''}${!S.local&&isHost&&p.pid!==me.pid&&!onlinePids().has(p.pid)?'<span class="tiny" style="color:#ff8a90">не в сети</span>':''}</span>${host&&p.pid!==S.hostPid?`<button class="btn sm ghost" data-act="kick" data-v="${esc(p.pid)}">Убрать</button>`:''}</div>`).join('')}
  ${S.local?`<div class="row"><input id="addn" maxlength="20" placeholder="Имя игрока" style="flex:1 1 160px" autocomplete="off"><button class="btn" data-act="addLocal">Добавить</button></div>`:''}
  </div>
  <div class="lbl">Сценарий ${host?'— выберите':''}</div>
  ${host?scenStrip(S.scen,'pickScen'):''}
  ${scenDetail(S.scen)}
  <button class="btn ghost" data-act="leave" style="width:100%">Выйти из комнаты</button>`;

function card(pid){const p=P(pid),s=sc(),r=s.roles[p.role],on=ui.flip[pid];
  const team=p.role==='maf'?S.players.filter(x=>x.role==='maf'&&x.pid!==pid).map(x=>x.name):[];
  const g={maf:'mask',doc:'cross',det:'eye',civ:'user'}[p.role];
  return `<button class="card ${on?'on':''}" data-act="flip" data-v="${esc(pid)}" aria-label="Карта роли"><div class="cin">
   <div class="cb back"><div class="em">${pic(s.id).replace('preserveAspectRatio="xMidYMid slice"','preserveAspectRatio="xMidYMid meet"')}</div><p>Нажми, чтобы открыть.<br><span class="tiny mute">Никому не показывай</span></p></div>
   <div class="cb front r-${p.role}"><svg><use href="#i-${g}"/></svg><h3>${esc(r.n)}</h3><em>${p.role==='maf'?'Команда мафии':'Команда выживших'}</em><p>${esc(r.d)}</p>${team.length?`<p><b>Свои: ${esc(team.join(', '))}</b></p>`:''}</div>
  </div></button>
  <div class="legend"><div class="lbl">Твой персонаж для отыгрыша</div><b>${esc(p.ch)}</b><p class="small mute">${esc(p.chd)}</p></div>`}

function goals(){const s=sc();return `<div class="box"><div class="lbl">Две цели выживших</div><p class="small">1. Вычислить и изгнать всех: ${esc(s.roles.maf.gen)}.<br>2. Не дать ни одной шкале упасть до нуля и дотянуть до эвакуации (день ${S.evac}).</p><div class="lbl" style="margin-top:8px">Мафия побеждает, если</div><p class="small">их станет столько же, сколько остальных, если шкала упадёт до нуля или если они доживут до эвакуации.</p></div>`}

function privBox(vp){const n=S.priv[vp];if(!vp||!n||!n.length)return '';return `<details class="box acc"><summary>Мои тайные заметки (${n.length})</summary>${n.map(t=>`<p class="small">${esc(t)}</p>`).join('')}</details>`}

function micPanel(){if(!S)return '';const A=S.players.filter(p=>p.alive);const spk=ui.speaker&&P(ui.speaker)?ui.speaker:(S.local?A[0]?.pid:me.pid);ui.speaker=spk;
  const micOk=!ui.noMic&&NSR;
  const recent=[...S.log,...ui.pend].slice(-4).reverse();
  return `<div class="box"><div class="lbl">Реплики в протокол · говорит:</div>
  <div class="spk">${A.map(p=>`<button class="${p.pid===spk?'on':''}" data-act="spk" data-v="${esc(p.pid)}">${esc(p.name)}</button>`).join('')}</div>
  <div class="mic">${micOk?`<button class="micb ${ui.listening?'on':''}" data-act="mic" aria-label="Микрофон"><svg><use href="#i-mic"/></svg></button>`:''}<textarea id="draft" data-bind="draft" placeholder="Ключевая фраза…">${esc(ui.draft)}</textarea><button class="btn sm pri" data-act="say">В протокол</button></div>
  <p class="tiny mute" id="partial">${esc(ui.partial)||(micOk?'Кнопка слева пишет речь, или надиктуйте микрофоном клавиатуры':'Надиктуйте микрофоном клавиатуры телефона или напишите')}</p>
  ${recent.map(l=>`<p class="q"><b>${esc(nm(l.s))}:</b> ${hl(l.t)}</p>`).join('')}</div>`}
function hl(t){let x=esc(t);const names=S.players.map(p=>esc(p.name)).filter(n=>n.length>1).sort((a,b)=>b.length-a.length).map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const re=new RegExp(`(клянусь|честно|точно|я не|не я|видел[аи]?|слышал[аи]?|вру|врёт|врет|подозр[а-яё]*|мафи[а-яё]*|${names.join('|')||'zzzz'})`,'gi');return x.replace(re,'<mark>$1</mark>')}

function netBanner(){return (!S||S.local||isHost||!net.status)?'':`<div class="box" style="border-color:var(--red)"><p class="small">${esc(net.status)}</p></div>`}

  h+=`<div class="tabs"><button class="${ui.tab==='game'?'on':''}" data-act="tab" data-v="game">Игра</button><button class="${ui.tab==='dos'?'on':''}" data-act="tab" data-v="dos">Досье</button><button class="${ui.tab==='rules'?'on':''}" data-act="tab" data-v="rules">Правила</button></div>`;
  if(ui.tab==='dos')return h+dossier();
  if(ui.tab==='rules')return h+goals()+rulesHtml();

function waitList(){const n=need();if(!n)return '';const miss=n.filter(([p,k])=>!has(p,k)).map(([p])=>nm(p));return miss.length?`<p class="tiny mute">Ждём: ${esc(miss.join(', '))}</p>`:''}

function phaseView(vp){const s=sc(),ph=S.phase,me_=P(vp),al=me_&&me_.alive;
  const nar=t=>`<div class="narr"><div class="k">${esc(t)}</div><p>${esc(narr())}</p></div>`;
  switch(ph){
  case 'deal':{if(!vp)return '';const rd=mine('ready',vp);
    return `<p class="mute" style="text-align:center">Твоя карта. Открой, запомни, закрой.</p>${card(vp)}
    <button class="btn pri" style="width:100%;margin-top:12px" data-act="ready" ${rd?'disabled':''}>${rd?'Готово — ждём остальных':'Запомнил(а)'}</button>${S.local?'':waitList()}`}
  case 'intro':return `<div class="narr"><div class="k">Пролог</div><p>${esc(s.intro)}</p></div>${goals()}<div class="box"><div class="lbl">Как пойдёт игра</div><p class="small">Каждый день — кризис, который решаете вместе: голосуете за вариант, иногда отправляете отряд. В отряде мафия может тайно сорвать дело. Потом обсуждение и голосование за изгнание. Ночью все берут телефоны: у каждого своё тайное действие.</p></div>${vp?`<details class="box"><summary>Моя карта</summary>${card(vp)}</details>`:''}`;
  case 'crisis':{const cr=crDef(),my=mine('cv',vp);const by={};Object.entries(S.inp).forEach(([pid,o])=>{if(o.cv!==undefined)(by[o.cv]=by[o.cv]||[]).push(nm(pid))});
    return `<div class="narr"><div class="k">День ${S.day} · кризис · лидер: ${esc(nm(S.crisis.lead))}</div><h2>${esc(cr.t)}</h2><p>${esc(cr.x)}</p></div>
    <p class="small mute">${S.local?'Обсудите вслух и выберите вариант.':'Обсудите и проголосуйте. При равенстве решает лидер.'}</p>
    ${cr.o.map((o,i)=>{const dis=o.need&&!(S.inv[o.need]>0);return `<button class="opt ${my===i?'on':''}" data-act="${S.local?'pickOpt':'cv'}" data-v="${i}" ${dis||(!S.local&&!al)?'disabled':''}><b>${esc(o.t)}</b><span class="tg">${o.team?`<span class="chip acc">Нужен отряд из ${teamSize()}</span>`:''}${o.need?`<span class="chip ${dis?'red':''}">Тратит: ${esc(s.items[o.need])}${dis?' (нет)':''}</span>`:''}</span>${by[i]?`<span class="who">За: ${esc(by[i].join(', '))}</span>`:''}</button>`}).join('')}

  case 'team':{const L=S.crisis.lead,K=teamSize(),o=crDef().o[S.crisis.ch];const canPick=S.local||vp===L;

function suspectBoard(){if(!S.day)return '';const A=alive();const rows=A.map(p=>{let sc_=0;const why=[];
  const fm=S.missions.filter(m=>m.sab>0&&m.team.includes(p.pid));if(fm.length){sc_+=2*fm.length;why.push('в отряде с саботажем: '+fm.map(m=>'Д'+m.d).join(', '))}
  const okm=S.missions.filter(m=>m.sab===0&&m.team.includes(p.pid)).length;if(okm){sc_-=0.5*okm;why.push('чистых вылазок: '+okm)}
  const re=new RegExp(p.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');const ment=S.log.filter(l=>l.s!==p.pid&&re.test(l.t)).length;if(ment){sc_+=0.5*ment;why.push('упоминали в репликах: '+ment)}
  const vAg=S.votes.reduce((n,v)=>n+Object.values(v.v).filter(x=>x===p.pid).length,0);if(vAg){sc_+=0.3*vAg;why.push('голосов против: '+vAg)}
  const deadTown=S.players.filter(x=>!x.alive&&x.role!=='maf').map(x=>x.pid);const badV=S.votes.filter(v=>deadTown.includes(v.v[p.pid])).length;if(badV){sc_+=badV;why.push('голосовал(а) против мирных: '+badV)}
  const mine_=S.log.filter(l=>l.s===p.pid).length;if(!mine_&&S.day>1){sc_+=0.5;why.push('молчит в протоколе')}
  return {p,sc:sc_,why}}).sort((a,b)=>b.sc-a.sc);
  return `<div class="box acc"><div class="lbl">Подсказки по фактам</div><p class="tiny mute">Считается из вылазок, голосов и реплик. Ролей не знает, это только наводки.</p>${rows.map(r=>`<p class="small"><b>${esc(r.p.name)}</b> <span class="mute">· ${r.sc>=3?'очень подозрительно':r.sc>=1.5?'подозрительно':'вне подозрений'}</span><br><span class="tiny mute">${esc(r.why.join(' · ')||'фактов пока нет')}</span></p>`).join('')}</div>`}
function dossier(){const s=sc();let h=suspectBoard();
  h+=S.players.map(p=>{const qs=S.log.filter(l=>l.s===p.pid);const vs=S.votes.map(v=>v.v[p.pid]!==undefined?`Д${v.d}→${v.v[p.pid]==='skip'?'возд.':nm(v.v[p.pid])}`:null).filter(Boolean);const ms=S.missions.filter(m=>m.team.includes(p.pid)).map(m=>`Д${m.d} (саботажей ${m.sab})`);
    return `<details class="box" ${qs.length?'open':''}><summary>${esc(p.name)} <span class="tiny mute" style="margin-left:8px">${esc(p.ch||'')}${p.alive?'':' · выбыл(а): '+esc(s.roles[p.role]?.n||'')}</span></summary>
    ${vs.length?`<p class="small"><b>Голоса:</b> ${esc(vs.join(', '))}</p>`:''}${ms.length?`<p class="small"><b>Отряды:</b> ${esc(ms.join(', '))}</p>`:''}
    ${qs.length?qs.slice(-10).reverse().map(l=>`<p class="q"><span class="tiny mute">Д${l.d}</span> ${hl(l.t)}</p>`).join(''):'<p class="small mute">Пока ничего не сказал(а) в протокол.</p>'}</details>`}).join('');
  h+=`<div class="box"><div class="lbl">Хроника</div>${S.chron.map(c=>`<p class="small"><b>Д${c.d}</b> ${esc(c.t)}</p>`).join('')||'<p class="small mute">Пусто</p>'}</div>`;
  return h}

function rulesHtml(){return `<details class="box"><summary>Правила за минуту</summary><ul class="rules small">
<li>От 5 игроков. Роли: мафия (1 на 5–6 игроков, 2 на 7–9, 3 на 10+), доктор, детектив, остальные — мирные. Названия ролей меняются под сценарий.</li>
<li><b>Две цели выживших:</b> изгнать всю мафию и не дать ни одной из трёх шкал упасть до нуля до эвакуации.</li>
<li><b>День:</b> кризис → голосуете за решение. Некоторые решения тратят предмет из общего инвентаря, другие требуют отряд. Лидер дня (меняется каждый день) выбирает отряд, каждый в отряде тайно жмёт «помочь» или «подвести». Подвести может только мафия; число саботажей объявляется вслух.</li>
<li><b>Обсуждение:</b> говорите, оправдывайтесь, а ключевые фразы кидайте в протокол — микрофоном или голосовым вводом клавиатуры. Всё попадает в «Досье».</li>
<li><b>Голосование</b> открытое. Ничья или большинство воздержавшихся — никто не изгнан.</li>
<li><b>Ночь:</b> все берут телефоны — у каждого есть действие, поэтому никто не выдаёт себя. Мафия убивает, доктор лечит, детектив проверяет, мирные отмечают подозреваемого.</li>
<li>Каждую ночь одна шкала проседает на 1. Мафия побеждает при равенстве числа, падении шкалы до нуля или если доживёт до эвакуации.</li></ul></details>`}

const PHN={deal:'Раздача',intro:'Пролог',crisis:'Кризис',team:'Отряд',mission:'Вылазка',cres:'Итог кризиса',discuss:'Обсуждение',vote:'Голосование',vres:'Итог голосования',night:'Ночь',morning:'Утро'};

    lab=`<b>Вы создатель и тоже игрок</b>${S.players.length<5?'Нужно ещё '+(5-S.players.length):'Все в сборе?'}`;btn=`<button class="btn pri" data-act="start" ${S.players.length<5?'disabled':''}>Раздать карты</button>`}
  else if(ph==='end'){lab='<b>Партия окончена</b>'+(isHost?'Сыграть ещё раз тем же составом':'Новую партию запускает создатель');if(isHost)btn=`<button class="btn pri" data-act="again">Новая игра</button>`}
  else{const can=p&&(ph==='deal'||p.alive),my=mine('go',me.pid);

      if(can)btn=`<button class="btn ${my?'':'pri'}" data-act="go" ${my?'disabled':''}>${my?'Жду других':ph==='discuss'?'Готов голосовать':'Дальше'}</button>`}
    else{const n=need();lab=`<b>${PHN[ph]}</b>Сделали ход: ${n?n.filter(([q,k])=>has(q,k)).length+'/'+n.length:''}`;
      if(can&&age()>40)btn=`<button class="btn sm ${my?'pri':''}" data-act="go" ${my?'disabled':''}>Не ждать · ${goN()}/${goNeed()}</button>`}}
  return `<div class="hostbar"><div class="in"><div class="lab">${lab}</div>${tts}${btn}</div></div>`}
function hostBar(){if(!S)return '';if(!S.local)return playerBar();const ph=S.phase;let lab='',btn='';const n=need();

  case 'vote':lab=S.local?'<b>Голосование</b>Отметьте выбор выше':`<b>Голосование</b>Голосов: ${waiting}`;btn=S.local?'':B('force','Подвести итог','');break;
  case 'vres':lab='<b>Итог</b>Город засыпает';btn=B('toNight','Наступает ночь');break;

  flip:v=>{ui.flip[v]=!ui.flip[v];render()},
  ready:()=>send('ready',true,viewPid()),
  go:()=>send('go',true,me.pid),
  cv:v=>send('cv',+v,viewPid()),
  pickOpt:v=>{const o=crDef().o[+v];if(o.need&&!(S.inv[o.need]>0))return;pickOption(+v,{});commit()},
  tsel:v=>{const i=ui.teamSel.indexOf(v);if(i>=0)ui.teamSel.splice(i,1);else if(ui.teamSel.length<teamSize())ui.teamSel.push(v);render()},
  tgo:()=>{if(ui.teamSel.length!==teamSize())return;if(S.local){S.crisis.team=[...ui.teamSel];ui.teamSel=[];setPhase('mission');commit()}else{send('team',[...ui.teamSel],viewPid())}},
  ms:v=>send('ms',v,viewPid()),
  vote:v=>send('vote',v,viewPid()),
  lvote:v=>{ui.confirm=ui.confirm===v?null:v;render()},
  lvoteGo:()=>{const t=ui.confirm;ui.confirm=null;alive().forEach(p=>{S.inp[p.pid]={vote:(t!=='skip'&&p.pid===t)?'skip':t}});resolveVote();commit()},
  na:v=>send('na',v,viewPid()),
  lqShow:()=>{S.lq.show=true;ui.flip={};render()},
  lqNext:()=>{lqNext();commit()},
  tab:v=>{ui.tab=v;render()},
  spk:v=>{ui.speaker=v;render()},
  say:()=>{const t=ui.draft;ui.draft='';addSpeech(t,ui.speaker);render()},
  mic:()=>micToggle(),
};
function needNameSoft(){const v=clean($('#nm')?.value).slice(0,20);if(v){me.name=v;LS.set('maf.name',v)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b.dataset.v)}});
document.addEventListener('input',e=>{const b=e.target.dataset&&e.target.dataset.bind;if(b)ui[b]=e.target.value;if(e.target.id==='nm'){me.name=clean(e.target.value).slice(0,20)}if(e.target.id==='code')ui.code=e.target.value});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;if(id==='addn'){e.preventDefault();A.addLocal()}else if(id==='code'){e.preventDefault();A.join()}else if(id==='draft'&&!e.shiftKey){e.preventDefault();A.say()}});
window.addEventListener('hashchange',()=>{const h=(location.hash||'').match(/^#g-([a-z0-9]{3,8})$/);if(h&&!S)joinGame(h[1],true)});

initNet();
}

</script>
