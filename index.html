<style>
/* VOICE: ночная настольная игра, напряжённая и игровая
   IDEA: колода карт и досье следователя, раскладываемые на столе
   PICTURE: силуэт места катастрофы на каждой карте сценария, рубашка карт роли
   COLOUR and TYPE: глубокая ночь, акцент сценария, красный для мафии; Russo One + Manrope
   LAYOUT: одна колонка под телефон, липкая шапка со шкалами, панель ведущего снизу */
:root{color-scheme:dark;--bg:#0d0f14;--bg2:#141821;--card:#191e29;--line:#2a3140;--ink:#efe9dd;--mute:#9aa1ad;--acc:#b5d94a;--red:#e0414b;--ok:#55c38a;--r:14px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--acc) 14%,transparent),transparent 60%),var(--sbg,var(--bg));color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,h3,.disp{font-family:"Russo One",Manrope,sans-serif;font-weight:400;line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,9vw,52px)}h2{font-size:26px}h3{font-size:20px}
p{margin:.4em 0}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:#0b0e13;border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 120px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;text-align:center}
.btn.pri{background:var(--acc);color:#0c0e10;border-color:transparent}
.btn.red{background:var(--red);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 140px}
.mute{color:var(--mute)}.small{font-size:14px}.tiny{font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.box.acc{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.lbl{font-size:13px;color:var(--mute);font-weight:600;margin-bottom:6px}
.hero{padding:22px 0 8px}
.hero h1 span{color:var(--acc)}
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 12px;margin:0 -16px;padding-inline:16px}
.sc{flex:0 0 78%;max-width:320px;scroll-snap-align:start;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card);text-align:left;padding:0}
.sc .pic{display:block;aspect-ratio:300/150;background:var(--b);color:var(--a)}
.sc .pic svg{width:100%;height:100%;display:block}
.sc .tx{display:block;padding:12px 14px 14px}
.sc.on{outline:3px solid var(--a);outline-offset:-3px}
.sc small{color:var(--a);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--sbg,var(--bg)) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:-16px -16px 12px;padding:10px 16px 8px}
.top .t1{display:flex;justify-content:space-between;gap:8px;align-items:center}.top .t1>span.small{flex:1;text-align:right}
.tg2{display:inline-flex;gap:6px;flex:none}.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#0b0e13;display:grid;place-items:center;color:var(--mute)}.ib svg{width:18px;height:18px}.ib.on{color:#111;background:var(--acc);border-color:var(--acc)}
.top .t1 b{font-family:"Russo One";font-weight:400;color:var(--acc)}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.mt{position:relative;background:#0b0e13;border:1px solid var(--line);border-radius:10px;padding:6px 9px 9px;font-size:13px;overflow:hidden}
.mt .mr{display:flex;align-items:center;gap:6px}

.mt b{font-size:18px;font-family:"Russo One",sans-serif;font-weight:400}
.mt i{position:absolute;left:0;bottom:0;height:3px;width:var(--w);background:var(--acc);transition:width .6s}
.mt.low{border-color:var(--red)}.mt.low i{background:var(--red)}.mt.low svg{color:var(--red)}
.inv{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.tabs{display:flex;gap:6px;margin:4px 0 12px}

.pl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);min-height:56px}
.pl .av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:"Russo One";background:color-mix(in srgb,var(--acc) 20%,#0b0e13);color:var(--acc)}
.pl .nm{flex:1}

.q{font-size:14px;color:#d8d2c4;border-left:2px solid var(--acc);padding-left:8px;margin:4px 0}
mark{background:color-mix(in srgb,var(--acc) 35%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.card{perspective:1000px;width:min(78vw,300px);aspect-ratio:2/3;margin:10px auto;cursor:pointer;border:0;background:none;padding:0;display:block}
.cin{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.card.on .cin{transform:rotateY(180deg)}
.cb{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.back{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--acc) 22%,#10131a) 0 10px,#10131a 10px 20px);color:var(--acc)}
.back .em{width:84%;aspect-ratio:1;border-radius:50%;border:3px solid var(--acc);display:grid;place-items:center;background:#0d1016}
.back .em svg{width:60%;height:60%}
.back p{margin-top:16px;font-weight:800;color:var(--ink)}
.front{transform:rotateY(180deg);background:radial-gradient(90% 70% at 50% 25%,var(--rc2),var(--rc) 70%);color:#fff}
.front svg{width:42%;height:auto;margin-bottom:10px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.front h3{font-size:28px}
.front em{font-style:normal;font-size:13px;font-weight:800;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.3);margin:8px 0}
.front p{font-size:14px;line-height:1.4}
.r-maf{--rc:#5a0d16;--rc2:#c01f33}.r-doc{--rc:#0c3b3a;--rc2:#1fa59a}.r-det{--rc:#13284a;--rc2:#3b7bd1}.r-civ{--rc:#3a3226;--rc2:#a08a63}
.legend{text-align:center;margin:6px auto 0;max-width:320px}
.mis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.mis button{aspect-ratio:3/4;border-radius:18px;border:2px solid var(--line);background:var(--card);font-family:"Russo One",sans-serif;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
.mis button svg{width:48px;height:48px}
.mis .h{color:var(--ok)}.mis .s{color:var(--red)}
.mis button.on{border-color:currentColor;box-shadow:0 0 0 3px currentColor inset}
.timer{font-family:"Russo One";font-size:clamp(48px,16vw,72px);text-align:center;color:var(--acc);margin:6px 0;font-variant-numeric:tabular-nums}

.mic{display:flex;gap:8px;align-items:stretch}
.mic textarea{min-height:52px;resize:none;flex:1}
.micb{flex:none;width:56px;border-radius:12px;border:1px solid var(--line);background:#0b0e13;display:grid;place-items:center}
.micb svg{width:24px;height:24px}
.micb.on{background:var(--red);border-color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--red) 30%,transparent)}}
.spk{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.spk button{flex:none;min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px}
.spk button.on{background:var(--acc);color:#111;border-color:var(--acc)}
.hostbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,#07090c 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom))}
.hostbar .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
.hostbar .lab{flex:1;font-size:13px;color:var(--mute);line-height:1.25}
.hostbar .lab b{color:var(--ink);display:block;font-size:14px}
.hostbar .btn{flex:none}
.night{background:#05060a}
.code{font-family:"Russo One";font-size:56px;letter-spacing:.12em;color:var(--acc);text-align:center;line-height:1}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:20;background:#000;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw}
.pass{min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.pass .nmx{font-family:"Russo One";font-size:40px;color:var(--acc)}
.win{text-align:center;padding:26px 16px;border-radius:20px;margin:12px 0}
.win.town{background:linear-gradient(160deg,#173d2a,#0f1a14)}.win.maf{background:linear-gradient(160deg,#4a0f17,#160a0c)}
.st{border-collapse:collapse;width:100%;font-size:14px}.st th,.st td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.st th:first-child,.st td:first-child{text-align:left}.st th{color:var(--mute);font-weight:600;font-size:13px}.scroll{overflow-x:auto}
.wrap{position:relative}.credit{position:absolute;top:max(12px,env(safe-area-inset-top));right:16px;font-size:13px;color:var(--mute);background:color-mix(in srgb,var(--acc) 10%,#0b0e13);border:1px solid var(--line);border-radius:999px;padding:5px 12px;z-index:4}
.games{display:grid;gap:14px;margin:14px 0}.gcard{display:block;width:100%;text-align:left;padding:0;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.gcard .pic{display:block;aspect-ratio:300/130;background:var(--b);color:var(--a)}.gcard .pic svg{width:100%;height:100%;display:block}
.gcard .tx{display:block;padding:14px 16px 16px}.gcard small{color:var(--a);font-weight:800}.gcard h2{margin:4px 0 6px}.gcard .go{display:inline-flex;margin-top:12px;padding:10px 18px;border-radius:12px;background:var(--a);color:#111;font-weight:800}

.binv{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.binv .chip{flex:none}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.bc{background:#0b0e13;border:1px solid var(--line);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;gap:2px}.bc b{font-size:14px;font-weight:700;line-height:1.3}.bc.hid{opacity:.55;border-style:dashed}.bc.act{margin-top:8px;border-color:var(--acc)}
.bp{border-top:1px solid var(--line);padding:10px 0}.bp:first-of-type{border-top:0}.bp.out{opacity:.75}.bph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.qr{width:200px;margin:12px auto;background:#fff;border-radius:12px;padding:6px}.qr svg{display:block;width:100%;height:auto}
.sep{height:1px;background:var(--line);margin:14px 0}
details summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
ul.rules{padding-left:20px}ul.rules li{margin:6px 0}

.sc{position:relative}.svc{position:absolute;top:8px;right:8px;z-index:2;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:800;padding:3px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.2)}.svc.lead{background:var(--acc,#ff4b4b);color:#111;border-color:transparent}.btn .svc{position:static;margin-left:6px}

epilogue:[
 'В 1998 году Пётр Гордеев запирал девятилетнюю дочь Лизу в подвале «в наказание». Однажды она упала с той же лестницы. Отец спрятал тело под полом подвала и сказал всем, что девочка ушла к реке. Одиннадцатилетний Олег всё видел. Отец заставил его молчать.',
 'Олег молчал двадцать семь лет. Он остался жить рядом, сохранил гараж на соседнем участке, из которого в подвал ведёт старый технический лаз с плана 1987 года, и хранил тетради сестры. Когда дом купила Вера и заказала вскрытие пола, тайна оказалась в нескольких днях от раскрытия.',
 'Сначала Олег пытался выжить Веру из дома. Он ставил ей проводку и замки и оставил себе сервисный ключ. По ночам он пробирался через лаз, стучал в стены и подбрасывал записки, срисовывая почерк сестры из её школьных тетрадей. Посёлок охотно поверил в призрака.',
 'Вера узнала, что пол вскроют 14-го, и в ночь на 14 ноября Олег пришёл через лаз, чтобы перенести останки сестры в нишу за стеной. Вера услышала шум, нашла щель за стеллажом и сфотографировала руку в проёме. В 00:47 она успела написать подруге: «Он здесь. В стене. Это не призрак».',
 'На лестнице они столкнулись. Синяки на запястьях — след этой короткой борьбы. В 00:58 сердце Веры остановилось. Олег поднялся наверх, по привычке задвинул щеколду и ушёл тем же путём через гараж. В 00:30 Тамара Соболева видела свет фонаря в его гараже, а в 01:15 он погас.',

 {h:'РАПОРТ · 14 ноября, 10:05'},
 {mono:'В 09:20 бригада ООО «ПодвалСтрой» прибыла для работ по вскрытию пола подвала. Дверь подвала была закрыта на щеколду СНАРУЖИ. Рабочие сорвали щеколду и обнаружили гр. Ланскую В.А. без признаков жизни у подножия лестницы.'},
 {mono:'Рядом с телом — включённый фонарь (батарея села). Под лестницей найден мобильный телефон потерпевшей, заблокирован паролем. Изъят.'},
 {mono:'На коленях и под ногтями потерпевшей — белая пыль, предположительно штукатурка. В подвале сыро, у дальней стены стоит деревянный стеллаж.'},
 {mono:'Вывод: несчастный случай. Потерпевшая оступилась на лестнице. Дверь, вероятно, захлопнулась, и щеколда упала сама.'},
 {sig:'Участковый уполномоченный ст. лейтенант Бекетов'}]},
s2:{t:'Фото: подвал',ty:'photo',start:1,b:[{svg:'basement'},{p:'Снимок криминалиста, 14 ноября, 11:30. Лестница, фонарь у нижней ступени, стеллаж у дальней стены.'},{hand:'За стеллажом — тёмная щель в кладке? Проверить. — пометка на обороте'}]},
s3:{t:'Дневник Веры',ty:'diary',start:1,b:[
 {hand:'28 августа. Первая ночь в доме! Наконец-то своё. Пахнет сыростью и старым деревом, но я счастлива.'},
 {hand:'19 сентября. Опять стук. В 2:10 ночи, снизу, будто кто-то медленно стучит костяшками по стене. Три раза. Пауза. Ещё три.'},
 {hand:'2 октября. Соседка, Тамара Ильинична, сказала, что в доме жила девочка Лиза, которая пропала много лет назад. «Она не любит чужих». Я посмеялась. Ночью смеяться не хотелось.'},
 {hand:'21 октября. На кухонном столе лежала записка. Детский почерк. Я была одна. Двери заперты. Я заперла их сама.'},
 {hand:'5 ноября. Кто-то переставил банки в подвале. Я туда неделю не спускалась.'},
 {hand:'12 ноября. Приходил Олег, чинил щиток. Долго стоял у двери в подвал. Спросил, когда начнут вскрывать пол. Я сказала — четырнадцатого с утра. Он побледнел и ушёл, не взяв денег.'},
 {hand:'13 ноября, 23:40. Стучит. Сегодня я найду, откуда.'}]},
s4:{t:'Анонимные записки',ty:'photo',start:1,b:[{p:'Три записки, найденные Верой в доме в октябре и ноябре. Хранились в ящике кухонного стола.'},{child:'УХОДИ ИЗ МОЕГО ДОМА'},{child:'ТЫ СПИШЬ В МОЕЙ КОМНАТЕ'},{child:'НЕ ТРОГАЙ ПОЛ'}]},
s5:{t:'Газета «Белоярский вестник», 1998',ty:'news',start:1,b:[
 {h:'ПРОПАЛА ДЕВОЧКА'},{svg:'girl'},
 {p:'14 мая 1998 г. пропала 9-летняя Елизавета (Лиза) Гордеева, родилась 13 апреля 1989 года. Проживала с родителями по ул. Сосновой, 12.'},
 {p:'По словам отца, Петра Гордеева, девочка ушла играть к реке. Её брат Олег, 11 лет, рассказал, что последний раз видел сестру «в подвале, она играла с куклой».'},
 {p:'Поиски на реке результатов не дали. Всех, кто что-либо знает, просят сообщить в милицию.'}]},

a1:{t:'План дома (БТИ, 1987)',ty:'plan',k:'arch',d:'Технический план дома и участка из архива',b:[{svg:'plan'},{mono:'Технический паспорт, 1987 г. Подвал соединён с гаражом на смежном участке 12а техническим лазом (теплотрасса, ширина 70 см). В паспорте 1999 г. лаз отмечен как «заложен кирпичом».'}]},
a2:{t:'Страховой полис Веры',ty:'invoice',k:'arch',d:'Страхование жизни',b:[{h:'ПОЛИС СТРАХОВАНИЯ ЖИЗНИ'},{kv:[['Застрахованная','Ланская В.А.'],['Сумма','5 000 000 ₸'],['Выгодоприобретатель','Ланской Максим Олегович (супруг)'],['Оформлен','за 3 года до гибели']]},{mono:'После развода выгодоприобретатель не менялся.'}]},
a3:{t:'Выписка из земельного реестра',ty:'report',k:'arch',d:'Кому принадлежит участок 12а',b:[{h:'ЗЕМЕЛЬНЫЙ РЕЕСТР'},{kv:[['Участок 12 (дом)','с августа — Ланская В.А. Продан через агентство «Карпов и партнёры».'],['Участок 12а (гараж)','Гордеев Олег Петрович. Не продавался. Смежный с участком 12.']]}]},
a4:{t:'Записи из дома престарелых',ty:'report',k:'arch',d:'Нина Гордеева, мать Олега и Лизы',b:[{h:'ДНЕВНИК НАБЛЮДЕНИЙ · ГОРДЕЕВА Н.С., 74 г.'},{mono:'Диагноз: деменция. Речь спутанная.'},{mono:'03.10: Плачет ночью. Повторяет: «Лиза в подвале. Петя сказал молчать».'},{mono:'27.10: Навещал сын Олег. После визита пациентка возбуждена: «Олежек носит ей кукол. Он хороший мальчик, он никому не скажет».'},{mono:'12.11: Спрашивала, «не мёрзнет ли Лизонька под полом».'}]},
a5:{t:'Распечатка звонков Веры',ty:'report',k:'arch',d:'Звонки и сообщения за 12–14 ноября',b:[{h:'ДЕТАЛИЗАЦИЯ'},{kv:[['12.11 18:05','Входящий · Гордеев О. · 1 мин'],['13.11 18:40','Исходящий · Карпов Д. · 6 мин'],['13.11 21:58','Входящий · Ланской М. · 2 мин'],['13.11 21:30','SMS → Мельник Е.'],['14.11 00:47','SMS → Мельник Е.'],['14.11 00:49','Исходящий вызов 112 · соединение не установлено']]}]},

i1:{t:'Допрос: Максим Ланской',ty:'talk',k:'talk',d:'Бывший муж',b:[{q:[['Следователь','Вы были в Белом Яру в ночь на 14-е?'],['Максим','Да. Приехал поговорить. Хотел… вернуть её. Около половины одиннадцатого был у дома.'],['Следователь','И?'],['Максим','Она не пустила. Сказала через дверь, что в доме кто-то есть и ей не до меня. Я подумал — новый мужчина. Уехал в гостиницу в Приозёрск.'],['Следователь','Вы знали, что остаётесь выгодоприобретателем по страховке?'],['Максим','…Знал. Но я её не трогал. Проверьте камеры в гостинице.']]}]},
i2:{t:'Допрос: Олег Гордеев',ty:'talk',k:'talk',d:'Электрик, сын прежних хозяев',b:[{q:[['Следователь','Где вы были ночью 13 ноября?'],['Олег','Дома. Спал.'],['Следователь','Ключи от дома Ланской у вас есть?'],['Олег','Нет. Все ключи я отдал ей.'],['Следователь','Вы работали в доме 12 ноября. Что-нибудь странное?'],['Олег','Дом плохой. Я ей говорил — не трогайте подвал. Лиза не любит, когда трогают её вещи.'],['Следователь','Лиза — ваша сестра. Она пропала в 1998-м.'],['Олег','Она никуда не пропадала. (долгая пауза) Я хотел сказать… её не нашли.']]}]},
i3:{t:'Допрос: Тамара Соболева',ty:'talk',k:'talk',d:'Соседка напротив',b:[{q:[['Тамара','Я ей говорила — уезжай, девонька. Соль на пороги сыпала. Не послушала.'],['Следователь','Что вы видели вечером 13-го?'],['Тамара','В семь приехал этот, риелтор, на серебристой машине. Уехал минут через сорок, злой. В пол-одиннадцатого — чёрная машина, мужчина у двери стоял, потом уехал.'],['Следователь','А ночью?'],['Тамара','Не сплю я ночами, молюсь. В половине первого в гараже Гордеевых свет ходил. Фонарь. Будто кто-то внутри шарит. В четверть второго погас.'],['Следователь','Олег часто бывает в гараже?'],['Тамара','Днём бывает. Ночью — никогда не видела. Он у себя комнату Лизы до сих пор держит, как была. Тетрадки её, кукол. Не по-людски это.']]}]},
i4:{t:'Допрос: Денис Карпов',ty:'talk',k:'talk',d:'Риелтор',b:[{q:[['Следователь','Вы скрыли от покупательницы историю дома?'],['Денис','Я обязан говорить о дефектах, а не о сказках. Ну да, про пропавшую девочку не сказал. И что подвал сырой — тоже.'],['Следователь','13-го вы были у неё.'],['Денис','С семи до восьми. Она требовала вернуть часть денег, грозила судом. Я уехал в Приозёрск, сидел в баре «Кедр» до половины второго. Чек сохранился, бармен подтвердит.'],['Следователь','Вы знаете Олега Гордеева?'],['Денис','Он единственный был против продажи. Даже приходил в агентство, просил «не продавать подвал». Чудак.']]}]},
i5:{t:'Показания подруги, Е. Мельник',ty:'talk',k:'talk',d:'Получала сообщения от Веры',b:[{q:[['Катя','Она месяц писала мне про стуки. Я думала — нервы, переезд.'],['Следователь','Что она писала в ту ночь?'],['Катя','В 21:30: «Опять стучит. Сегодня найду, откуда». А в 00:47… вот, смотрите.']]},{sms:'он здесь. в стене. это не призрак'},{q:[['Катя','Я спала. Увидела утром. Если бы я тогда проснулась…']]}]},

o1:{t:'Осмотр подвала: за стеллажом',ty:'scene',k:'scene',d:'Отодвинуть стеллаж',need:['a1'],b:[{svg:'niche'},{mono:'За стеллажом — участок кладки, где кирпичи держатся без раствора. За ними ниша 1×1,5 м и узкий тёмный лаз, уходящий в сторону соседнего участка.'},{mono:'В нише: обрывок брезента, моток верёвки, пятна машинного масла, свежая известковая крошка.'},{mono:'Из лаза тянет холодом. Где-то в глубине, кажется, капает вода.'}]},
o2:{t:'Обыск гаража Гордеева',ty:'scene',k:'scene',d:'Нужен ордер: улики против владельца',need:['o1','a3'],b:[{mono:'Под верстаком — люк. Под ним выход того самого лаза. Земля у люка свежая.'},{mono:'В гараже: фонарь с почти разряженной батареей, рулон брезента, рабочие ботинки в известковой пыли.'},{mono:'На полке коробка: школьные тетради Е. Гордеевой за 1997–1998 гг. На вырванных листах — прописи. Кто-то взрослый раз за разом обводил буквы детского почерка: «УХОДИ», «ДОМ», «ПОЛ».'},{red:'Ордер на задержание Гордеева О.П. подготовлен.'}]},
o3:{t:'Осмотр чердака',ty:'scene',k:'scene',d:'Старые вещи прежних хозяев',b:[{svg:'drawing'},{mono:'На балках — детские рисунки 1998 года, выцарапанные гвоздём и нарисованные мелом. Дом, под домом маленькая фигурка. Подпись: «Я в подвале. Папа злой».'},{mono:'В углу под досками — жестяная шкатулка с кодовым замком на 4 цифры. На крышке выцарапано: «ЛИЗА. МОЙ ДЕНЬ РОЖДЕНИЯ».'}]},

  if(ph==='intro')dRound();
  else if(ph==='inv'){if(d.round<3){const nt=DD().nights[d.round];if(nt&&!d.board.includes(nt.doc))d.board.push(nt.doc);chron(nt.t+': '+DD().docs[nt.doc].t+'.');setPhase('dnight')}else setPhase('accuse')}

function dFinish(){const C=DD(),pts={},won={},score={},awards=[];const subs=S.players.filter(p=>S.inp[p.pid]?.acc);

epilogue:[
 'Дед Алины, Аркадий Воронцов, оставил ей контрольный пакет банка «Северный капитал» с условием: ко дню 27-летия она должна быть замужем. Иначе доля переходила ко второй внучке, Вике. Алине исполнялось 27 пятнадцатого сентября. Свадьбу назначили на последний возможный день, а когда регистратор застрял в тумане, роспись перенесли на 22:30. До полуночи оставалось совсем немного.',
 'Вика узнала об условии ещё в июне, взяв у нотариуса копию завещания. Всю жизнь она была «второй дочерью», и тут у неё появился шанс. Помочь согласился Марат Исаев, начальник охраны усадьбы, её тайный парень. Он знал усадьбу лучше всех: чёрную лестницу из гардеробной люкса, подземный ход для прислуги из кухонного крыла и старый ледник под часовней с музейным кодовым замком.',
 'Сначала Вика поссорила сестру с женихом. В 20:31 она написала Алине, что Тимур знал о дыре в банке и что их женят ради слияния. В 21:10 на террасе вышла ссора, которую слышали официанты. Если невеста исчезнет, все решат, что она сбежала после скандала.',
 'В 21:13 Вика взяла у бара два бокала и написала Алине, что ждёт её в номере. В бокал сестры она подмешала своё снотворное. В 21:29 Алина ещё пыталась записать голосовое Тимуру. Вика вернулась в зал и попросила Тимура не подниматься: «она прилегла». В 21:36 она позвонила Марату. В 21:44 Марат своей картой открыл щитовую и вручную выключил свет.',
 'В темноте Марат поднялся по чёрной лестнице в гардеробную люкса, спустил Алину на тележке для льда и унёс по подземному ходу в ледник. Там он заранее постелил солому и пледы: убивать её не собирались, нужно было только продержать до полуночи. Тем временем Вика накинула белый дождевик из спа и фату сестры и прошла в тумане к причалу под камерой видеографа. Это и была Белая невеста. Она бросила фату и туфлю в воду, оставила дождевик в лодочном сарае и вернулась в зал с мокрым подолом.',
 'План был такой: после полуночи Алину «найдут» в тумане, растерянную, без памяти, и все решат, что она сбежала и передумала. Но к ночи в усадьбу приехала полиция, на берегу работали водолазы, и Марат побоялся. Ночами он носил ей воду. Свет в часовне в три часа ночи был его свечой. Там же, в леднике, он обронил служебный телефон. Им Алина в темноте и смогла один раз дозвониться Тимуру.',
 'Запонку Тимур потерял в лодочном сарае, когда бежал к воде искать невесту. Артём в саду не уговаривал Алину сбежать: она вернула ему старое кольцо и попрощалась. А Глеб Воронцов больше всех хотел, чтобы свадьба состоялась: банку был нужен союз с Амановыми.',
 'Люк ледника открыли на рассвете. Алина лежала на соломе в свадебном платье, укрытая двумя пледами. Она была жива. Первое, что она сказала: «Вика обещала, что это ненадолго». Через месяц они с Тимуром расписались в городском ЗАГСе. Без гостей.'],

 {h:'СЛЕДСТВЕННЫЙ ОТДЕЛ · ДЕЛО №112'},{mono:'Пропала: Воронцова Алина Глебовна, 26 лет. Исчезла 14 сентября около 21:20 во время собственной свадьбы в загородной усадьбе «Журавли».'},
 {p:'Лодки и водолазы ничего не нашли. Пресса уже пишет про «проклятие усадьбы». Семьи требуют результата.'},
 {h:'Круг лиц'},
 {kv:[['Тимур Аманов, 29','Жених. Сын владельца «Аман Групп».'],['Глеб Воронцов, 58','Отец невесты. Председатель правления банка «Северный капитал».'],['Виктория (Вика) Воронцова, 24','Сводная сестра невесты, дочь Глеба от второго брака. Подружка невесты.'],['Артём Ким, 28','Свадебный фотограф. Бывший парень Алины.'],['Марат Исаев, 35','Начальник охраны усадьбы.']]},
 {red:'У вас 3 дня. Если она жива, время работает против неё.'}]},
s1:{t:'Хронология вечера',ty:'report',start:1,b:[
 {h:'СВОДКА ПО ПОКАЗАНИЯМ ГОСТЕЙ'},
 {tl:[['18:00','Регистрация не началась: регистратор застрял в тумане на трассе. Роспись перенесли на 22:30, банкет начали раньше.'],['21:10','Алина и Тимур о чём-то спорят на террасе.'],['21:20','Алина выходит из зала: «поправлю платье».'],['21:35','Вика возвращается в зал одна.'],['21:44','Во всём главном корпусе гаснет свет.'],['21:50','Свет дают.'],['21:52','Гости на террасе видят фигуру в фате, уходящую в туман к причалу.'],['22:30','Приезжает регистратор. Невесты нет.'],['23:30','Фату находят на воде у причала, левую туфлю невесты на мелководье.'],['00:15','Вызвана полиция.']]},
 {tiny:'Камеры в историческом корпусе не установлены по требованию музея. Работают только камеры на воротах и парковке.'}]},
s2:{t:'Программа свадьбы',ty:'invoice',start:1,b:[
 {h:'СВАДЬБА АЛИНЫ И ТИМУРА · 14 СЕНТЯБРЯ'},{kv:[['16:00','Сбор гостей, фуршет у озера'],['18:00','Выездная регистрация на причале'],['19:00','Банкет в Белом зале'],['21:45','Первый танец'],['23:00','Салют над озером'],['00:00','Торт ко дню рождения невесты: второй ярус, надпись «27»']]},
 {red:'Изменение 17:40: регистрация переносится на 22:30'},{tiny:'Организатор: агентство «Шёлк». Подружка невесты — Виктория Воронцова: второй ключ от люкса невесты, кольца, фата.'}]},
s3:{t:'Буклет усадьбы «Журавли»',ty:'news',start:1,b:[
 {h:'ЛЕГЕНДА О БЕЛОЙ НЕВЕСТЕ'},
 {p:'Усадьбу построил помещик Николай Вязьмин в 1903 году. Осенью 1912 года, в ночь своей свадьбы, его молодая жена Анна исчезла из дома. Гости видели, как женщина в белом уходит в туман к озеру. Озеро обыскивали неделями.'},
 {p:'Весной Анну нашли в леднике под домовой часовней. Как она туда попала, никто так и не узнал. Вязьмин заколотил часовню и уехал навсегда.'},
 {p:'С тех пор в туманные ночи у воды видят Белую невесту. Говорят, она уводит за собой тех, кто выходит замуж в «Журавлях».'},
 {tiny:'Часовня и ледник закрыты для посещения. Экскурсии в подвалы не проводятся.'}]},
s4:{t:'Карточка с тостом жениха',ty:'diary',start:1,b:[
 {p:'Найдена в кармане пиджака Тимура. Тост так и не прозвучал.'},
 {hand:'Алина. Мы познакомились 9 июля, три года назад, на причале этой самой усадьбы. Ты уронила телефон в воду, а я, как дурак, полез за ним в костюме.'},
 {hand:'Вика, спасибо тебе: это ты затащила меня тогда на ту вечеринку. Без тебя ничего бы не было.'},
 {hand:'Сегодня я обещаю: больше никаких секретов. Ни про банк, ни про бизнес, ни про что.'}]},
s5:{t:'Кадр видеографа, 21:52',ty:'photo',start:1,b:[{svg:'w_video'},{p:'Камера видеографа на террасе. Фигура в фате идёт по причалу в сторону воды. Через восемь секунд её скрывает туман.'},{hand:'Видно плохо. Платье до щиколоток? Капюшон? — пометка оперативника'}]},
s6:{t:'Карточка свадебного салона',ty:'invoice',start:1,b:[
 {h:'САЛОН «ЛЕБЕДЬ» · ЗАКАЗ №3091'},{kv:[['Клиент','Воронцова А.Г.'],['Рост','178 см'],['Модель','«Лебедь», шлейф 3 м, вышивка речным жемчугом'],['Застёжка','корсет на 32 пуговицах: снять платье без помощника невозможно'],['Обувь','туфли белые, размер 40'],['Фата','2,5 м, на гребне']]},{tiny:'Примерка: невеста с подружкой (В. Воронцова, рост 164 см, платье подружки — пудровое).'}]},
s7:{t:'Схема усадьбы для гостей',ty:'plan',start:1,b:[{svg:'w_map'},{mono:'Главный корпус (Белый зал, номера на 2-м этаже, люкс невесты), кухонное крыло, спа, терраса, причал, лодочный сарай. Часовня на берегу закрыта.'}]},

a1:{t:'План имения, 1903 год',ty:'plan',k:'arch',d:'Чертёж из музейного фонда усадьбы',b:[{svg:'w_plan'},{mono:'Оригинальный план имения. Из кухни на второй этаж ведёт «чёрная лестница» для прислуги: выход в гардеробную хозяйских покоев (сейчас люкс невесты).'},{mono:'Из кухни к часовне на берегу идёт подземный ход для прислуги. Он заканчивается у ледника под часовней.'},{tiny:'На современной схеме для гостей ни лестница, ни ход не отмечены.'}]},
a2:{t:'Завещание Аркадия Воронцова',ty:'report',k:'arch',d:'Выписка у нотариуса',b:[{h:'ВЫПИСКА ИЗ ЗАВЕЩАНИЯ'},{mono:'51% акций АО «Северный капитал» завещаю внучке Алине Глебовне Воронцовой при условии, что ко дню своего 27-летия она будет состоять в зарегистрированном браке.'},{mono:'Если условие не выполнено, указанная доля переходит к внучке Виктории Глебовне Воронцовой.'},{h:'ЖУРНАЛ НОТАРИУСА'},{kv:[['03.06','Копия завещания выдана: В.Г. Воронцовой (по личному запросу)'],['12.09','Звонок от А.Г. Воронцовой: вопрос о сроке «до 27 лет»']]}]},
a3:{t:'Журнал карт доступа и щитовой',ty:'report',k:'arch',d:'Служебные двери и электрощитовая',b:[{h:'СИСТЕМА ДОСТУПА · 14.09'},{kv:[['21:43:50','Электрощитовая · карта №07 (Исаев М., охрана)'],['21:44:02','Щит ГРЩ: ручное отключение QF1 «Главный корпус»'],['21:46:15','Служебная дверь кухонного крыла · карта №07'],['21:50:30','Щит ГРЩ: включение QF1'],['21:58:40','Служебная дверь кухонного крыла · карта №07']]},{tiny:'Аварийных отключений и перегрузок за вечер не зафиксировано.'}]},
a4:{t:'Детализация звонков Вики',ty:'report',k:'arch',d:'Телефон Виктории Воронцовой',b:[{h:'ДЕТАЛИЗАЦИЯ · В. ВОРОНЦОВА'},{kv:[['За август','63 звонка на номер Исаева М.'],['14.09 20:31','SMS → Воронцова А.'],['14.09 21:16','SMS → Воронцова А.'],['14.09 21:36','Исходящий · Исаев М. · 40 с'],['14.09 22:41','Входящий · Исаев М. · 2 мин'],['15.09 00:02','SMS → Исаев М.']]},{tiny:'Тексты сообщений оператор не хранит.'}]},
a5:{t:'Рецептурная база',ty:'report',k:'arch',d:'Кому выписывали это снотворное',need:['l1'],b:[{h:'ОТВЕТ НА ЗАПРОС'},{kv:[['Препарат','Золпидем 10 мг'],['Пациент','Воронцова Виктория Глебовна'],['Выписан','30.08, частная клиника «Мерей»'],['Выдано','2 упаковки']]}]},
a6:{t:'Финансы банка «Северный капитал»',ty:'invoice',k:'arch',d:'Справка финансовой разведки',b:[{h:'СПРАВКА'},{mono:'У банка дыра в капитале около 40 млрд ₸. Спасение — слияние с «Аман Групп», подписание назначено на понедельник, 16 сентября.'},{mono:'Слияние держится на свадьбе: обе семьи договорились объединиться после росписи детей.'},{red:'Вывод: Глебу Воронцову срыв свадьбы невыгоден'}]},
/* ---- допросы ---- */
i1:{t:'Допрос: Тимур Аманов',ty:'talk',k:'talk',d:'Жених',b:[{q:[['Следователь','О чём вы спорили на террасе в 21:10?'],['Тимур','Она кричала: «Ты знал и молчал!» Кто-то сказал ей, что я знал про проблемы банка её отца. Я знал. Но женюсь я не ради слияния.'],['Следователь','Что было потом?'],['Тимур','В 21:38 ко мне подошла Вика. Сказала, Алина прилегла, у неё голова кружится, просила не подниматься. Я послушал. Дурак.'],['Следователь','Где вы были, когда погас свет?'],['Тимур','У бара. Когда увидел фигуру у воды, побежал к причалу, потом в лодочный сарай. Кричал её имя.']]}]},
i2:{t:'Допрос: Виктория Воронцова',ty:'talk',k:'talk',d:'Сводная сестра, подружка невесты',b:[{q:[['Вика','Ей стало плохо от нервов. Я уложила её в номере и в 21:30 спустилась в зал.'],['Следователь','Где вы были, когда погас свет?'],['Вика','В зале, рядом с папой. Держала его за руку, мне было страшно. Он подтвердит.'],['Следователь','Вы знали об условиях завещания деда?'],['Вика','Каких условиях? Дед со мной о делах не разговаривал. Я всегда была «вторая».'],['Вика','Вы же видели видео. Она ушла к озеру. В этом доме все невесты уходят к озеру.']]}]},
i3:{t:'Допрос: Артём Ким',ty:'talk',k:'talk',d:'Фотограф, бывший парень невесты',b:[{q:[['Следователь','Вас видели с Алиной в саду в 20:50.'],['Артём','Да. Она вернула мне кольцо, которое я подарил ей четыре года назад. Сказала, что любит Тимура. Я не стал устраивать сцен.'],['Следователь','Что вы делали, когда погас свет?'],['Артём','Работал. Снимал зал со вспышкой, вслепую, каждые несколько секунд. Хотел кадры при свечах. Все мои снимки с точным временем. Проверьте их, там весь вечер.']]}]},
i4:{t:'Допрос: Марат Исаев',ty:'talk',k:'talk',d:'Начальник охраны усадьбы',b:[{q:[['Следователь','Где вы были весь вечер?'],['Марат','На воротах. Не отходил.'],['Следователь','Почему погас свет?'],['Марат','Перегрузка. Салютчики подключались.'],['Следователь','Вы знакомы с Викторией Воронцовой?'],['Марат','Видел сегодня впервые. Подружка невесты, кажется.'],['Следователь','Часовня, ледник?'],['Марат','Закрыто с июля. Там старый музейный кодовый замок. Говорят, Вязьмину там весной нашли. Я туда не хожу.']]}]},
i5:{t:'Допрос: горничная Зарина',ty:'talk',k:'talk',d:'Персонал главного корпуса',b:[{q:[['Зарина','В 22:40 Виктория Глебовна отдала мне платье в срочную чистку. Подол был мокрый, в иле и ряске, как будто она в воду заходила. Просила никому не говорить, мол, неудобно.'],['Следователь','Что-нибудь ещё?'],['Зарина','Из спа пропал белый дождевик с капюшоном, я сама их вешаю. А когда погас свет, в кухонном крыле по старому коридору что-то тяжело катили. Я подумала, лёд для бара везут.']]}]},
i6:{t:'Допрос: Глеб Воронцов',ty:'talk',k:'talk',d:'Отец невесты',b:[{q:[['Глеб','Я хотел этой свадьбы больше всех. Не буду врать: банку нужен союз с Амановыми.'],['Следователь','Условие в завещании вашего отца?'],['Глеб','Отец был старой закалки: «внучка должна быть устроена». Поэтому свадьбу и назначили на четырнадцатое, последний день перед её днём рождения.'],['Следователь','Ваша младшая дочь была рядом, когда погас свет?'],['Глеб','Вика? Нет. Когда дали свет, её стул был пуст. Она пришла минут через двадцать, подол мокрый. Сказала, что искала Алину у воды.']]}]},

l1:{t:'Экспертиза бокалов из люкса',ty:'lab',k:'lab',d:'Два бокала с прикроватной тумбы',need:['o1'],b:[{h:'ЗАКЛЮЧЕНИЕ №5520'},{mono:'Бокал №1: помада нюдового оттенка (как у невесты, по карточке визажиста). В остатке шампанского — золпидем (снотворное) в дозе, от которой засыпают через 10–15 минут.'},{mono:'Бокал №2: помада кораллового оттенка. Снотворного нет.'},{tiny:'Визажист: коралловый оттенок в тот день был у подружки невесты.'}]},
l2:{t:'Снимки фотографа',ty:'lab',k:'lab',d:'Вся карта памяти Артёма Кима',need:['i3'],b:[{svg:'w_flash'},{kv:[['19:05','Случайно на фоне: у лодочного сарая целуются двое. Девушка в пудровом платье подружки невесты и мужчина в чёрной форме охраны с гарнитурой.'],['21:13','Вика (тёмно-русое каре, на левом запястье браслет-цепочка с подвеской «V») у бара берёт два бокала шампанского.'],['21:47:31','Кадр со вспышкой в темноте: стул Вики рядом с Глебом пуст, на столе её клатч. Тимур стоит у бара.'],['21:44–21:50','Артём снимает зал непрерывно: 41 кадр.']]}]},
l3:{t:'Улучшение видео 21:52',ty:'lab',k:'lab',d:'Покадровый разбор записи',b:[{svg:'w_wrist'},{mono:'Рост фигуры по столбикам причала (1,2 м): 163–166 см.'},{mono:'Платье до щиколоток, шлейфа нет. На голове фата поверх капюшона.'},{mono:'На левом запястье блестит браслет-цепочка с подвеской в виде буквы.'}]},
l4:{t:'Экспертиза фаты',ty:'lab',k:'lab',d:'Фата, найденная на воде',b:[{mono:'Фата не оторвана: срезана ножницами у самого гребня.'},{mono:'На гребне — несколько длинных волос, тёмно-русых. Алина — платиновая блондинка.'},{mono:'Ил и ряска того же состава, что у причала.'}]},
/* ---- осмотры ---- */
o1:{t:'Осмотр люкса невесты',ty:'scene',k:'scene',d:'Номер на втором этаже',b:[{mono:'Покрывало на кровати смято. На тумбе два бокала из-под шампанского (изъяты). Диадема на полу. Правая туфля невесты под креслом.'},{mono:'Под кроватью телефон невесты, заблокирован паролем.'},{mono:'В гардеробной старая узкая дверь, за ней крутая лестница вниз. Дверь не заперта. На пороге жемчужина.'},{h:'ЖУРНАЛ ЭЛЕКТРОННОГО ЗАМКА'},{kv:[['21:14','Ключ №2 (подружка невесты)'],['21:20','Ключ №1 (невеста)'],['21:33','Открыто изнутри']]}]},
o2:{t:'Осмотр лодочного сарая',ty:'scene',k:'scene',d:'Сарай у причала',b:[{mono:'На крюке висит мокрый белый дождевик с капюшоном из спа-корпуса, подол в иле.'},{mono:'На полу золотая запонка с гравировкой «Т.А.».'},{mono:'Мокрые следы женских туфель на каблуке, размер около 37, ведут от двери к воде и обратно — к садовой дорожке на террасу.'}]},
o3:{t:'Осмотр кухонного крыла',ty:'scene',k:'scene',d:'Старый коридор за холодильными камерами',need:['a1'],b:[{mono:'За холодильной камерой — дубовая дверь с плана 1903 года. Петли недавно смазаны. Отсюда наверх ведёт чёрная лестница, вниз — ход.'},{mono:'У двери стоит тележка для льда. В колесе застряли белые шёлковые нитки и жемчужина.'},{mono:'На полу хода в пыли две параллельные полосы, будто что-то волокли. Из темноты тянет сырым холодом, где-то капает вода. Ход ведёт к озеру.'}]},
o4:{t:'Осмотр часовни',ty:'scene',k:'scene',d:'Закрытая часовня на берегу',need:['o3'],b:[{svg:'w_hatch'},{mono:'Дверь часовни заперта, но подземный ход выводит прямо под неё. На каменном полу свежие капли воска, обёртка от бутылки воды.'},{mono:'В полу люк в ледник, на нём старый музейный кодовый замок. Табличка: «Здесь нашли невесту Вязьмина».'},{mono:'Если приложить ухо к люку, слышно, как внизу капает вода. И, кажется, кто-то тихо стучит.'}]},
/* ---- замки ---- */
p1:{t:'Телефон Алины',ty:'phone',lockOnly:1,b:[{h:'СООБЩЕНИЯ · ВИКА'},{smi:'20:31 Вика: Ты должна знать. Тимур в курсе про дыру в папином банке. Вас женят ради слияния.'},{smi:'21:16 Вика: Я у тебя в номере. Зайди на 5 минут, это про папу. Тимуру ни слова.'},{h:'ЗАМЕТКИ · 12.09'},{mono:'Спросить нотариуса: почему дед написал «до 27»? И кто ещё знает про это условие?'},{h:'ГОЛОСОВОЕ · 21:29 · не отправлено'},{mono:'(невнятно) «Тимур… прости за террасу… мне что-то… всё плывёт… Вика, зачем ты закрыла…»'}]},
p2:{t:'Ледник',ty:'scene',lockOnly:1,b:[{mono:'Замок щёлкает. Из люка поднимается холод. Вниз ведёт железная лесенка, стены каменного погреба покрыты инеем.'},{mono:'На соломе, под двумя пледами из спа-корпуса, лежит женщина в свадебном платье, расшитом жемчугом. Рядом пустые бутылки из-под воды и служебный телефон охраны №2.'},{hand:'Она открывает глаза и шепчет: «Вика сказала, это ненадолго. До полуночи…»'}]},

const ESVG=(()=>{const clk=(cx,cy,r,h,m,col)=>{const ah=((h%12)+m/60)*30-90,am=m*6-90,R=Math.PI/180;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#f4ecd8" stroke="${col}" stroke-width="${r*.18}"/>${Array.from({length:12},(_,i)=>`<circle cx="${cx+Math.cos(i*30*R)*r*.78}" cy="${cy+Math.sin(i*30*R)*r*.78}" r="${r*.05}" fill="#3a2f22"/>`).join('')}<path d="M${cx} ${cy}L${cx+Math.cos(ah*R)*r*.45} ${cy+Math.sin(ah*R)*r*.45}" stroke="#1b140c" stroke-width="${r*.09}" stroke-linecap="round"/>${m<0?'':`<path d="M${cx} ${cy}L${cx+Math.cos(am*R)*r*.7} ${cy+Math.sin(am*R)*r*.7}" stroke="#1b140c" stroke-width="${r*.05}" stroke-linecap="round"/>`}<circle cx="${cx}" cy="${cy}" r="${r*.07}" fill="#1b140c"/>`};
 const gear=(cx,cy,r,t,sym,n)=>{let d='';for(let i=0;i<t;i++){const a=i/t*Math.PI*2,b=(i+.5)/t*Math.PI*2;d+=`${i?'L':'M'}${cx+Math.cos(a)*r} ${cy+Math.sin(a)*r}L${cx+Math.cos(a)*(r+6)} ${cy+Math.sin(a)*(r+6)}L${cx+Math.cos(b)*(r+6)} ${cy+Math.sin(b)*(r+6)}L${cx+Math.cos(b)*r} ${cy+Math.sin(b)*r}`}
  return `<path d="${d}Z" fill="#b08d4a" stroke="#6a5226"/><circle cx="${cx}" cy="${cy}" r="${r*.55}" fill="#8a6c34"/><text x="${cx}" y="${cy+7}" text-anchor="middle" font-size="20" fill="#f4ecd8">${sym}</text><text x="${cx}" y="${cy+r+22}" text-anchor="middle" font-size="12" font-family="PT Mono,monospace" fill="#3a2f22">${n} зуб.</text>`};
 const L='АЕИКЛМНОРСТЯ';

Object.assign(ER_ALC,{evName:'ОБХОД',evBar:'Обход охраны',evWarn:'Не трогайте замки.',evChron:'тронул(а) замок во время обхода. Охрана что-то услышала',evRule:'<b>Обходы охраны.</b> Во время обхода на экране загорается красное предупреждение. Не трогайте замки, пока оно горит: любая попытка считается ошибкой.'});
ER_SEA.evRule='<b>Скачки давления.</b> Несколько раз корпус станции встряхивает, и на экране загорается красное предупреждение. Пока оно горит, механизмы заклинило: любая попытка открыть замок считается ошибкой со штрафом.';
const EROOMS={clock:ER_CLOCK,sea:ER_SEA,alcatraz:ER_ALC};
const ERR=()=>EROOMS[(S&&S.mode==='esc'&&S.room)||ui.room]||ER_CLOCK;
const eStatKey=()=>(S&&S.room&&S.room!=='clock')?'esc_'+S.room:'esc';
const eLvl=R=>{const L=ELV[R.lvl||'normal'];return `<span class="elv" style="--c:${L[1]}">${L[0]}</span>`};
const erStrip=(sel,act)=>`<div class="strip">${Object.values(EROOMS).map(x=>`<button class="sc ${sel===x.id?'on':''}" style="--a:${x.acc};--b:${x.bg}" data-act="${act}" data-v="${x.id}"><span class="pic">${pic(x.pic)}</span><span class="tx"><small>${ELV[x.lvl][0]} · ${x.min} мин</small><h3>${esc(x.title)}</h3></span></button>`).join('')}</div>`;
const ePat=()=>{if(!S||!S.esc||S.phase!=='esc')return null;const t=eLeft();return (ERR().patrols||[]).find(([m,d])=>t<=m*60&&t>m*60-d)||null};
const eShow=t=>ERR().fuzzy?(t>300?'≈ '+Math.ceil(t/60)+' мин':t>0?'< 5 мин':'0 мин'):eFmt(t);
function eRecs(id){const r=LS.get('maf.erec',null)||{};return r[id]||[]}
function eRecSave(){if(!S||!S.esc||S.win.side!=='town')return null;const R=ERR(),all=LS.get('maf.erec',null)||{},L=all[R.id]=all[R.id]||[];
  const ex=L.find(x=>x.gid===S.gid);if(ex)return L.indexOf(ex);const used=R.min*60-(S.esc.leftAt||0);
  L.push({gid:S.gid,s:used,n:S.local?'Один телефон':S.players.map(p=>p.name).join(', '),d:new Date().toLocaleDateString('ru-RU'),k:S.players.length});L.sort((a,b)=>a.s-b.s);all[R.id]=L.slice(0,10);LS.set('maf.erec',all);return all[R.id].findIndex(x=>x.gid===S.gid)}
function eRecHtml(id,hl){const L=eRecs(id);return `<div class="box"><div class="lbl">Рекорды · ${esc(EROOMS[id].title)}</div>${L.length?L.slice(0,5).map((x,i)=>`<p class="small" style="${x.gid===hl?'color:var(--acc)':''}"><b>${i+1}. ${eFmt(x.s)}</b> · ${esc(x.n)} <span class="mute">· ${esc(x.d)}</span></p>`).join(''):'<p class="small mute">Пока никто не выбрался. Будьте первыми.</p>'}<p class="tiny mute">Время с учётом штрафов. Хранится на этом телефоне.</p></div>`}

/* ---------- Побег: механика ---------- */
const ES=()=>!!S&&S.mode==='esc';
const eNow=()=>Date.now()+((isHost||S.local)?0:(ui.skew||0));
const eLeft=()=>{const e=S.esc;if(!e||!e.end)return ERR().min*60;return Math.max(0,Math.round(((e.done||eNow())-e.end)/-1000))};
const eFmt=t=>`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
const ePz=id=>ERR().pz.find(p=>p.id===id);
function eOpen(p){const e=S.esc;if(e.solved[p.id])return false;if(p.fin)return ERR().pz.every(q=>q.fin||e.solved[q.id]);return ERR().pz.filter(q=>q.st<p.st).every(q=>e.solved[q.id])}
const eNorm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[\s.,!-]/g,'');
function eStart(){const n=S.players.length,ps=shuf(S.players.map(p=>p.pid));const cards={};let off=0;
  ERR().pz.forEach(p=>{p.cards.forEach((c,i)=>cards[c]=ps[(off+i)%n]);off+=p.cards.length});
  S.esc={end:0,done:0,solved:{},cards,hints:{},last:null,cnt:{},nonce:{},wrong:0};
  S.players.forEach(p=>{p.alive=true;p.role='esc'});
  S.day=1;S.log=[];S.chron=[];S.priv={};S.win=null;S.res=null;S.final=null;S.inv={};S.meters={a:1,b:1,c:1};
  chron(`${ERR().title}: заперты ${n} чел. Таймер ${ERR().min} минут.`);setPhase('eintro')}
function eGo(){S.esc.end=Date.now()+ERR().min*60000;chron('Таймер пошёл.');setPhase('esc')}
function eAdvance(){if(S.phase==='eintro')eGo()}
function eAuto(){if(S.phase==='eintro'&&!S.local){const g=goN(),t=pool().length;if(t&&(g>=t||(g>=goNeed()&&age()>25)))eGo();return}
  if(S.phase==='esc'&&S.esc.end&&Date.now()>S.esc.end)eFinish(false)}
function eInput(pid,k,v){const p=P(pid),e=S.esc;if(!p||S.phase!=='esc'||!v||typeof v!=='object')return false;
  if(v.n!=null){if((e.nonce[pid]||{})[k]===v.n)return false;(e.nonce[pid]=e.nonce[pid]||{})[k]=v.n}
  const z=ePz(v.p);if(!z||!eOpen(z))return false;const c=e.cnt[pid]=e.cnt[pid]||{};
  if(k==='hint'){if(ERR().noHints)return false;const lv=e.hints[z.id]||0;if(lv>=z.hints.length)return false;e.hints[z.id]=lv+1;e.end-=(ERR().hintMin||2)*60000;c.hint=(c.hint||0)+1;chron(`${p.name} взял(а) подсказку: «${z.t}» (−${ERR().hintMin||2} мин).`);e.last={id:rid(5),ty:'hint',p:z.id,by:pid};return true}
  if(k==='ans'){const R=ERR();if(ePat()){e.wrong++;c.wrong=(c.wrong||0)+1;if(!R.maxWrong)e.end-=(R.wrongPen||30)*1000;e.last={id:rid(5),ty:'heard',p:z.id,by:pid};chron(`${p.name} ${R.evChron||'тронул(а) замок во время события'}${R.maxWrong?'':` (−${R.wrongPen||30} с)`}.`);if(R.maxWrong&&e.wrong>=R.maxWrong)eFinish(false,'caught');return true}
    const ok=z.ans.some(a=>eNorm(a)===eNorm(v.v));e.last={id:rid(5),ty:ok?'ok':'bad',p:z.id,by:pid};
    if(ok){e.solved[z.id]=pid;c.solve=(c.solve||0)+1;chron(`${p.name} открыл(а): «${z.t}».`);if(z.fin)eFinish(true)}
    else{const pen=R.wrongPen||30;e.end-=pen*1000;e.wrong++;c.wrong=(c.wrong||0)+1;chron(`Неверно: «${z.t}» (−${pen} с${R.maxWrong?`, ошибка ${e.wrong} из ${R.maxWrong}`:''}).`);if(R.maxWrong&&e.wrong>=R.maxWrong)eFinish(false,'caught')}return true}
  return false}
function eFinish(won,why){const e=S.esc;if(S.phase==='end')return;e.done=Date.now();e.caught=why==='caught';const ST=ERR().stars||[20,10];const left=won?Math.max(0,Math.round((e.end-e.done)/1000)):0;e.leftAt=left;
  const stars=won?(left>=ST[0]*60?3:left>=ST[1]*60?2:1):0;const pts={},wonP={},awards=[];
  S.players.forEach(p=>{const c=e.cnt[p.pid]||{};pts[p.pid]=(c.solve||0)+stars*2;wonP[p.pid]=won});
  if(!S.local){let b=null,bv=0,tie=false;S.players.forEach(p=>{const v=(e.cnt[p.pid]||{}).solve||0;if(v>bv){bv=v;b=p;tie=false}else if(v===bv)tie=true});if(b&&!tie&&bv>=2)awards.push({k:'Ключник',t:'открыл(а) больше всех замков',pid:b.pid});
    const clean_=S.players.filter(p=>((e.cnt[p.pid]||{}).solve||0)>=1&&!((e.cnt[p.pid]||{}).wrong));if(clean_.length===1)awards.push({k:'Без единой ошибки',t:'ни одного неверного кода',pid:clean_[0].pid})}
  awards.forEach(a=>pts[a.pid]++);
  S.win={side:won?'town':'lost',why:won?`Вы выбрались. Осталось ${eFmt(left)}.`:e.caught?'Вас поймали.':ERR().id==='clock'?'Время вышло. Вы остались в мастерской.':'Время вышло. Вы не успели.'};S.final={pts,won:wonP,stars,awards,goals:{},snipe:{}};chron(S.win.why);setPhase('end')}
setInterval(()=>{if(!S||!ES()||S.phase!=='esc')return;const el=document.getElementById('etmr');if(el){const t=eLeft();el.textContent=eShow(t);el.classList.toggle('low',t<=300)}
  const pt=ePat(),pk_=pt?pt[0]:0;if(ui.ePat!==pk_){const f=ui.ePat===undefined;ui.ePat=pk_;if(!f){if(pt)SND.sting&&SND.sting('night');render()}}if(pt){const pe=document.getElementById('epat');if(pe)pe.textContent=Math.max(0,eLeft()-(pt[0]*60-pt[1]))+' с'}
  const sc_=ERR().scares.filter(([m])=>eLeft()<=m*60).length;if(ui.eScare!==sc_){const first=ui.eScare===undefined;ui.eScare=sc_;if(!first&&sc_){SND.sting&&SND.sting('night');render()}}
  if((S.local||isHost)&&S.esc.end&&Date.now()>S.esc.end){eFinish(false);commit()}},1000);

  S.players.forEach(p=>{const imp=p.role==='imp';won[p.pid]=imp?side==='imp':side==='crew';pts[p.pid]=(won[p.pid]?3:0)+(imp?(I.kills[p.pid]||0):Math.floor(I.done[p.pid].length/2));snipe[p.pid]=I.votesOk[p.pid]||0});
  const best=(f,k,t,min)=>{let b=null,bv=0,tie=false;S.players.forEach(p=>{const v=f(p);if(v>bv){bv=v;b=p;tie=false}else if(v===bv)tie=true});if(b&&!tie&&bv>=min)awards.push({k,t,pid:b.pid})};
  best(p=>I.kills[p.pid]||0,'Тень станции','больше всех устранений',2);best(p=>p.role!=='imp'?I.done[p.pid].length:0,'Трудяга','больше всех заданий',3);best(p=>I.votesOk[p.pid]||0,'Чутьё','чаще всех голосовал(а) против самозванца',1);
  awards.forEach(a=>pts[a.pid]++);
  S.win={side:side==='crew'?'town':'imp',why};S.final={pts,won,snipe,awards,goals:{}};chron(why);setPhase('end')}
function iCheck(){if(S.phase==='end')return true;const I=S.im,[d,t]=iTasksTotal(),ia=iImpAlive().length,ca=iCrewAlive().length;
  if(!ia){iWin('crew','Все самозванцы раскрыты. Станция спасена.');return true}
  if(ia>=ca){iWin('imp','Самозванцев столько же, сколько экипажа. Станция потеряна.');return true}
  if(t&&d>=t){iWin('crew','Все задания выполнены. Двигатели запущены, «Полярис» уходит домой.');return true}
  return false}
function iMeet(by,body){const I=S.im;I.meet={by,body,room:I.pos[by],at:Date.now()};I.sab=I.sab&&I.sab.k==='reactor'?null:I.sab;
  chron(body?`${nm(by)} нашёл(ла) тело: ${nm(body)} (${IROOM[I.pos[by]][0]}).`:`${nm(by)} созвал(а) экстренное собрание.`);setPhase('meet')}
function iVoteRes(){const I=S.im,al=S.players.filter(p=>p.alive);const c={};let skip=0;
  al.forEach(p=>{const v=(S.inp[p.pid]||{}).iv;if(!v||v==='skip')skip++;else c[v]=(c[v]||0)+1;if(v&&v!=='skip'&&iImp(v)&&p.role!=='imp')I.votesOk[p.pid]=(I.votesOk[p.pid]||0)+1});
  let top=null,tv=0,tie=false;for(const [k,v] of Object.entries(c)){if(v>tv){tv=v;top=k;tie=false}else if(v===tv)tie=true}
  let txt,ej=null;if(!top||tie||tv<=skip)txt=tie?'Голоса разделились. Никого не выбросили.':'Большинство пропустило голосование. Никого не выбросили.';
  else{ej=top;P(top).alive=false;const left=iImpAlive().length;txt=`${nm(top)} выброшен(а) в шлюз. `+(I.conf?(iImp(top)?`${nm(top)} был(а) самозванцем.`:`${nm(top)} не был(а) самозванцем.`)+` Самозванцев осталось: ${left}.`:'')}
  I.res={ej,txt,tally:al.map(p=>[p.pid,(S.inp[p.pid]||{}).iv||'skip'])};chron(txt);setPhase('ires');I.resAt=Date.now()}
function iAuto(){const I=S.im,now=Date.now(),ph=S.phase;if(!I)return;
  if(ph==='ideal'){const r=S.players.filter(p=>(S.inp[p.pid]||{}).rdy).length;if(r>=S.players.length||age()>20)iPlay();return}
  if(ph==='play'){if(I.sab&&I.sab.k==='reactor'&&now>I.sab.end){iWin('imp','Реактор расплавился. Станция потеряна.');return}iCheck();return}
  if(ph==='meet'){const al=S.players.filter(p=>p.alive),g=al.filter(p=>(S.inp[p.pid]||{}).go).length;if(age()>75||(al.length&&g>=al.length)||(g>=Math.floor(al.length/2)+1&&age()>30))setPhase('ivote');return}

function iForce(){if(S.phase==='ideal')iPlay();else if(S.phase==='meet')setPhase('ivote');else if(S.phase==='ivote')iVoteRes();else if(S.phase==='ires'){if(!iCheck())iPlay()}}

  const set=(kk,val)=>{if(JSON.stringify((S.inp[pid]||{})[kk])===JSON.stringify(val))return false;S.inp[pid]={...(S.inp[pid]||{}),[kk]:val};iAuto();return true};
  if(k==='rdy'&&ph==='ideal')return set('rdy',true);

  if(k==='iv'&&ph==='ivote'&&p.alive){if(v!=='skip'&&!(P(v)?.alive))return false;return set('iv',v)}

    t.alive=false;I.bodies.push({pid:t.pid,room:here});I.killer[t.pid]=pid;I.kills[pid]=(I.kills[pid]||0)+1;I.kcd[pid]=now+I.kcdLen;chron(`Кто-то погиб в отсеке «${IROOM[here][0]}».`);iCheck();return true}
  if(k==='rp'){if(!p.alive)return false;const b=I.bodies.find(x=>x.room===here);if(!b)return false;iMeet(pid,b.pid);return true}
  if(k==='btn'){if(!p.alive||here!=='caf'||I.btn[pid]||(I.sab&&I.sab.k==='reactor')||now-(I.playAt||0)<12000)return false;I.btn[pid]=1;iMeet(pid,null);return true}
  if(k==='sab'){if(!p.alive||p.role!=='imp'||I.sab||now<I.sabCd||!ISAB[v.k])return false;I.sab={k:v.k,at:now,end:v.k==='reactor'?now+45000:0,fx:{}};I.sabCd=now+45000;return true}
  if(k==='fix'){const s=I.sab;if(!s||!p.alive)return false;
    if(s.k==='lights'&&here==='ele'||s.k==='comms'&&here==='com'){I.sab=null;I.sabCd=Math.max(I.sabCd,now+30000);chron(`${p.name} починил(а): ${ISAB[s.k][0].toLowerCase()}.`);return true}
    if(s.k==='reactor'&&(here==='rea'||here==='nav')){if(s.fx[here]===pid)return false;s.fx[here]=pid;if(s.fx.rea&&s.fx.nav&&s.fx.rea!==s.fx.nav){I.sab=null;I.sabCd=Math.max(I.sabCd,now+30000);chron('Реактор стабилизирован.')}return true}
    return false}
  return false}

const gameUrl=()=>location.origin+location.pathname+'#g-'+S.code;

  h+=`</div><div class="box"><div class="lbl">Игроки: ${S.players.length} ${S.players.length<minP()?'· нужно минимум '+minP():''}</div>
  ${S.players.map(p=>`<div class="pl"><span class="av">${esc(p.name.slice(0,1).toUpperCase())}</span><span class="nm"><b>${esc(p.name)}${p.pid===me.pid&&!S.local?' (вы)':''}</b>${!S.local&&p.pid===S.hostPid?'<span class="tiny mute">создатель · играет как все</span>':''}${!S.local&&isHost&&p.pid!==me.pid&&!onlinePids().has(p.pid)?'<span class="tiny" style="color:#ff8a90">не в сети</span>':''}</span>${host&&p.pid!==S.hostPid?`<button class="btn sm ghost" data-act="kick" data-v="${esc(p.pid)}">Убрать</button>`:''}</div>`).join('')}
  ${S.local?`<div class="row"><input id="addn" maxlength="20" placeholder="Имя игрока" style="flex:1 1 160px" autocomplete="off"><button class="btn" data-act="addLocal">Добавить</button></div>`:''}
  </div>
  ${SVM()&&!S.local?`<div class="box"><div class="lbl">${ES()?'Комната':DT()?'Дело':BK()?'Катастрофа':'Сценарий'} · голосование</div><p class="small mute">${S.svLock?'Создатель выбирает сам. Голоса не учитываются.':'Тапните, во что хотите играть. Побеждает больше голосов, при ничьей — жребий. Создатель может начать в любой момент.'}</p>${!S.svLock&&svLeader().bv?`<p class="small">Лидирует: <b>${esc(svLeader().best.map(svTitle).join(' / '))}</b> · ${svLeader().bv} гол.</p>`:''}${S.svLock?(isHost?(ES()?erStrip(S.room,'pickRoom'):DT()?dcStrip(S.dcase,'pickDcase'):BK()?catStrip(S.cat,'pickCat'):scenStrip(S.scen,'pickScen')):''):svStrip()}${isHost?`<button class="btn sm ghost" data-act="svLock">${S.svLock?'Вернуть голосование':'Выбрать самому, без голосования'}</button>`:''}</div>`:''}

  ${DT()&&S.local?`<div class="lbl">Дело — выберите</div>${dcStrip(S.dcase,'pickDcase')}`:''}

function optsHtml(){const host=isHost||S.local,n=S.players.length,o=S.opts||{};
  return `<div class="box"><div class="lbl">Особые роли ${host?'· включите по желанию':''}</div>${['grd','jur','wit','hun','man','trt'].map(r=>{const on=!!o[r],ok=n>=SPEC[r].min;return `<button class="opt ${on?'on':''}" ${host?`data-act="opt" data-v="${r}"`:'disabled'} style="margin:8px 0;padding:10px 14px;min-height:0"><b>${esc(SPEC[r].n)}</b> ${on?'<span class="chip acc">включена</span>':''}<span class="tiny mute" style="display:block">${esc(SPEC[r].d)}</span><span class="tiny" style="display:block;color:${ok?'var(--mute)':'#ff8a90'}">от ${SPEC[r].min} игроков${on&&!ok?' — сейчас не войдёт в раздачу':''}</span></button>`}).join('')}<p class="tiny mute">Особые роли заменяют мирных, хотя бы один мирный остаётся всегда. Мест: при 5 игроках — 1, при 6 — 2, дальше больше. Если включить больше ролей, чем мест, в раздачу попадут случайные, и никто не знает, какие именно.</p></div>`}
function card(pid){if(COOP())return coopCard(pid);const p=P(pid),s=sc(),on=ui.flip[pid],side=SIDE(p.role);
  const team=p.role==='maf'?S.players.filter(x=>x.role==='maf'&&x.pid!==pid).map(x=>x.name):[];
  const g={maf:'mask',doc:'cross',det:'eye',civ:'user',grd:'shield',jur:'eye',man:'skull',trt:'mask',wit:'eye',hun:'skull'}[p.role]||'user';
  const cls={grd:'doc',jur:'det',man:'maf',trt:'maf',wit:'det',hun:'civ'}[p.role]||p.role;
  const lab=side==='maf'?(p.role==='trt'?'Тайно за мафию':'Команда мафии'):side==='man'?'Сам за себя':'Команда выживших';
  return `<button class="card ${on?'on':''}" data-act="flip" data-v="${esc(pid)}" aria-label="Карта роли"><div class="cin">
   <div class="cb back"><div class="em">${pic(s.id).replace('preserveAspectRatio="xMidYMid slice"','preserveAspectRatio="xMidYMid meet"')}</div><p>Нажми, чтобы открыть.<br><span class="tiny mute">Никому не показывай</span></p></div>
   <div class="cb front r-${cls}"><svg><use href="#i-${g}"/></svg><h3>${esc(RN(p.role))}</h3><em>${lab}</em><p>${esc(RD(p.role))}</p>${team.length?`<p><b>Свои: ${esc(team.join(', '))}</b></p>`:''}</div>
  </div></button>
  <div class="legend"><div class="lbl">Твой персонаж для отыгрыша</div><b>${esc(p.ch)}</b><p class="small mute">${esc(p.chd)}</p>
  ${p.goal?`<div class="lbl" style="margin-top:10px">Тайная личная цель (+2 очка)</div><p class="small">${esc(p.goal.t)}</p>`:''}
  ${(p.pocket||[]).length?`<div class="lbl" style="margin-top:10px">В кармане</div><p class="small">${p.pocket.map(i=>`<b>${esc(POCKET[i].n)}</b> — ${esc(POCKET[i].d)}`).join('<br>')}</p>`:''}</div>`}

function coopCard(pid){const p=P(pid),s=sc(),on=ui.flip[pid],pk=PERK[p.perk]||{n:'',d:''};
  return `<button class="card ${on?'on':''}" data-act="flip" data-v="${esc(pid)}" aria-label="Карта персонажа"><div class="cin">
   <div class="cb back"><div class="em">${pic(s.id).replace('preserveAspectRatio="xMidYMid slice"','preserveAspectRatio="xMidYMid meet"')}</div><p>Нажми, чтобы открыть.<br><span class="tiny mute">Задачи держи в секрете</span></p></div>
   <div class="cb front r-doc"><svg><use href="#i-user"/></svg><h3>${esc(p.ch)}</h3><em>${esc(pk.n)}</em><p>${esc(pk.d)}</p><p class="tiny">${esc(p.chd)}</p></div>
  </div></button>
  <div class="legend"><div class="lbl">Тайные личные задачи (+2 очка за каждую)</div>${(p.tasks||[]).map(t=>`<p class="small">${esc(t.t)}</p>`).join('')}
  ${(p.pocket||[]).length?`<div class="lbl" style="margin-top:10px">В кармане</div><p class="small">${p.pocket.map(i=>`<b>${esc(POCKET[i].n)}</b> — ${esc(POCKET[i].d)}`).join('<br>')}</p>`:''}
  <p class="tiny mute" style="margin-top:8px">Здоровье: 3. На нуле — без сознания, пока кто-то не поможет.</p></div>`}
function goals(){if(COOP())return `<div class="box"><div class="lbl">Цель группы</div><p class="small">Продержаться до эвакуации: она придёт утром после дня ${S.evac}. Ни одна шкала не должна упасть до нуля, и хотя бы один из вас должен быть в сознании.</p><div class="lbl" style="margin-top:8px">Ваши личные цели</div><p class="small">У каждого две тайные задачи. Можно помогать группе и при этом тихо гнуть свою линию: беречь предмет, не лезть в вылазки, дежурить чаще других.</p></div>`;const s=sc();return `<div class="box"><div class="lbl">Две цели выживших</div><p class="small">1. Вычислить и изгнать всех: ${esc(s.roles.maf.gen)}.<br>2. Не дать ни одной шкале упасть до нуля и дотянуть до эвакуации (день ${S.evac}).</p><div class="lbl" style="margin-top:8px">Мафия побеждает, если</div><p class="small">их станет столько же, сколько остальных, если шкала упадёт до нуля или если они доживут до эвакуации.</p>${S.players.some(p=>p.role==='man')?'<div class="lbl" style="margin-top:8px">Маньяк</div><p class="small">Играет сам за себя и побеждает, если останется в последней паре выживших.</p>':''}</div>`}

function privBox(vp){const p=P(vp);if(!vp||!p||!p.role)return '';const n=S.priv[vp]||[],pk=p.pocket||[];
  if(COOP())return `<details class="box acc"><summary>Мои задачи${pk.length?', карман ('+pk.length+')':''}${n.length?', заметки ('+n.length+')':''}</summary><p class="small"><b>${esc(PERK[p.perk]?.n||'')}:</b> ${esc(PERK[p.perk]?.d||'')}</p>${(p.tasks||[]).map(t=>`<p class="small">• ${esc(t.t)}</p>`).join('')}${pk.length?`<p class="small"><b>Карман:</b><br>${pk.map(i=>esc(POCKET[i].n)+' — '+esc(POCKET[i].d)).join('<br>')}</p>`:''}${n.map(t=>`<p class="small">${esc(t)}</p>`).join('')}</details>`;
  return `<details class="box acc"><summary>Моё тайное: роль, цель${pk.length?', карман ('+pk.length+')':''}${n.length?', заметки ('+n.length+')':''}</summary><p class="small"><b>Роль:</b> ${esc(RN(p.role))}</p><p class="small"><b>Личная цель:</b> ${esc(p.goal?.t||'—')}</p>${pk.length?`<p class="small"><b>Карман:</b><br>${pk.map(i=>esc(POCKET[i].n)+' — '+esc(POCKET[i].d)).join('<br>')}</p>`:''}${n.map(t=>`<p class="small">${esc(t)}</p>`).join('')}</details>`}
function pocketUse(vp){const p=P(vp);if(!p||!p.alive)return '';const pk=(p.pocket||[]).filter(i=>i!=='vt');if(!pk.length)return '';const u=mine('use',vp);
  if(u)return `<div class="box acc"><p class="small">Использовано этой ночью: <b>${esc(POCKET[u.id].n)}</b>${u.t?' на '+esc(nm(u.t)):''}</p></div>`;
  return `<div class="box"><div class="lbl">Карман · можно использовать до выбора</div>${pk.includes('rp')?`<button class="btn sm" style="width:100%;margin:4px 0" data-act="use" data-v="rp">Сухпаёк: +1 к самой низкой шкале</button>`:''}${pk.includes('bn')?`<div class="small" style="margin-top:6px">Бинты (+2 здоровья) для:</div><div class="spk">${S.players.map(x=>`<button data-act="bnd" data-v="${esc(x.pid)}">${esc(x.name)}${x.pid===vp?' (я)':''}</button>`).join('')}</div>`:''}${pk.includes('sh')?`<button class="btn sm" style="width:100%;margin:4px 0" data-act="use" data-v="sh">Оберег: меня этой ночью не убить</button>`:''}${pk.includes('sp')?`<div class="small" style="margin-top:6px">Жучок на игрока:</div><div class="spk">${alive().filter(x=>x.pid!==vp).map(x=>`<button data-act="spy" data-v="${esc(x.pid)}">${esc(x.name)}</button>`).join('')}</div>`:''}</div>`}
function huntBox(vp){if(!S.hunt)return '';const h=P(S.hunt.pid);if(!h)return '';const can=S.local||vp===h.pid;
  return `<div class="box" style="border-color:var(--red)"><div class="lbl">Последний выстрел охотника</div><p>${esc(h.name)} — охотник! Перед смертью он может забрать с собой одного игрока.</p>${can?`<div class="spk" style="flex-wrap:wrap">${alive().filter(p=>p.pid!==h.pid).map(p=>`<button data-act="shot" data-v="${esc(p.pid)}">${esc(p.name)}</button>`).join('')}</div>`:'<p class="small mute">Охотник целится… Игра продолжится после выстрела.</p>'}</div>`}
function nevBox(vp){if(S.nev==null||!P(vp)?.alive)return '';const ev=NEV[S.nev],my=mine('ne',vp);
  return `<div class="box acc"><div class="lbl">Ночное событие · голосуют все тайно</div><h3>${esc(ev.t)}</h3><p class="small">${esc(ev.x)}</p><div class="row"><button class="btn ${my==='y'?'pri':''}" data-act="ne" data-v="y">Да</button><button class="btn ${my==='n'?'pri':''}" data-act="ne" data-v="n">Нет</button></div></div>`}


function micPanel(){if(!S)return '';const A=S.players.filter(p=>p.alive);const spk=ui.speaker&&P(ui.speaker)?ui.speaker:(S.local?A[0]?.pid:me.pid);ui.speaker=spk;
  const micOk=!ui.noMic&&NSR;
  const recent=[...S.log,...ui.pend].slice(-4).reverse();
  return `<div class="box"><div class="lbl">Реплики в протокол · говорит:</div>
  <div class="spk">${A.map(p=>`<button class="${p.pid===spk?'on':''}" data-act="spk" data-v="${esc(p.pid)}">${esc(p.name)}</button>`).join('')}</div>
  <div class="mic">${micOk?`<button class="micb ${ui.listening?'on':''}" data-act="mic" aria-label="Микрофон"><svg><use href="#i-mic"/></svg></button>`:''}<textarea id="draft" data-bind="draft" placeholder="Ключевая фраза…">${esc(ui.draft)}</textarea><button class="btn sm pri" data-act="say">В протокол</button></div>
  <p class="tiny mute" id="partial">${esc(ui.partial)||(micOk?'Кнопка слева пишет речь, или надиктуйте микрофоном клавиатуры':'Надиктуйте микрофоном клавиатуры телефона или напишите')}</p>
  ${recent.map(l=>`<p class="q"><b>${esc(nm(l.s))}:</b> ${hl(l.t)}</p>`).join('')}</div>`}
function hl(t){let x=esc(t);const names=S.players.map(p=>esc(p.name)).filter(n=>n.length>1).sort((a,b)=>b.length-a.length).map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const re=new RegExp(`(клянусь|честно|точно|я не|не я|видел[аи]?|слышал[аи]?|вру|врёт|врет|подозр[а-яё]*|мафи[а-яё]*|${names.join('|')||'zzzz'})`,'gi');return x.replace(re,'<mark>$1</mark>')}

function netBanner(){return (!S||S.local||isHost||!net.status)?'':`<div class="box" style="border-color:var(--red)"><p class="small">${esc(net.status)}</p></div>`}
function gameView(){const vp=viewPid();let h=(PK()?pTop():IM()?iTop():ES()?eTop():DT()?dTop():CL()?cTop():BK()?bTop():topBar())+netBanner();
  h+=`<div class="tabs"><button class="${ui.tab==='game'?'on':''}" data-act="tab" data-v="game">Игра</button><button class="${ui.tab==='dos'?'on':''}" data-act="tab" data-v="dos">${PK()?'История':'Досье'}</button><button class="${ui.tab==='rules'?'on':''}" data-act="tab" data-v="rules">Правила</button></div>`;
  if(ui.tab==='dos')return h+(PK()?pDossier():IM()?iDossier(vp):ES()?eDossier(vp):DT()?dDossier(vp):BK()?bDossier():dossier());
  if(ui.tab==='stats')return h+statsHtml();
  if(ui.tab==='rules')return h+(PK()?pRules()+pCombos():IM()?iRules():ES()?eRules():DT()?dRules():CL()?cRules():BK()?bRules():goals()+(COOP()?coopRules():rulesHtml()));
  if(S.local&&S.lq&&S.lq.i<S.lq.q.length&&!S.lq.show){const pid=S.lq.q[S.lq.i];
    return h+`<div class="pass"><p class="mute">${esc({deal:'Раздача карт',mission:'Тайный выбор отряда',night:'Ночь',reveal:'Раскрытие карт'}[S.phase]||'')} · ${S.lq.i+1} из ${S.lq.q.length}</p><p>Передай телефон</p><div class="nmx">${esc(nm(pid))}</div><button class="btn pri" data-act="lqShow">Я ${esc(nm(pid))} — показать</button><p class="tiny mute">Остальные отворачиваются</p></div>`}
  if(PK())return h+pPhase(vp);
  if(IM())return h+iPhase(vp);
  const me_=P(vp);
  if(!S.local&&!me_&&S.phase!=='end')h+=`<div class="box"><p>Игра уже идёт без вас. Можно наблюдать.</p></div>`;
  if(me_&&!me_.alive&&S.phase!=='end')h+=`<div class="box" style="border-color:var(--red)"><p><b>Вы выбыли.</b> Наблюдайте молча: мёртвые не подсказывают.</p></div>`;
  if(DT())return h+dPhase(vp);
  if(ES())return h+ePhase(vp);
  if(CL()){h+=cPhase(vp);if(!S.local&&vp&&!['deal','end'].includes(S.phase))h+=cNotes(vp);return h}
  if(BK()){h+=bPhase(vp);if(!S.local&&vp&&(S.priv[vp]||[]).length&&!['deal','end'].includes(S.phase))h+=`<details class="box acc"><summary>Мои заметки</summary>${S.priv[vp].map(t=>`<p class="small">${esc(t)}</p>`).join('')}</details>`;if(!S.local&&vp&&!['deal','end','intro'].includes(S.phase))h+=`<details class="box"><summary>Мои карты</summary>${bMine(vp)}</details>`;return h}
  h+=phaseView(vp);
  if(!S.local&&vp&&!['deal','end'].includes(S.phase))h+=privBox(vp);
  return h}

  const nar=t=>`<div class="narr"><div class="k">${esc(t)}</div><p>${esc(narr())}</p></div>`;
  switch(ph){
  case 'deal':{if(!vp)return '';const rd=mine('ready',vp);

function coopRules(){return `<details class="box"><summary>Правила за минуту</summary><ul class="rules small">

<li><b>День:</b> кризис → голосуете за решение. Для вылазки лидер дня выбирает отряд, и каждый тайно решает: выложиться или беречь себя. Провал ранит выложившихся.</li>

function rulesHtml(){return `<details class="box"><summary>Правила за минуту</summary><ul class="rules small">

<li>Каждую ночь одна шкала проседает на 1. Мафия побеждает при равенстве числа, падении шкалы до нуля или если доживёт до эвакуации.</li>
<li><b>Особые роли</b> включаются в лобби: Телохранитель, Журналист, Свидетель, Охотник (от 5 игроков), Маньяк и Предатель (от 6). Включите несколько — в раздачу попадут случайные.</li>

<li><b>Карман:</b> некоторые находят тайные предметы — Оберег, Жучок, Апелляцию. О них знаешь только ты, так что можно блефовать.</li>

<li><b>Ночные события:</b> иногда ночью всем приходит общий вопрос «да/нет», и решение большинства влияет на утро.</li></ul></details>`}

  echk:v=>{const z=ePz(v),a=ui.ein[v];let val=z.ty==='code'?a.join(''):z.ty==='seq'?a.join(''):z.ty==='clock'?a[0]+':'+String(a[1]).padStart(2,'0'):(ui['ew_'+v]||'');if(!val)return toast('Сначала введите ответ');if(z.ty==='seq'&&a.length<z.n)return toast('Нужно '+z.n+' символа');if(z.ty==='seq')ui.ein[v]=[];if(z.ty==='word')ui['ew_'+v]='';send('ans',{p:v,v:val,n:rid(6)},S.local?S.players[0].pid:me.pid)},
  ehint:v=>{if(ui.eh!==v){ui.eh=v;render();return}ui.eh=null;send('hint',{p:v,n:rid(6)},S.local?S.players[0].pid:me.pid)},
  dnext:()=>{dAdvance();ui.dDoc=null;commit()},
  noop:()=>{},
  dopen:v=>{ui.dDoc=v;render()},
  dclose:()=>{ui.dDoc=null;render()},
  dshare:v=>{send('share',{id:v,n:rid(6)},viewPid()||me.pid);ui.dDoc=null;render()},
  dreq:v=>{send('req',{id:v,n:rid(6)},S.local?S.players[0].pid:me.pid)},
  dcode:v=>{const val=(ui['c_'+v]||'').trim();if(!/^\d{4}$/.test(val))return toast('Нужно 4 цифры');ui['c_'+v]='';send('code',{k:v,val,n:rid(6)},S.local?S.players[0].pid:me.pid)},
  dans:v=>{const [q,a]=v.split(':');ui.dAcc=ui.dAcc||{};ui.dAcc[q]=a;render()},
  dsend:()=>{const a={...(ui.dAcc||{})};if(!DD().qs.every(q=>a[q.k]))return;if(!S.local)ui.dSent=S.pk;send('acc',a,S.local?S.players[0].pid:me.pid)},
  pickCatHome:v=>{ui.cat=v;render()},
  pickCat:v=>{if(!(isHost||S.local))return;S.cat=v;ui.cat=v;commit()},
  brv:v=>send('rv',v,viewPid()),
  boa:v=>send('oa',v,viewPid()),
  bvote:v=>send('bv',v,viewPid()),
  bact:v=>{const p=P(viewPid());if(!p)return;send('act',BACT[p.action].t?{t:v}:{},viewPid())},
  blv:v=>{ui.confirm=ui.confirm===v?null:v;render()},
  blvGo:()=>{const t=ui.confirm;ui.confirm=null;if(t){bResolve(t);commit()}},
  bnext:()=>{bAdvance();commit()},
  local:()=>{if($('#nm'))needNameSoft();LS.del('maf.local');S=null;startLocal(false)},
  localResume:()=>startLocal(true),
  leave:()=>{if(S&&S.local&&S.phase!=='lobby'&&S.phase!=='end'){LS.set('maf.local',S)}leave()},
  addLocal:()=>{const el=$('#addn');const v=clean(el?.value).slice(0,20);if(!v)return;if(S.players.some(p=>p.name.toLowerCase()===v.toLowerCase()))return toast('Такое имя уже есть');S.players.push({pid:rid(),name:v,alive:true});commit();setTimeout(()=>$('#addn')?.focus(),0)},
  kick:v=>{S.players=S.players.filter(p=>p.pid!==v);if(!S.local)S.kicked.push(v);commit()},
  start:()=>{if(S.players.length<minP())return;startGame();commit()},
  force:()=>{force();commit()},
  day1:()=>{startDay();commit()},
  toDiscuss:()=>{afterCres();commit()},
  toVote:()=>{setPhase('vote');ui.confirm=null;commit()},
  toNight:()=>{if(S.hunt)return toast('Сначала охотник стреляет');afterVres();commit()},
  toDay:()=>{if(S.hunt)return toast('Сначала охотник стреляет');afterMorning();commit()},
  shot:v=>{const who=S.hunt&&S.hunt.pid;if(!who)return;if(S.local||isHost){if(input(who,'shot',v))commit()}else{send('shot',v,me.pid)}},
  again:()=>{if(PK()){const pl=S.players.map(p=>({pid:p.pid,name:p.name,alive:true}));const code=S.code,loc=S.local,k=S.kicked,o=S.popts;S=newState(code,loc);S.mode='pok';S.popts=o;S.players=pl;S.kicked=k||[];ui.pkR=0;ui.pkOpen=null;commit();return}
    if(IM()){const pl=S.players.map(p=>({pid:p.pid,name:p.name,alive:true}));const code=S.code,loc=S.local,k=S.kicked,o=S.iopts;S=newState(code,loc);S.mode='imp';S.iopts=o;S.players=pl;S.kicked=k||[];ui.itask=null;ui.iwalk=null;commit();return}
    if(ES()){const pl=S.players.map(p=>({pid:p.pid,name:p.name,alive:true}));const code=S.code,loc=S.local,k=S.kicked,rm=S.room;S=newState(code,loc);S.mode='esc';S.room=rm;S.players=pl;S.kicked=k||[];ui.ein={};ui.eDoc=null;ui.eLast=undefined;ui.eScare=undefined;commit();return}
    if(DT()){const pl=S.players.map(p=>({pid:p.pid,name:p.name,alive:true}));const code=S.code,loc=S.local,k=S.kicked,dc=S.dcase;S=newState(code,loc);S.mode='det';S.dcase=dc;S.players=pl;S.kicked=k||[];ui.dAcc={};ui.dDoc=null;commit();return}
    if(CL()){const pl=S.players.map(p=>({pid:p.pid,name:p.name,alive:true}));const code=S.code,loc=S.local,k=S.kicked,co=S.copts;S=newState(code,loc);S.mode='classic';S.copts=co;S.players=pl;S.kicked=k||[];ui.flip={};commit();return}
    if(BK()){const pl=S.players.map(p=>({pid:p.pid,name:p.name,alive:true}));const code=S.code,loc=S.local,k=S.kicked,cat=S.cat;S=newState(code,loc);S.mode='bunker';S.cat=cat;S.players=pl;S.kicked=k||[];ui.flip={};commit();return}const pl=S.players.map(p=>({pid:p.pid,name:p.name,alive:true}));const scn=S.scen,code=S.code,loc=S.local,k=S.kicked,md=S.mode,op=S.opts;S=newState(code,loc);S.mode=md;S.opts=op||{};S.players=pl;S.scen=scn;S.kicked=k||[];ui.flip={};commit()},
  tmr:v=>{S.timer={end:Date.now()+(+v)*1000,dur:+v};commit()},
  tts:()=>{ui.tts=!ui.tts;if(ui.tts){ui.spoken=null;speak()}else{try{speechSynthesis.cancel()}catch(e){}}render()},
  share:()=>shareLink(),
  flip:v=>{ui.flip[v]=!ui.flip[v];render()},
  ready:()=>send('ready',true,viewPid()),
  go:()=>send('go',true,me.pid),
  cv:v=>send('cv',+v,viewPid()),
  pickOpt:v=>{const o=crDef().o[+v];if(o.need&&!(S.inv[o.need]>0))return;pickOption(+v,{});commit()},
  tsel:v=>{const i=ui.teamSel.indexOf(v);if(i>=0)ui.teamSel.splice(i,1);else if(ui.teamSel.length<teamSize())ui.teamSel.push(v);render()},
  tgo:()=>{if(ui.teamSel.length!==teamSize())return;if(S.local){S.crisis.team=[...ui.teamSel];ui.teamSel=[];setPhase('mission');commit()}else{send('team',[...ui.teamSel],viewPid())}},
  ms:v=>send('ms',v,viewPid()),
  vote:v=>send('vote',v,viewPid()),
  lvote:v=>{ui.confirm=ui.confirm===v?null:v;render()},
  lvoteGo:()=>{const t=ui.confirm;ui.confirm=null;alive().forEach(p=>{S.inp[p.pid]={vote:(t!=='skip'&&p.pid===t)?'skip':t}});resolveVote();commit()},
  na:v=>send('na',v,viewPid()),
  ne:v=>send('ne',v,viewPid()),
  use:v=>send('use',{id:v},viewPid()),
  spy:v=>send('use',{id:'sp',t:v},viewPid()),
  bnd:v=>send('use',{id:'bn',t:v},viewPid()),
  opt:v=>{if(!(isHost||S.local))return;S.opts=S.opts||{};S.opts[v]=!S.opts[v];commit()},
  snd:()=>{SND.on=!SND.on;LS.set('maf.snd',SND.on);if(SND.on){SND.init();SND.cur=null;ambient()}else SND.stop();render()},
  shareCard:()=>shareCard(),
  resetStats:()=>{if(ui.rs){LS.del('maf.stats');ui.rs=false;toast('Статистика очищена')}else{ui.rs=true;toast('Нажмите ещё раз, чтобы очистить')}render()},
  lqShow:()=>{S.lq.show=true;ui.flip={};render()},
  lqNext:()=>{lqNext();commit()},
  tab:v=>{ui.tab=v;render()},
  spk:v=>{ui.speaker=v;render()},
  say:()=>{const t=ui.draft;ui.draft='';addSpeech(t,ui.speaker);render()},
  mic:()=>micToggle(),
};
function needNameSoft(){const v=clean($('#nm')?.value).slice(0,20);if(v){me.name=v;LS.set('maf.name',v)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b.dataset.v)}});
document.addEventListener('input',e=>{const b=e.target.dataset&&e.target.dataset.bind;if(b)ui[b]=e.target.value;if(e.target.id==='nm'){me.name=clean(e.target.value).slice(0,20)}if(e.target.id==='code')ui.code=e.target.value});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;if(id==='addn'){e.preventDefault();A.addLocal()}else if(id==='code'){e.preventDefault();A.join()}else if(id==='draft'&&!e.shiftKey){e.preventDefault();A.say()}});
window.addEventListener('hashchange',()=>{if(S)return;const h=(location.hash||'').match(/^#g-([a-z0-9]{3,8})$/);if(h)joinGame(h[1],true);else{const p=pageFromHash();if(p!==ui.page){ui.page=p;render()}}});

initNet();
}

</script>
